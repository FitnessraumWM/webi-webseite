<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>FlapFlap</title>
<style>
    body {
        margin: 0;
        background: #70c5ce;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }
    canvas {
        display: block;
        background: linear-gradient(#70c5ce, #ffffff);
    }
    .ui, .how-ui {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
    }
    .ui {
        top: 50%;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .how-ui {
        top: 35%; /* moved slightly higher */
        max-width: 500px;
        display: none;
        flex-direction: column;
        gap: 20px;
    }
    .btn {
        padding: 10px 30px;
        background: #888;
        border: 2px solid #555;
        cursor: pointer;
        user-select: none;
    }
    .btn:hover {
        background: #aaa;
    }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="ui" id="mainUI">
    <div class="btn" id="startBtn">Press S to Start</div>
    <div class="btn" id="howBtn">How to Play</div>
    <div class="btn" id="exitBtn">Exit</div>
</div>

<div class="how-ui" id="howUI">
    <p style="color:#000;">Use SPACE to flap normally</p>
    <p style="color:#000;">Use F for stronger flap</p>
    <p style="color:#000;">Use D to descend faster</p>
    <div class="btn" id="backBtn">Back</div>
</div>

<script>
// Canvas Setup
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Scale
var scale = canvas.height / 800;

// Load pipe texture
var pipeImg = new Image();
pipeImg.src = "Pipe_1.png";

// Load jump sound
var jumpSound = new Audio("Jump.wav");
jumpSound.volume = 0.3;

// ----- Game variables -----
var gravity = 1400;
var flapImpulse = -500;     
var pipeSpacing = 500;
var speed = 200;            
var maxSpeed = 500;         
var pipeWidth = 80;         

// descent boost settings
var descentBoost = 2000; 
var shiftPressed = false;

// Player
var player = { 
    x: 150, 
    y: canvas.height / 2, 
    w: 40 * scale, 
    h: 40 * scale, 
    vy: 0 
};

// Game state
var pipes = [];
var lastPipeX = canvas.width;
var score = 0;
var lastScore = 0;
var running = false;

// Difficulty
var difficultyTimer = 0;
var difficultyInterval = 5;

// Add pipe pair
function addPipe(){
    var topHeight = Math.floor(Math.random() * (canvas.height - 400 - 200)) + 50;
    pipes.push({ x: canvas.width, y: 0, w: pipeWidth * scale, h: topHeight, flipped: false });
    pipes.push({ x: canvas.width, y: topHeight + 400, w: pipeWidth * scale, h: canvas.height - topHeight - 400, flipped: true });
    lastPipeX = canvas.width;
}

// Input
document.onkeydown = function(e){
    if(e.keyCode === 32 && running){ player.vy = flapImpulse; jumpSound.play(); }
    if(e.keyCode === 70 && running){ player.vy = flapImpulse * 1.3; jumpSound.play(); }
    if(e.keyCode === 68 && running){ shiftPressed = true; }
    if(e.keyCode === 83 && !running){ reset(); running = true; document.getElementById('mainUI').style.display='none'; }
};
document.onkeyup = function(e){ if(e.keyCode === 68){ shiftPressed = false; } };

// Update
function update(dt){
    if(!running) return;

    player.vy += gravity * dt;
    if (shiftPressed) player.vy += descentBoost * dt;
    player.y += player.vy * dt;

    if(lastPipeX < canvas.width - pipeSpacing) addPipe();

    for(var i=0; i<pipes.length; i++){ pipes[i].x -= speed * dt; }
    pipes = pipes.filter(function(p){ return p.x + p.w > 0; });

    for(var j=0; j<pipes.length; j++){
        var p = pipes[j];
        if(player.x < p.x + p.w &&
           player.x + player.w > p.x &&
           player.y < p.y + p.h &&
           player.y + player.h > p.y){
            running = false;
            document.getElementById('mainUI').style.display='flex';
        }
    }

    if(player.y < 0 || player.y + player.h > canvas.height){
        running = false;
        document.getElementById('mainUI').style.display='flex';
    }

    for(var k=0; k<pipes.length; k += 2){
        if(pipes[k].x + pipeWidth * scale < player.x && !pipes[k].passed){
            pipes[k].passed = true;
            score++;
        }
    }

    lastPipeX -= speed * dt;

    difficultyTimer += dt;
    if(difficultyTimer >= difficultyInterval){
        difficultyTimer = 0;
        if(speed < maxSpeed) speed += 10;
    }
}

// Render pipes without stretching
function drawPipe(p){
    if (!pipeImg.complete) return;
    if(p.flipped){
        let yStart = p.y;
        for(let y=0; y < p.h; y += pipeImg.height){
            ctx.drawImage(pipeImg, p.x, yStart + y, p.w, pipeImg.height);
        }
    } else {
        let yStart = p.y + p.h;
        for(let y=0; y < p.h; y += pipeImg.height){
            ctx.drawImage(pipeImg, p.x, yStart - y - pipeImg.height, p.w, pipeImg.height);
        }
    }
}

// Render
function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Player
    ctx.fillStyle = "#ff0";
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Draw pipes
    for(var i=0; i<pipes.length; i++){ drawPipe(pipes[i]); }

    // HUD
    ctx.fillStyle="#000";
    ctx.font=(24*scale)+"px Arial";
    ctx.textAlign="left";
    ctx.fillText("Score: "+score,20*scale,30*scale);

    ctx.textAlign="right";
    ctx.fillText("Last: "+lastScore,canvas.width-20*scale,30*scale);
    ctx.textAlign="left";

    ctx.font=(18*scale)+"px Arial";
    ctx.fillText("Speed: "+speed.toFixed(0),20*scale,55*scale);

    if(!running){
        ctx.font=(40*scale)+"px Arial";
        ctx.textAlign="center";
        ctx.fillStyle="#000";
        ctx.fillText("Press S to Start", canvas.width/2, canvas.height/2);
        ctx.textAlign="left";
    }
}

// Reset
function reset(){
    lastScore = score;
    player.x = 150;
    player.y = canvas.height / 2;
    player.vy = 0;
    pipes = [];
    score = 0;
    lastPipeX = canvas.width;
    speed = 200;
    difficultyTimer = 0;
    shiftPressed = false;
    addPipe();
}

// UI buttons
document.getElementById('howBtn').onclick = function(){
    document.getElementById('howUI').style.display='flex';
    document.getElementById('mainUI').style.display='none';
};
document.getElementById('backBtn').onclick = function(){
    document.getElementById('howUI').style.display='none';
    document.getElementById('mainUI').style.display='flex';
};
document.getElementById('exitBtn').onclick = function(){ window.close(); };

// Loop
var last = Date.now();
function loop(){
    var now = Date.now();
    var dt = (now - last) / 1000;
    if(dt > 0.05) dt = 0.05;
    update(dt);
    render();
    last = now;
    requestAnimationFrame(loop);
}

// Start loop
reset();
loop();
</script>
</body>
</html>
