<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=veranstaltungen.html">
  <meta name="color-scheme" content="light dark">
  <title>Weiterleitung zu Veranstaltungen · webi.family</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f2ea;
      color: #22201c;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      max-width: 36rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
    }

    p {
      margin: 0 0 20px;
      color: #5d584f;
      font-size: 1.05rem;
      line-height: 1.55;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 20px;
      background: #2d5f52;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    a:focus-visible {
      outline: 3px solid #b98345;
      outline-offset: 4px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #151817;
        color: #f5efe6;
      }

      p {
        color: #d7cec0;
      }
    }
  </style>
  <script>
    window.location.replace("veranstaltungen.html");
  </script>
</head>
<body>
  <main>
    <h1>Veranstaltungen</h1>
    <p>Die Neuigkeiten findest du neu im Bereich Veranstaltungen.</p>
    <a href="veranstaltungen.html">Zu Veranstaltungen</a>
  </main>
</body>
</html>
