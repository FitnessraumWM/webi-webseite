<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Webi Fitness</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body { margin:0; background:#0b0f14; color:#e9eef7; }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { width:100%; max-width:1100px; background:#121a24; border:1px solid #223042; border-radius:18px; padding:16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); position:relative; }

    h1 { font-size:20px; margin:0 0 6px; }
    .sub { color:#a9b6c7; font-size:13px; margin:0 0 14px; line-height:1.4; }

    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#0e1520; border:1px solid #2a3b52; color:#a9b6c7; font-size:12px; }
    .row { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:center; }

    .lang { position:absolute; top:12px; right:12px; display:flex; gap:6px; }
    .lang button { width:auto; padding:6px 10px; border-radius:999px; background:transparent; color:#a9b6c7; border:1px solid #2a3b52; font-weight:700; cursor:pointer; }
    .lang button.active { background:#0e1520; color:#e9eef7; border-color:#4a83ff55; }

    .grid2 { display:grid; grid-template-columns: 360px 1fr; gap:14px; align-items:start; }
    @media (max-width: 920px) { .grid2 { grid-template-columns: 1fr; } }

    .box { border:1px solid #2a3b52; background:#0e1520; border-radius:14px; padding:12px; }

    label { display:block; font-size:12px; color:#a9b6c7; margin: 12px 0 6px; }
    input { width:100%; padding:12px 12px; border-radius:12px; border:1px solid #2a3b52; background:#0b121b; color:#e9eef7; outline:none; }
    input:focus { border-color:#4a83ff; box-shadow:0 0 0 4px rgba(74,131,255,.18); }

    button { padding:12px; border-radius:12px; border:0; background:#4a83ff; color:#08111f; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .ghost { background:transparent; color:#cfe0ff; border:1px solid #2a3b52; font-weight:800; }

    .msg { margin-top:12px; padding:10px 12px; border-radius:12px; font-size:13px; line-height:1.35; border:1px solid #2a3b52; background:#0b121b; color:#cfe0ff; }
    .err { border-color:#ff5a7a55; color:#ffd1da; }
    .ok  { border-color:#35d07f55; color:#caffdf; }

    .muted { color:#a9b6c7; font-size:12px; }
    .scroll { max-height:520px; overflow:auto; padding-right:6px; }

    /* Month grid - responsive, no horizontal scroll */
    .monthGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    @media (max-width: 520px) { .monthGrid { gap:6px; } }

    .cellBtn {
      text-align:left; padding:10px; border-radius:12px;
      border:1px solid #2a3b52; background:#0b121b;
      color:#e9eef7; cursor:pointer; min-height:64px;
    }
    .cellBtn.dim { background:transparent; opacity:.55; }
    .timeLabel { color:#a9b6c7; font-size:12px; }

    .tabs { display:flex; gap:8px; flex-wrap:wrap; }
    .tabs button { padding:10px 12px; border-radius:12px; }

    /* Modal */
    .modalBack {
      position:fixed; inset:0; background:rgba(0,0,0,.55);
      display:none; align-items:center; justify-content:center; padding:16px; z-index:50;
    }
    .modal {
      width:100%; max-width:520px; background:#121a24; border:1px solid #223042;
      border-radius:18px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.45);
    }
    textarea {
      width:100%; min-height:90px; resize:vertical;
      padding:12px; border-radius:12px; border:1px solid #2a3b52;
      background:#0b121b; color:#e9eef7; outline:none;
    }
    select {
      width:100%; padding:12px; border-radius:12px; border:1px solid #2a3b52;
      background:#0b121b; color:#e9eef7; outline:none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="lang">
        <button id="langDe" type="button">DE</button>
        <button id="langEn" type="button">EN</button>
      </div>

      <h1 id="t_title">Webi Fitness</h1>
      <p id="t_sub" class="sub"></p>

      <div class="row" style="margin:0 0 12px;">
        <span id="statePill" class="pill"></span>
        <span id="userPill" class="pill" style="display:none;"></span>
        <span id="rolePill" class="pill" style="display:none;"></span>
        <span id="backendPill" class="pill" style="display:none;"></span>
      </div>

      <div class="grid2">
        <!-- LEFT -->
        <div class="box">
          <div id="loginBox">
            <label id="t_emailLabel" for="email"></label>
            <input id="email" type="email" autocomplete="email" />
            <div class="row">
              <button id="sendBtn" style="flex:1;"></button>
              <button id="changeBtn" class="ghost" type="button"></button>
            </div>
            <div id="msg" class="msg" style="display:none;"></div>
            <div class="muted" id="t_tip" style="margin-top:10px;"></div>
          </div>

          <div id="signedBox" style="display:none;">
            <div class="row" style="margin-top:0;">
              <button id="logoutBtn" class="ghost" type="button" style="flex:1;"></button>
              <button id="refreshBtn" class="ghost" type="button" style="flex:1;"></button>
            </div>
            <div id="leftMsg" class="msg" style="display:none;"></div>
            <div class="muted" style="margin-top:10px;">
              <span id="leftHint"></span>
            </div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="box">
          <div id="appLocked" class="muted" style="display:none;"></div>

          <div id="appBlock" style="display:none;">
            <div class="row" style="margin:0 0 10px;">
              <span class="pill" id="allowedPill"></span>
              <span class="pill" id="tzPill"></span>
            </div>

            <div class="row" style="margin:0 0 10px;">
              <div class="tabs" style="flex:1;">
                <button class="ghost" id="tabMonth" type="button"></button>
                <button class="ghost" id="tabWeek" type="button"></button>
                <button class="ghost" id="tabDay" type="button"></button>
              </div>
              <input id="dayPicker" type="date" style="max-width:190px;" />
            </div>

            <div id="monthGrid"></div>
            <div id="weekGrid" style="display:none;"></div>
            <div id="dayList" style="display:none;"></div>

            <div class="muted" id="calHint" style="margin-top:10px;"></div>

            <hr style="border:0;border-top:1px solid #223042;margin:14px 0;">

            <div class="row" style="margin-top:0;">
              <div style="font-weight:800;" id="t_myResTitle"></div>
              <div style="flex:1;"></div>
              <button id="myResRefreshBtn" class="ghost" type="button" style="padding:10px 12px;"></button>
            </div>
            <div id="myResList" class="muted" style="margin-top:10px;"></div>

            <div id="appMsg" class="msg" style="display:none;"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Booking modal -->
  <div class="modalBack" id="modalBack">
    <div class="modal">
      <div style="font-size:18px; font-weight:900; margin-bottom:8px;" id="m_title"></div>
      <div class="muted" id="m_info" style="margin-bottom:10px;"></div>

      <label id="m_toLabel"></label>
      <select id="m_toSelect"></select>

      <label id="m_noteLabel" style="margin-top:12px;"></label>
      <textarea id="m_note" placeholder=""></textarea>

      <div class="row">
        <button id="m_bookBtn" style="flex:1;"></button>
        <button id="m_cancelBtn" class="ghost" type="button" style="flex:1;"></button>
      </div>

      <div id="m_msg" class="msg" style="display:none;"></div>
    </div>
  </div>

  <script type="module">
    // =========================
    // 0) CONFIG
    // =========================
    const BACKEND_URL = "https://steep-wildflower-af8b.fitnessraumwm.workers.dev";
    const TZ = "Europe/Zurich";
    const SLOT_MIN = 15;
    const START_HOUR = 5;
    const END_HOUR = 23;
    const FETCH_TIMEOUT_MS = 25000; // frontend timeout

    // =========================
    // 1) Firebase imports
    // =========================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, sendSignInLinkToEmail,
      isSignInWithEmailLink, signInWithEmailLink, signOut
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    // =========================
    // 2) Firebase config
    // =========================
    const firebaseConfig = {
      apiKey: "AIzaSyCY2nmL9I9TjxB0rlVPMCmcl4WKna21IJE",
      authDomain: "fitnessraumwm-app.firebaseapp.com",
      projectId: "fitnessraumwm-app",
      storageBucket: "fitnessraumwm-app.firebasestorage.app",
      messagingSenderId: "130435754352",
      appId: "1:130435754352:web:a8a38eeeee7c25867e47b5",
      measurementId: "G-B629775N63"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // =========================
    // 3) i18n
    // =========================
    const LS_LANG_KEY = "webi_lang";
    const LS_EMAIL_KEY = "webi_emailForSignIn";

    const I18N = {
      de: {
        sub: "Login ohne Passwort: Wir senden dir einen Link per E-Mail. Link öffnen → fertig.",
        emailLabel: "E-Mail",
        emailPh: "z. B. name@domain.ch",
        sendBtn: "Login-Link senden",
        changeBtn: "E-Mail ändern",
        logoutBtn: "Abmelden",
        refreshBtn: "Aktualisieren",
        tip: "Tipp: Wenn du den Link auf einem anderen Gerät öffnest, fragt die App die E-Mail nochmals ab.",
        pill: {
          checking: "prüfe…",
          ready: "bereit",
          linkSent: "Link gesendet",
          foundLink: "Login-Link erkannt",
          askEmail: "E-Mail für Abschluss eingeben",
          signedIn: "angemeldet",
          signedOut: "abgemeldet",
          error: "Fehler"
        },
        msg: {
          invalidEmail: "Bitte eine gültige E-Mail eingeben.",
          sentOk: "Erledigt. Link wurde per E-Mail gesendet. Öffne ihn, um den Login abzuschliessen.",
          sentFail: "Link konnte nicht gesendet werden. Prüfe E-Mail und autorisierte Domain. ",
          needEmail: "Du hast den Login-Link geöffnet, aber die E-Mail ist hier nicht gespeichert. Bitte dieselbe E-Mail eingeben.",
          signOk: "Login erfolgreich.",
          signFail: "Link ungültig oder abgelaufen. Bitte einen neuen Link senden. ",
          changed: "OK. Bitte neue E-Mail eingeben und Link senden.",
          loggedOut: "Abgemeldet.",
          backendFail: "Backend Fehler.",
          timeout: "Backend Fehler: timeout"
        },
        app: {
          allowed: "Zugriff: erlaubt",
          denied: "Zugriff: nicht erlaubt",
          tz: "Zeitzone: Europe/Zurich",
          month: "Monat",
          week: "Woche",
          day: "Tag",
          hint: "Monat: Klick auf Tag → Tages-Slots. Woche: Klick auf Feld → Tag. Tag: Klick auf frei → Reservierung."
        },
        modal: {
          title: "Reservierung",
          toLabel: "Bis",
          noteLabel: "Notiz (optional)",
          notePh: "z. B. komme 10 min später…",
          book: "Buchen",
          cancel: "Abbrechen",
          booked: "Gebucht ✅"
        },
        my: {
          title: "Meine Reservierungen",
          refresh: "Liste aktualisieren",
          none: "Keine kommenden Reservierungen gefunden.",
          cancel: "Stornieren",
          cancelled: "Storniert ✅"
        }
      },
      en: {
        sub: "Passwordless login: we’ll email you a sign-in link. Open the link → you’re in.",
        emailLabel: "Email",
        emailPh: "e.g. name@domain.ch",
        sendBtn: "Send sign-in link",
        changeBtn: "Change email",
        logoutBtn: "Sign out",
        refreshBtn: "Refresh",
        tip: "Tip: if you open the link on another device, the app will ask for your email again.",
        pill: {
          checking: "checking…",
          ready: "ready",
          linkSent: "link sent",
          foundLink: "sign-in link detected",
          askEmail: "enter email to finish",
          signedIn: "signed in",
          signedOut: "signed out",
          error: "error"
        },
        msg: {
          invalidEmail: "Please enter a valid email.",
          sentOk: "Done. We sent you a sign-in link by email. Open it to finish signing in.",
          sentFail: "Couldn’t send the link. Check email and authorized domain. ",
          needEmail: "You opened a sign-in link, but the email isn’t stored here. Please enter the same email.",
          signOk: "Signed in successfully.",
          signFail: "Link is invalid or expired. Please request a new link. ",
          changed: "OK. Enter a new email and send a fresh link.",
          loggedOut: "Signed out.",
          backendFail: "Backend error.",
          timeout: "Backend error: timeout"
        },
        app: {
          allowed: "Access: allowed",
          denied: "Access: denied",
          tz: "Timezone: Europe/Zurich",
          month: "Month",
          week: "Week",
          day: "Day",
          hint: "Month: click a day → day slots. Week: click a cell → day. Day: click free → booking."
        },
        modal: {
          title: "Booking",
          toLabel: "End (to)",
          noteLabel: "Note (optional)",
          notePh: "e.g. I’ll be 10 min late…",
          book: "Book",
          cancel: "Cancel",
          booked: "Booked ✅"
        },
        my: {
          title: "My reservations",
          refresh: "Refresh list",
          none: "No upcoming reservations found.",
          cancel: "Cancel",
          cancelled: "Cancelled ✅"
        }
      }
    };

    function detectInitialLang() {
      const saved = localStorage.getItem(LS_LANG_KEY);
      if (saved === "de" || saved === "en") return saved;
      const nav = (navigator.language || "de").toLowerCase();
      return nav.startsWith("en") ? "en" : "de";
    }

    let LANG = detectInitialLang();
    function t(path) { return path.split(".").reduce((o,k)=>o?.[k], I18N[LANG]); }

    // =========================
    // 4) DOM refs
    // =========================
    const els = {
      pill: document.getElementById("statePill"),
      userPill: document.getElementById("userPill"),
      rolePill: document.getElementById("rolePill"),
      backendPill: document.getElementById("backendPill"),

      loginBox: document.getElementById("loginBox"),
      signedBox: document.getElementById("signedBox"),

      msg: document.getElementById("msg"),
      leftMsg: document.getElementById("leftMsg"),
      appMsg: document.getElementById("appMsg"),

      email: document.getElementById("email"),
      sendBtn: document.getElementById("sendBtn"),
      changeBtn: document.getElementById("changeBtn"),
      logoutBtn: document.getElementById("logoutBtn"),
      refreshBtn: document.getElementById("refreshBtn"),

      langDe: document.getElementById("langDe"),
      langEn: document.getElementById("langEn"),

      appBlock: document.getElementById("appBlock"),
      appLocked: document.getElementById("appLocked"),
      allowedPill: document.getElementById("allowedPill"),
      tzPill: document.getElementById("tzPill"),

      tabMonth: document.getElementById("tabMonth"),
      tabWeek: document.getElementById("tabWeek"),
      tabDay: document.getElementById("tabDay"),
      picker: document.getElementById("dayPicker"),
      month: document.getElementById("monthGrid"),
      week: document.getElementById("weekGrid"),
      day: document.getElementById("dayList"),
      calHint: document.getElementById("calHint"),

      myResTitle: document.getElementById("t_myResTitle"),
      myResRefreshBtn: document.getElementById("myResRefreshBtn"),
      myResList: document.getElementById("myResList"),

      // modal
      modalBack: document.getElementById("modalBack"),
      m_title: document.getElementById("m_title"),
      m_info: document.getElementById("m_info"),
      m_toLabel: document.getElementById("m_toLabel"),
      m_toSelect: document.getElementById("m_toSelect"),
      m_noteLabel: document.getElementById("m_noteLabel"),
      m_note: document.getElementById("m_note"),
      m_bookBtn: document.getElementById("m_bookBtn"),
      m_cancelBtn: document.getElementById("m_cancelBtn"),
      m_msg: document.getElementById("m_msg"),
    };

    function setPillKey(key) { els.pill.textContent = "Status: " + t("pill." + key); }
    function showMsg(el, text, kind="") {
      el.style.display = "block";
      el.className = "msg " + (kind === "err" ? "err" : kind === "ok" ? "ok" : "");
      el.textContent = text;
    }
    function clearMsg(el){ el.style.display="none"; el.textContent=""; el.className="msg"; }

    function applyI18n() {
      document.documentElement.lang = LANG;
      document.getElementById("t_sub").textContent = t("sub");
      document.getElementById("t_emailLabel").textContent = t("emailLabel");
      els.email.placeholder = t("emailPh");
      els.sendBtn.textContent = t("sendBtn");
      els.changeBtn.textContent = t("changeBtn");
      els.logoutBtn.textContent = t("logoutBtn");
      els.refreshBtn.textContent = t("refreshBtn");
      document.getElementById("t_tip").textContent = t("tip");

      els.tabMonth.textContent = t("app.month");
      els.tabWeek.textContent = t("app.week");
      els.tabDay.textContent = t("app.day");
      els.calHint.textContent = t("app.hint");

      els.myResTitle.textContent = t("my.title");
      els.myResRefreshBtn.textContent = t("my.refresh");

      els.m_title.textContent = t("modal.title");
      els.m_toLabel.textContent = t("modal.toLabel");
      els.m_noteLabel.textContent = t("modal.noteLabel");
      els.m_note.placeholder = t("modal.notePh");
      els.m_bookBtn.textContent = t("modal.book");
      els.m_cancelBtn.textContent = t("modal.cancel");

      els.langDe.classList.toggle("active", LANG === "de");
      els.langEn.classList.toggle("active", LANG === "en");
    }

    function setLang(newLang) {
      LANG = newLang;
      localStorage.setItem(LS_LANG_KEY, LANG);
      applyI18n();
    }

    // =========================
    // 5) Firebase email link flow
    // =========================
    const actionCodeSettings = {
      url: window.location.origin + window.location.pathname,
      handleCodeInApp: true
    };

    async function sendLink(email) {
      clearMsg(els.msg);
      els.sendBtn.disabled = true;
      try {
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        localStorage.setItem(LS_EMAIL_KEY, email);
        showMsg(els.msg, t("msg.sentOk"), "ok");
        setPillKey("linkSent");
      } catch (e) {
        console.error(e);
        showMsg(els.msg, t("msg.sentFail") + "(" + (e?.code || "error") + ")", "err");
        setPillKey("error");
      } finally {
        els.sendBtn.disabled = false;
      }
    }

    async function completeSignInIfLink() {
      if (!isSignInWithEmailLink(auth, window.location.href)) return false;
      setPillKey("foundLink");
      clearMsg(els.msg);

      let email = localStorage.getItem(LS_EMAIL_KEY);
      if (!email) {
        setPillKey("askEmail");
        showMsg(els.msg, t("msg.needEmail"), "");
        return true;
      }

      try {
        await signInWithEmailLink(auth, email, window.location.href);
        localStorage.removeItem(LS_EMAIL_KEY);
        window.history.replaceState({}, document.title, window.location.pathname);
        setPillKey("signedIn");
        showMsg(els.msg, t("msg.signOk"), "ok");
        return true;
      } catch (e) {
        console.error(e);
        showMsg(els.msg, t("msg.signFail") + "(" + (e?.code || "error") + ")", "err");
        setPillKey("error");
        return true;
      }
    }

    // =========================
    // 6) Backend calls (timeout)
    // =========================
    async function postBackend_(payload) {
      const user = auth.currentUser;
      if (!user) throw new Error("not_authenticated");

      const idToken = await user.getIdToken(true);

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

      const t0 = performance.now();
      try {
        const r = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...payload, idToken }),
          signal: controller.signal
        });
        const data = await r.json();
        const ms = Math.round(performance.now() - t0);
        els.backendPill.style.display = "inline-block";
        els.backendPill.textContent = "Backend: " + ms + " ms";
        return data;
      } catch (e) {
        if (String(e.name).includes("Abort")) throw new Error("timeout");
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    const backendMe_ = () => postBackend_({ action: "me" });

    const fetchDaySlots_ = (dateYmd) => postBackend_({
      action: "slots_day",
      date: dateYmd,
      slotMin: SLOT_MIN,
      startHour: START_HOUR,
      endHour: END_HOUR
    });

    const fetchWeekSlots_ = (weekStartYmd) => postBackend_({
      action: "slots_week",
      weekStart: weekStartYmd,
      slotMin: SLOT_MIN,
      startHour: START_HOUR,
      endHour: END_HOUR
    });

    const fetchMonthSummary_ = (year, month1to12) => postBackend_({
      action: "summary_month",
      year,
      month: month1to12,
      slotMin: SLOT_MIN,
      startHour: START_HOUR,
      endHour: END_HOUR
    });

    const reserveSlot_ = (fromIso, toIso, note) => postBackend_({
      action: "reserve_slot",
      from: fromIso,
      to: toIso,
      note: note || ""
    });

    const myReservations_ = (days=60) => postBackend_({
      action: "my_reservations",
      days
    });

    const cancelReservation_ = (eventId) => postBackend_({
      action: "cancel_reservation",
      eventId
    });

    // =========================
    // 7) Date/time helpers
    // =========================
    function ymdLocal_(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const da = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${da}`;
    }

    function fmtTime_(iso) {
      const dt = new Date(iso);
      return new Intl.DateTimeFormat(LANG === "de" ? "de-CH" : "en-GB", {
        timeZone: TZ, hour: "2-digit", minute: "2-digit"
      }).format(dt);
    }

    function mondayOf_(anchorYmd) {
      const base = anchorYmd ? new Date(anchorYmd + "T12:00:00") : new Date();
      const day = base.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      const monday = new Date(base);
      monday.setDate(monday.getDate() + diff);
      return ymdLocal_(monday);
    }

    // =========================
    // 8) Views + rendering
    // =========================
    function showView_(v) {
      els.month.style.display = (v === "month") ? "block" : "none";
      els.week.style.display  = (v === "week")  ? "block" : "none";
      els.day.style.display   = (v === "day")   ? "block" : "none";
    }

    async function renderMonth_(anchorYmd) {
      clearMsg(els.appMsg);
      const d = anchorYmd ? new Date(anchorYmd + "T12:00:00") : new Date();
      const year = d.getFullYear();
      const month = d.getMonth() + 1;

      const data = await fetchMonthSummary_(year, month);
      if (!data.ok) throw new Error(JSON.stringify(data));

      const first = new Date(year, month - 1, 1, 12, 0, 0, 0);
      const start = new Date(first);
      const day = start.getDay();
      const offset = (day === 0 ? 6 : day - 1);
      start.setDate(start.getDate() - offset);

      const cells = [];
      for (let i = 0; i < 42; i++) {
        const cd = new Date(start);
        cd.setDate(cd.getDate() + i);

        const y = cd.getFullYear(), m = cd.getMonth() + 1, da = cd.getDate();
        const ymd = `${y}-${String(m).padStart(2,"0")}-${String(da).padStart(2,"0")}`;
        const inMonth = (cd.getMonth() === (month - 1));

        const s = data.summary[ymd];
        const free = s ? s.freeCount : 0;
        const total = s ? s.totalCount : 0;

        cells.push(`
          <button class="cellBtn ${inMonth ? "" : "dim"}" data-ymd="${ymd}">
            <div class="timeLabel">${da}</div>
            <div style="margin-top:6px; font-size:12px;">
              ${s ? `free: <b>${free}</b> / ${total}` : ""}
            </div>
          </button>
        `);
      }

      els.month.innerHTML = `<div class="monthGrid">${cells.join("")}</div>`;

      els.month.querySelectorAll("button[data-ymd]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const ymd = btn.getAttribute("data-ymd");
          els.picker.value = ymd;
          await renderDay_(ymd);
          showView_("day");
        });
      });
    }

    async function renderWeek_(anchorYmd) {
      clearMsg(els.appMsg);
      const weekStartYmd = mondayOf_(anchorYmd || ymdLocal_());
      const data = await fetchWeekSlots_(weekStartYmd);
      if (!data.ok) throw new Error(JSON.stringify(data));

      const rows = [];
      for (let h = START_HOUR; h < END_HOUR; h++) {
        for (const mm of [0, 30]) rows.push({ h, mm });
      }

      const head = data.days.map(d => `
        <div style="text-align:center; color:#a9b6c7; font-size:12px;">
          ${d.date}
        </div>
      `).join("");

      const body = rows.map(r => {
        const label = `${String(r.h).padStart(2,"0")}:${String(r.mm).padStart(2,"0")}`;

        const cols = data.days.map(dayObj => {
          const slot = dayObj.slots.find(s => fmtTime_(s.from) === label);
          const free = slot ? slot.free : false;

          return `
            <button data-ymd="${dayObj.date}" style="
              width:100%; padding:10px; border-radius:10px;
              border:1px solid #2a3b52;
              background:${free ? "#0b121b" : "rgba(255,90,122,0.08)"};
              color:#e9eef7; cursor:pointer;">
            </button>
          `;
        }).join("");

        return `
          <div style="display:grid; grid-template-columns:70px repeat(7,1fr); gap:8px; align-items:center;">
            <div class="timeLabel">${label}</div>
            ${cols}
          </div>
        `;
      }).join("");

      els.week.innerHTML = `
        <div style="display:grid; grid-template-columns:70px repeat(7,1fr); gap:8px; margin-bottom:8px;">
          <div></div>${head}
        </div>
        <div class="scroll" style="display:flex; flex-direction:column; gap:8px;">
          ${body}
        </div>
        <div class="muted" style="margin-top:10px;">
          ${LANG === "de" ? "Klick auf ein Feld öffnet den Tag." : "Click a cell to open that day."}
        </div>
      `;

      els.week.querySelectorAll("button[data-ymd]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const ymd = btn.getAttribute("data-ymd");
          els.picker.value = ymd;
          await renderDay_(ymd);
          showView_("day");
        });
      });
    }

    let currentDaySlots = []; // for booking modal (needs contiguous free slots)
    let currentDayYmd = "";

    async function renderDay_(ymd) {
      clearMsg(els.appMsg);
      const data = await fetchDaySlots_(ymd);
      if (!data.ok) throw new Error(JSON.stringify(data));

      currentDaySlots = data.slots || [];
      currentDayYmd = ymd;

      const items = currentDaySlots.map((s, idx) => {
        const label = `${fmtTime_(s.from)} – ${fmtTime_(s.to)}`;
        const bg = s.free ? "#0b121b" : "rgba(255,90,122,0.08)";
        const txt = s.free ? (LANG === "de" ? "frei" : "free") : (LANG === "de" ? "gebucht" : "booked");

        return `
          <button data-idx="${idx}" style="
            width:100%; text-align:left; padding:10px 12px; border-radius:12px;
            border:1px solid #2a3b52; background:${bg}; color:#e9eef7;
            cursor:${s.free ? "pointer" : "not-allowed"};
            opacity:${s.free ? 1 : 0.75};
          " ${s.free ? "" : "disabled"}>
            <div style="display:flex; justify-content:space-between; gap:10px;">
              <div>${label}</div>
              <div class="timeLabel">${txt}</div>
            </div>
          </button>
        `;
      }).join("");

      els.day.innerHTML = `
        <div class="muted" style="margin-bottom:8px;">${ymd}</div>
        <div class="scroll" style="display:flex; flex-direction:column; gap:8px;">
          ${items}
        </div>
      `;

      els.day.querySelectorAll("button[data-idx]").forEach(btn => {
        btn.addEventListener("click", () => openBookingModal_(Number(btn.getAttribute("data-idx"))));
      });
    }

    // =========================
    // 9) Booking modal (start slot -> choose end "bis")
    // =========================
    let modalStartIdx = -1;

    function modalShow_(show) {
      els.modalBack.style.display = show ? "flex" : "none";
      if (!show) {
        modalStartIdx = -1;
        els.m_toSelect.innerHTML = "";
        els.m_note.value = "";
        clearMsg(els.m_msg);
      }
    }

    function openBookingModal_(startIdx) {
      const s0 = currentDaySlots[startIdx];
      if (!s0?.free) return;

      modalStartIdx = startIdx;
      const startLabel = fmtTime_(s0.from);
      els.m_info.textContent = (LANG === "de")
        ? `Start: ${startLabel}\nWähle Ende (bis) und buche.`
        : `Start: ${startLabel}\nChoose end (to) and book.`;

      // build dropdown with contiguous free end times
      const options = [];
      for (let i = startIdx; i < currentDaySlots.length; i++) {
        const s = currentDaySlots[i];
        if (!s.free) break;
        const endLabel = fmtTime_(s.to);
        options.push({ endIso: s.to, label: endLabel });
      }

      // need at least 1 slot; end is first slot end
      els.m_toSelect.innerHTML = options.map((o, idx) =>
        `<option value="${o.endIso}">${o.label}</option>`
      ).join("");

      modalShow_(true);
    }

    els.m_cancelBtn.addEventListener("click", () => modalShow_(false));
    els.modalBack.addEventListener("click", (e) => { if (e.target === els.modalBack) modalShow_(false); });

    els.m_bookBtn.addEventListener("click", async () => {
      try {
        clearMsg(els.m_msg);

        const s0 = currentDaySlots[modalStartIdx];
        const fromIso = s0.from;
        const toIso = els.m_toSelect.value;
        const note = els.m_note.value || "";

        els.m_bookBtn.disabled = true;
        const res = await reserveSlot_(fromIso, toIso, note);

        if (!res.ok) {
          showMsg(els.m_msg, "Error: " + (res.error || "unknown"), "err");
          return;
        }

        showMsg(els.m_msg, t("modal.booked"), "ok");

        // refresh day + month summary + my reservations
        await renderDay_(currentDayYmd);
        await renderMonth_(currentDayYmd);
        await renderMyReservations_();

        // auto-close modal after short delay
        setTimeout(() => modalShow_(false), 700);
      } catch (e) {
        console.error(e);
        const msg = (String(e).includes("timeout")) ? t("msg.timeout") : (t("msg.backendFail") + " " + String(e));
        showMsg(els.m_msg, msg, "err");
      } finally {
        els.m_bookBtn.disabled = false;
      }
    });

    // =========================
    // 10) My reservations list + cancel
    // =========================
    function fmtDateTime_(iso) {
      const dt = new Date(iso);
      const d = new Intl.DateTimeFormat(LANG === "de" ? "de-CH" : "en-GB", {
        timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit"
      }).format(dt);
      const t2 = new Intl.DateTimeFormat(LANG === "de" ? "de-CH" : "en-GB", {
        timeZone: TZ, hour:"2-digit", minute:"2-digit"
      }).format(dt);
      return `${d} ${t2}`;
    }

    async function renderMyReservations_() {
      try {
        const data = await myReservations_(60);
        if (!data.ok) throw new Error(JSON.stringify(data));
        const list = data.reservations || [];

        if (!list.length) {
          els.myResList.innerHTML = `<div class="muted">${t("my.none")}</div>`;
          return;
        }

        els.myResList.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${list.map(r => `
              <div style="border:1px solid #2a3b52; border-radius:12px; padding:10px; background:#0b121b;">
                <div style="display:flex; gap:10px; align-items:center;">
                  <div style="flex:1;">
                    <div style="font-weight:800;">${fmtDateTime_(r.start)} – ${fmtDateTime_(r.end)}</div>
                    <div class="muted" style="margin-top:4px;">${r.email || ""}${r.note ? " • " + r.note : ""}</div>
                  </div>
                  <button class="ghost" data-cancel="${r.eventId}" style="padding:10px 12px;">
                    ${t("my.cancel")}
                  </button>
                </div>
              </div>
            `).join("")}
          </div>
        `;

        els.myResList.querySelectorAll("button[data-cancel]").forEach(btn => {
          btn.addEventListener("click", async () => {
            const eventId = btn.getAttribute("data-cancel");
            btn.disabled = true;
            try {
              const res = await cancelReservation_(eventId);
              if (!res.ok) throw new Error(res.error || "cancel_failed");
              await renderMyReservations_();
              // also refresh current day + month to reflect freed slots
              if (currentDayYmd) {
                await renderDay_(currentDayYmd);
                await renderMonth_(currentDayYmd);
              }
              showMsg(els.appMsg, t("my.cancelled"), "ok");
              setTimeout(() => clearMsg(els.appMsg), 900);
            } catch (e) {
              console.error(e);
              showMsg(els.appMsg, "Error: " + String(e), "err");
            } finally {
              btn.disabled = false;
            }
          });
        });

      } catch (e) {
        console.error(e);
        els.myResList.innerHTML = `<div class="muted">Error: ${String(e)}</div>`;
      }
    }

    // =========================
    // 11) UI state
    // =========================
    function setLoggedOutUI_() {
      els.userPill.style.display = "none";
      els.rolePill.style.display = "none";
      els.backendPill.style.display = "none";

      els.loginBox.style.display = "block";
      els.signedBox.style.display = "none";

      els.appBlock.style.display = "none";
      els.appLocked.style.display = "none";

      // show subtext when logged out
      document.getElementById("t_sub").style.display = "block";
    }

    function setLoggedInUI_(me) {
      els.userPill.style.display = "inline-block";
      els.rolePill.style.display = "inline-block";
      els.userPill.textContent = me.email || "";
      els.rolePill.textContent = "role: " + (me.role || "none");

      els.loginBox.style.display = "none";
      els.signedBox.style.display = "block";

      els.appBlock.style.display = "block";
      els.tzPill.textContent = t("app.tz");
      els.allowedPill.textContent = me.allowed ? t("app.allowed") : t("app.denied");

      // hide subtext when logged in
      document.getElementById("t_sub").style.display = "none";

      if (!me.allowed) {
        els.appLocked.style.display = "block";
        els.appLocked.textContent = (LANG === "de")
          ? "Du bist nicht freigeschaltet. Bitte Admin kontaktieren."
          : "You are not enabled yet. Please contact an admin.";
      } else {
        els.appLocked.style.display = "none";
      }
    }

    // =========================
    // 12) Bindings
    // =========================
    els.langDe.addEventListener("click", () => setLang("de"));
    els.langEn.addEventListener("click", () => setLang("en"));

    els.sendBtn.addEventListener("click", async () => {
      const email = (els.email.value || "").trim();
      if (!email.includes("@")) return showMsg(els.msg, t("msg.invalidEmail"), "err");
      await sendLink(email);
    });

    els.changeBtn.addEventListener("click", () => {
      localStorage.removeItem(LS_EMAIL_KEY);
      els.email.value = "";
      showMsg(els.msg, t("msg.changed"), "");
      setPillKey("ready");
    });

    els.logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      setPillKey("signedOut");
      showMsg(els.leftMsg, t("msg.loggedOut"), "");
      setLoggedOutUI_();
    });

    els.refreshBtn.addEventListener("click", async () => {
      try {
        clearMsg(els.leftMsg);
        const me = await backendMe_();
        setLoggedInUI_(me);

        if (me.allowed) {
          const ymd = els.picker.value || ymdLocal_(new Date());
          await renderMonth_(ymd);
          showView_("month");
          await renderMyReservations_();
        }
      } catch (e) {
        console.error(e);
        showMsg(els.leftMsg, "Error: " + String(e), "err");
      }
    });

    els.myResRefreshBtn.addEventListener("click", renderMyReservations_);

    els.tabMonth.addEventListener("click", async () => {
      try {
        await renderMonth_(els.picker.value || ymdLocal_());
        showView_("month");
      } catch (e) {
        console.error(e);
        const msg = (String(e).includes("timeout")) ? t("msg.timeout") : String(e);
        showMsg(els.appMsg, msg, "err");
      }
    });

    els.tabWeek.addEventListener("click", async () => {
      try {
        await renderWeek_(els.picker.value || ymdLocal_());
        showView_("week");
      } catch (e) {
        console.error(e);
        const msg = (String(e).includes("timeout")) ? t("msg.timeout") : String(e);
        showMsg(els.appMsg, msg, "err");
      }
    });

    els.tabDay.addEventListener("click", async () => {
      try {
        await renderDay_(els.picker.value || ymdLocal_());
        showView_("day");
      } catch (e) {
        console.error(e);
        const msg = (String(e).includes("timeout")) ? t("msg.timeout") : String(e);
        showMsg(els.appMsg, msg, "err");
      }
    });

    els.picker.addEventListener("change", async () => {
      try {
        await renderDay_(els.picker.value);
        showView_("day");
      } catch (e) {
        console.error(e);
        const msg = (String(e).includes("timeout")) ? t("msg.timeout") : String(e);
        showMsg(els.appMsg, msg, "err");
      }
    });

    // =========================
    // 13) Boot
    // =========================
    applyI18n();
    setPillKey("checking");
    setLoggedOutUI_();

    (async () => {
      const handled = await completeSignInIfLink();

      onAuthStateChanged(auth, async (user) => {
        clearMsg(els.msg);
        clearMsg(els.leftMsg);
        clearMsg(els.appMsg);

        if (!user) {
          if (!handled) setPillKey("ready");
          setLoggedOutUI_();
          return;
        }

        setPillKey("signedIn");
        els.email.value = user.email || "";

        try {
          const me = await backendMe_();
          setLoggedInUI_(me);

          if (me.allowed) {
            // AUTO OPEN CALENDAR (fixes "Kalender button" issue)
            const today = ymdLocal_(new Date());
            els.picker.value = today;

            await renderMonth_(today);
            showView_("month");

            await renderMyReservations_();
          }
        } catch (e) {
          console.error(e);
          const msg = (String(e).includes("timeout")) ? t("msg.timeout") : (t("msg.backendFail") + " " + String(e));
          showMsg(els.msg, msg, "err");
          setPillKey("error");
        }
      });
    })();
  </script>
</body>
</html>
