<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Webi Fitness – Login</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; color-scheme: dark; }
    body { margin:0; background:#0b0f14; color:#e9eef7; }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { width:100%; max-width:980px; background:#121a24; border:1px solid #223042; border-radius:18px; padding:18px; box-shadow: 0 10px 30px rgba(0,0,0,.35); position:relative; }
    h1 { font-size:20px; margin:0 0 6px; }
    .sub { color:#a9b6c7; font-size:13px; margin:0 0 16px; line-height:1.4; }

    label { display:block; font-size:12px; color:#a9b6c7; margin: 12px 0 6px; }
    input, textarea, select {
      width:100%; padding:12px 12px; border-radius:12px; border:1px solid #2a3b52;
      background:#0e1520; color:#e9eef7; outline:none;
    }
    input:focus, textarea:focus, select:focus { border-color:#4a83ff; box-shadow:0 0 0 4px rgba(74,131,255,.18); }
    textarea { min-height:90px; resize:vertical; }

    button {
      padding:12px; border-radius:12px; border:0; background:#4a83ff; color:#08111f;
      font-weight:700; cursor:pointer;
    }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .row { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
    .ghost { background:transparent; color:#cfe0ff; border:1px solid #2a3b52; font-weight:700; }
    .msg { margin-top:12px; padding:10px 12px; border-radius:12px; font-size:13px; line-height:1.35; border:1px solid #2a3b52; background:#0e1520; color:#cfe0ff; }
    .err { border-color:#ff5a7a55; color:#ffd1da; }
    .ok  { border-color:#35d07f55; color:#caffdf; }
    .small { font-size:12px; color:#a9b6c7; margin-top:10px; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#0e1520; border:1px solid #2a3b52; color:#a9b6c7; font-size:12px; white-space:nowrap; }
    .lang { position:absolute; top:14px; right:14px; display:flex; gap:6px; }
    .lang button { width:auto; margin:0; padding:6px 10px; border-radius:999px; background:transparent; color:#a9b6c7; border:1px solid #2a3b52; font-weight:700; }
    .lang button.active { background:#0e1520; color:#e9eef7; border-color:#4a83ff55; }

    .grid2 { display:grid; grid-template-columns: 420px 1fr; gap:16px; align-items:start; }
    @media (max-width: 920px) { .grid2 { grid-template-columns: 1fr; } }

    .calBox { border:1px solid #2a3b52; background:#0e1520; border-radius:14px; padding:12px; }
    .muted { color:#a9b6c7; font-size:12px; }
    .scroll { max-height:520px; overflow:auto; padding-right:6px; }

    .monthGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    .cellBtn {
      text-align:left; padding:10px; border-radius:12px;
      border:1px solid #2a3b52; background:#0e1520;
      color:#e9eef7; cursor:pointer; min-height:64px;
    }
    .cellBtn.dim { background:transparent; opacity:.55; }
    .timeLabel { color:#a9b6c7; font-size:12px; }

    .calTop { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
    .calTop .spacer { flex:1; }
    .tabBtn { padding:10px 12px; border-radius:12px; }
    .tabBtn.active { border-color:#4a83ff88; box-shadow:0 0 0 4px rgba(74,131,255,.12); }

    .slotBtn {
      width:100%; text-align:left; padding:10px 12px; border-radius:12px;
      border:1px solid #2a3b52; background:#0e1520; color:#e9eef7;
    }
    .slotBtn.free { cursor:pointer; }
    .slotBtn.busy { cursor:not-allowed; opacity:.75; background:rgba(255,90,122,0.08); }

    .modalBackdrop {
      position:fixed; inset:0; background:rgba(0,0,0,.55);
      display:none; align-items:center; justify-content:center; padding:16px; z-index:9999;
    }
    .modal {
      width:100%; max-width:520px;
      background:#121a24; border:1px solid #223042; border-radius:18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      padding:14px;
    }
    .modal h2 { margin:0 0 8px; font-size:18px; }
    .modal .sub { margin:0 0 12px; }
    .modalActions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
    .modalActions button { flex:1; }

    @media (max-width: 480px) {
      .wrap { padding:10px; }
      .card { padding:12px; }
      h1 { font-size:18px; }
      .sub { font-size:12px; }
      .calBox { padding:10px; }

      .monthGrid { gap:6px; }
      .cellBtn { padding:8px; min-height:54px; }
      .timeLabel { font-size:11px; }
      .pill { font-size:11px; padding:3px 8px; }
      input, textarea, select { padding:10px 10px; }
      button { padding:10px; }
      .tabBtn { padding:9px 10px; }
      .scroll { max-height:60vh; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="lang">
        <button id="langDe" type="button">DE</button>
        <button id="langEn" type="button">EN</button>
      </div>

      <h1>Webi Fitness</h1>
      <p id="t_sub" class="sub"></p>

      <div class="row" style="align-items:center; margin:0 0 10px;">
        <span id="statePill" class="pill"></span>
        <span id="userPill" class="pill" style="display:none;"></span>
        <span id="rolePill" class="pill" style="display:none;"></span>
      </div>

      <div class="grid2">
        <div class="calBox">
          <div id="loginBlock">
            <label id="t_emailLabel" for="email"></label>
            <input id="email" type="email" autocomplete="email" />
            <div class="row">
              <button id="sendBtn" style="flex:1;"></button>
              <button id="changeBtn" class="ghost" type="button"></button>
            </div>
            <div id="msg" class="msg" style="display:none;"></div>
            <div id="t_tip" class="small"></div>
          </div>

          <div id="profileBlock" style="display:none;">
            <div class="row" style="margin-top:0; align-items:center;">
              <span class="pill" id="profileEmail"></span>
              <span class="pill" id="profileRole"></span>
            </div>
            <div class="row">
              <button id="openCalendarBtn" class="ghost" type="button" style="flex:1;"></button>
              <button id="logoutBtn" class="ghost" type="button" style="flex:1;"></button>
            </div>
            <div id="appMsgLeft" class="msg" style="display:none;"></div>
            <div class="small" id="profileHint"></div>
          </div>
        </div>

        <div class="calBox">
          <div id="appBlock" style="display:none;">
            <div class="row" style="margin:0 0 10px;">
              <span class="pill" id="allowedPill"></span>
              <span class="pill" id="tzPill"></span>
            </div>

            <div id="calBlock" style="display:none;">
              <div class="calTop">
                <button class="ghost tabBtn" id="tabMonth" type="button"></button>
                <button class="ghost tabBtn" id="tabWeek" type="button"></button>
                <button class="ghost tabBtn" id="tabDay" type="button"></button>
                <div class="spacer"></div>
                <input id="dayPicker" type="date" />
              </div>

              <div id="monthGrid"></div>
              <div id="weekGrid" style="display:none;"></div>
              <div id="dayList" style="display:none;"></div>

              <div class="small" id="calHint" style="margin-top:10px;"></div>
            </div>

            <div id="appMsg" class="msg" style="display:none;"></div>
          </div>

          <div id="appLocked" class="small" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="modalBackdrop" class="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h2 id="mTitle">Reservierung</h2>
      <p id="mSub" class="sub"></p>

      <div class="muted" id="mStart"></div>

      <label id="mUntilLabel" for="mUntil"></label>
      <select id="mUntil"></select>

      <label id="mNoteLabel" for="mNote"></label>
      <textarea id="mNote" placeholder=""></textarea>

      <div id="mMsg" class="msg" style="display:none;"></div>

      <div class="modalActions">
        <button id="mBookBtn" type="button"></button>
        <button id="mCancelBtn" class="ghost" type="button"></button>
      </div>
    </div>
  </div>

  <script type="module">
    const BACKEND_URL = "https://steep-wildflower-af8b.fitnessraumwm.workers.dev";
    const TZ = "Europe/Zurich";
    const SLOT_MIN = 15;
    const START_HOUR = 5;
    const END_HOUR = 23;
    const BACKEND_TIMEOUT_MS = 60000;

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCY2nmL9I9TjxB0rlVPMCmcl4WKna21IJE",
      authDomain: "fitnessraumwm-app.firebaseapp.com",
      projectId: "fitnessraumwm-app",
      storageBucket: "fitnessraumwm-app.firebasestorage.app",
      messagingSenderId: "130435754352",
      appId: "1:130435754352:web:a8a38eeeee7c25867e47b5",
      measurementId: "G-B629775N63"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const LS_LANG_KEY = "webi_lang";
    const LS_EMAIL_KEY = "webi_emailForSignIn";

    const I18N = {
      de: {
        sub: "Login ohne Passwort: Wir senden dir einen Link per E-Mail. Link öffnen → fertig.",
        emailLabel: "E-Mail",
        emailPh: "z. B. name@domain.ch",
        sendBtn: "Login-Link senden",
        changeBtn: "E-Mail ändern",
        logoutBtn: "Abmelden",
        openCalBtn: "Kalender",
        tip: "Tipp: Wenn du den Link auf einem anderen Gerät öffnest, fragt die App die E-Mail nochmals ab.",
        pill: {
          checking: "prüfe…",
          ready: "bereit",
          linkSent: "Link gesendet",
          foundLink: "Login-Link erkannt",
          askEmail: "E-Mail für Abschluss eingeben",
          signedIn: "angemeldet",
          signedOut: "abgemeldet",
          error: "Fehler"
        },
        msg: {
          invalidEmail: "Bitte eine gültige E-Mail eingeben.",
          sentOk: "Erledigt. Link wurde per E-Mail gesendet. Öffne ihn, um den Login abzuschliessen.",
          sentFail: "Link konnte nicht gesendet werden. Prüfe E-Mail und autorisierte Domain.",
          needEmail: "Du hast den Login-Link geöffnet, aber die E-Mail ist hier nicht gespeichert. Bitte dieselbe E-Mail eingeben.",
          signOk: "Login erfolgreich.",
          signFail: "Link ungültig oder abgelaufen. Bitte einen neuen Link senden.",
          changed: "OK. Bitte neue E-Mail eingeben und Link senden.",
          loggedOut: "Abgemeldet.",
          backendFail: "Backend-Fehler."
        },
        app: {
          allowed: "Zugriff: erlaubt",
          denied: "Zugriff: nicht erlaubt",
          tz: "Zeitzone: Europe/Zurich",
          month: "Monat",
          week: "Woche",
          day: "Tag",
          hint: "Monat: Klick auf Tag → Tages-Slots. Woche: Klick auf Feld → Tag. Tag: Klick auf frei → Reservierung."
        },
        booking: {
          title: "Reservierung",
          chooseUntil: "Wähle Ende (bis) und buche.",
          untilLabel: "Bis",
          noteLabel: "Notiz (optional)",
          notePh: "z. B. komme 10 min später…",
          book: "Buchen",
          cancel: "Abbrechen",
          booked: "Gebucht ✅"
        }
      },
      en: {
        sub: "Passwordless login: we’ll email you a sign-in link. Open the link → you’re in.",
        emailLabel: "Email",
        emailPh: "e.g. name@domain.ch",
        sendBtn: "Send sign-in link",
        changeBtn: "Change email",
        logoutBtn: "Sign out",
        openCalBtn: "Calendar",
        tip: "Tip: if you open the link on another device, the app will ask for your email again.",
        pill: {
          checking: "checking…",
          ready: "ready",
          linkSent: "link sent",
          foundLink: "sign-in link detected",
          askEmail: "enter email to finish",
          signedIn: "signed in",
          signedOut: "signed out",
          error: "error"
        },
        msg: {
          invalidEmail: "Please enter a valid email.",
          sentOk: "Done. We sent you a sign-in link by email. Open it to finish signing in.",
          sentFail: "Couldn’t send the link. Check email and authorized domain.",
          needEmail: "You opened a sign-in link, but the email isn’t stored here. Please enter the same email.",
          signOk: "Signed in successfully.",
          signFail: "Link is invalid or expired. Please request a new link.",
          changed: "OK. Enter a new email and send a fresh link.",
          loggedOut: "Signed out.",
          backendFail: "Backend error."
        },
        app: {
          allowed: "Access: allowed",
          denied: "Access: denied",
          tz: "Timezone: Europe/Zurich",
          month: "Month",
          week: "Week",
          day: "Day",
          hint: "Month: click a day → day slots. Week: click a cell → day. Day: click free → booking."
        },
        booking: {
          title: "Booking",
          chooseUntil: "Choose end time (until) and book.",
          untilLabel: "Until",
          noteLabel: "Note (optional)",
          notePh: "e.g. I’ll be 10 min late…",
          book: "Book",
          cancel: "Cancel",
          booked: "Booked ✅"
        }
      }
    };

    function detectInitialLang() {
      const saved = localStorage.getItem(LS_LANG_KEY);
      if (saved === "de" || saved === "en") return saved;
      const nav = (navigator.language || "de").toLowerCase();
      return nav.startsWith("en") ? "en" : "de";
    }
    let LANG = detectInitialLang();
    function t(path) { return path.split(".").reduce((o,k)=>o?.[k], I18N[LANG]); }

    const els = {
      pill: document.getElementById("statePill"),
      userPill: document.getElementById("userPill"),
      rolePill: document.getElementById("rolePill"),

      loginBlock: document.getElementById("loginBlock"),
      profileBlock: document.getElementById("profileBlock"),
      profileEmail: document.getElementById("profileEmail"),
      profileRole: document.getElementById("profileRole"),
      profileHint: document.getElementById("profileHint"),
      appMsgLeft: document.getElementById("appMsgLeft"),

      msg: document.getElementById("msg"),
      email: document.getElementById("email"),
      sendBtn: document.getElementById("sendBtn"),
      changeBtn: document.getElementById("changeBtn"),

      logoutBtn: document.getElementById("logoutBtn"),
      openCalendarBtn: document.getElementById("openCalendarBtn"),

      appBlock: document.getElementById("appBlock"),
      appLocked: document.getElementById("appLocked"),
      appMsg: document.getElementById("appMsg"),
      allowedPill: document.getElementById("allowedPill"),
      tzPill: document.getElementById("tzPill"),

      langDe: document.getElementById("langDe"),
      langEn: document.getElementById("langEn"),

      calBlock: document.getElementById("calBlock"),
      tabMonth: document.getElementById("tabMonth"),
      tabWeek: document.getElementById("tabWeek"),
      tabDay: document.getElementById("tabDay"),
      picker: document.getElementById("dayPicker"),
      month: document.getElementById("monthGrid"),
      week: document.getElementById("weekGrid"),
      day: document.getElementById("dayList"),
      calHint: document.getElementById("calHint"),

      modalBackdrop: document.getElementById("modalBackdrop"),
      mTitle: document.getElementById("mTitle"),
      mSub: document.getElementById("mSub"),
      mStart: document.getElementById("mStart"),
      mUntilLabel: document.getElementById("mUntilLabel"),
      mUntil: document.getElementById("mUntil"),
      mNoteLabel: document.getElementById("mNoteLabel"),
      mNote: document.getElementById("mNote"),
      mMsg: document.getElementById("mMsg"),
      mBookBtn: document.getElementById("mBookBtn"),
      mCancelBtn: document.getElementById("mCancelBtn"),
    };

    function setPillKey(key) { els.pill.textContent = "Status: " + t("pill." + key); }
    function showMsg(text, kind="") {
      els.msg.style.display = "block";
      els.msg.className = "msg " + (kind === "err" ? "err" : kind === "ok" ? "ok" : "");
      els.msg.textContent = text;
    }
    function clearMsg(){ els.msg.style.display="none"; els.msg.textContent=""; els.msg.className="msg"; }

    function showAppMsg(text, kind="") {
      els.appMsg.style.display = "block";
      els.appMsg.className = "msg " + (kind === "err" ? "err" : kind === "ok" ? "ok" : "");
      els.appMsg.textContent = text;
    }
    function clearAppMsg(){ els.appMsg.style.display="none"; els.appMsg.textContent=""; els.appMsg.className="msg"; }

    function showLeftMsg(text, kind="") {
      els.appMsgLeft.style.display = "block";
      els.appMsgLeft.className = "msg " + (kind === "err" ? "err" : kind === "ok" ? "ok" : "");
      els.appMsgLeft.textContent = text;
    }
    function clearLeftMsg(){ els.appMsgLeft.style.display="none"; els.appMsgLeft.textContent=""; els.appMsgLeft.className="msg"; }

    function modalMsg(text, kind="") {
      els.mMsg.style.display = "block";
      els.mMsg.className = "msg " + (kind === "err" ? "err" : kind === "ok" ? "ok" : "");
      els.mMsg.textContent = text;
    }
    function modalClearMsg() {
      els.mMsg.style.display = "none";
      els.mMsg.textContent = "";
      els.mMsg.className = "msg";
    }

    function applyI18n() {
      document.documentElement.lang = LANG;

      document.getElementById("t_sub").textContent = t("sub");
      document.getElementById("t_emailLabel").textContent = t("emailLabel");
      els.email.placeholder = t("emailPh");
      els.sendBtn.textContent = t("sendBtn");
      els.changeBtn.textContent = t("changeBtn");
      document.getElementById("t_tip").textContent = t("tip");

      els.openCalendarBtn.textContent = t("openCalBtn");
      els.logoutBtn.textContent = t("logoutBtn");

      els.tabMonth.textContent = t("app.month");
      els.tabWeek.textContent = t("app.week");
      els.tabDay.textContent = t("app.day");
      els.calHint.textContent = t("app.hint");

      els.mTitle.textContent = t("booking.title");
      els.mSub.textContent = t("booking.chooseUntil");
      els.mUntilLabel.textContent = t("booking.untilLabel");
      els.mNoteLabel.textContent = t("booking.noteLabel");
      els.mNote.placeholder = t("booking.notePh");
      els.mBookBtn.textContent = t("booking.book");
      els.mCancelBtn.textContent = t("booking.cancel");

      els.langDe.classList.toggle("active", LANG === "de");
      els.langEn.classList.toggle("active", LANG === "en");
    }

    function setLang(newLang) {
      LANG = newLang;
      localStorage.setItem(LS_LANG_KEY, LANG);
      applyI18n();
    }

    const actionCodeSettings = {
      url: window.location.origin + window.location.pathname,
      handleCodeInApp: true
    };

    async function sendLink(email) {
      clearMsg();
      els.sendBtn.disabled = true;
      try {
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        localStorage.setItem(LS_EMAIL_KEY, email);
        showMsg(t("msg.sentOk"), "ok");
        setPillKey("linkSent");
      } catch (e) {
        console.error(e);
        showMsg(t("msg.sentFail") + " (" + (e?.code || "error") + ")", "err");
        setPillKey("error");
      } finally {
        els.sendBtn.disabled = false;
      }
    }

    async function completeSignInIfLink() {
      if (!isSignInWithEmailLink(auth, window.location.href)) return false;
      setPillKey("foundLink");
      clearMsg();

      let email = localStorage.getItem(LS_EMAIL_KEY);
      if (!email) {
        setPillKey("askEmail");
        showMsg(t("msg.needEmail"), "");
        return true;
      }

      try {
        await signInWithEmailLink(auth, email, window.location.href);
        localStorage.removeItem(LS_EMAIL_KEY);
        window.history.replaceState({}, document.title, window.location.pathname);
        setPillKey("signedIn");
        showMsg(t("msg.signOk"), "ok");
        return true;
      } catch (e) {
        console.error(e);
        showMsg(t("msg.signFail") + " (" + (e?.code || "error") + ")", "err");
        setPillKey("error");
        return true;
      }
    }

    async function postBackend_(payload) {
      const user = auth.currentUser;
      if (!user) throw new Error("not_authenticated");
      const idToken = await user.getIdToken(true);

      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort("timeout"), BACKEND_TIMEOUT_MS);

      try {
        const r = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...payload, idToken }),
          signal: ctrl.signal,
          cache: "no-store"
        });

        const txt = await r.text();
        let data = null;
        try { data = JSON.parse(txt); } catch { data = { ok:false, error:"bad_json", raw: txt }; }
        return data;
      } finally {
        clearTimeout(to);
      }
    }

    const backendMe_ = () => postBackend_({ action: "me" });

    const fetchDaySlots_ = (dateYmd, nocache=false) => postBackend_({
      action: "slots_day", date: dateYmd, slotMin: SLOT_MIN, startHour: START_HOUR, endHour: END_HOUR, nocache: !!nocache
    });

    const fetchWeekSlots_ = (weekStartYmd, nocache=false) => postBackend_({
      action: "slots_week", weekStart: weekStartYmd, slotMin: SLOT_MIN, startHour: START_HOUR, endHour: END_HOUR, nocache: !!nocache
    });

    const fetchMonthSummary_ = (year, month1to12, nocache=false) => postBackend_({
      action: "summary_month", year, month: month1to12, slotMin: SLOT_MIN, startHour: START_HOUR, endHour: END_HOUR, nocache: !!nocache
    });

    // IMPORTANT: reserve_slot (matches your Code.gs)
    const reserveSlot_ = (fromIso, toIso, note) => postBackend_({
      action: "reserve_slot", from: fromIso, to: toIso, note: note || ""
    });

    function ymdLocal_(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const da = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${da}`;
    }

    function fmtTime_(iso) {
      const dt = new Date(iso);
      return new Intl.DateTimeFormat(LANG === "de" ? "de-CH" : "en-GB", {
        timeZone: TZ, hour: "2-digit", minute: "2-digit"
      }).format(dt);
    }

    function mondayOf_(anchorYmd) {
      const base = anchorYmd ? new Date(anchorYmd + "T12:00:00") : new Date();
      const day = base.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      const monday = new Date(base);
      monday.setDate(monday.getDate() + diff);
      return ymdLocal_(monday);
    }

    let _currentView = null;
    let _currentDayYmd = null;

    function setActiveTab_(v) {
      _currentView = v;
      [els.tabMonth, els.tabWeek, els.tabDay].forEach(b => b.classList.remove("active"));
      if (v === "month") els.tabMonth.classList.add("active");
      if (v === "week")  els.tabWeek.classList.add("active");
      if (v === "day")   els.tabDay.classList.add("active");
    }

    function showView_(v) {
      setActiveTab_(v);
      els.month.style.display = (v === "month") ? "block" : "none";
      els.week.style.display  = (v === "week")  ? "block" : "none";
      els.day.style.display   = (v === "day")   ? "block" : "none";
    }

    async function renderMonth_(anchorYmd) {
      clearAppMsg();
      const d = anchorYmd ? new Date(anchorYmd + "T12:00:00") : new Date();
      const year = d.getFullYear();
      const month = d.getMonth() + 1;

      const data = await fetchMonthSummary_(year, month, false);
      if (!data.ok) throw new Error(JSON.stringify(data));

      const first = new Date(year, month - 1, 1, 12, 0, 0, 0);
      const start = new Date(first);
      const day = start.getDay();
      const offset = (day === 0 ? 6 : day - 1);
      start.setDate(start.getDate() - offset);

      const cells = [];
      for (let i = 0; i < 42; i++) {
        const cd = new Date(start);
        cd.setDate(cd.getDate() + i);

        const y = cd.getFullYear(), m = cd.getMonth() + 1, da = cd.getDate();
        const ymd = `${y}-${String(m).padStart(2,"0")}-${String(da).padStart(2,"0")}`;
        const inMonth = (cd.getMonth() === (month - 1));

        const s = data.summary?.[ymd];
        const free = s ? s.freeCount : 0;
        const total = s ? s.totalCount : 0;

        cells.push(`
          <button class="cellBtn ${inMonth ? "" : "dim"}" data-ymd="${ymd}">
            <div class="timeLabel">${da}</div>
            <div style="margin-top:6px; font-size:12px;">
              ${s ? `free: <b>${free}</b> / ${total}` : ""}
            </div>
          </button>
        `);
      }

      els.month.innerHTML = `<div class="monthGrid">${cells.join("")}</div>`;

      els.month.querySelectorAll("button[data-ymd]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const ymd = btn.getAttribute("data-ymd");
          els.picker.value = ymd;
          await renderDay_(ymd, { nocache: true });
          showView_("day");
        });
      });
    }

    async function renderWeek_(anchorYmd) {
      clearAppMsg();

      const weekStartYmd = mondayOf_(anchorYmd || ymdLocal_());
      const data = await fetchWeekSlots_(weekStartYmd, false);
      if (!data.ok) throw new Error(JSON.stringify(data));

      const rows = [];
      for (let h = START_HOUR; h < END_HOUR; h++) {
        for (const mm of [0, 30]) rows.push({ h, mm });
      }

      const head = data.days.map(d => `
        <div style="text-align:center; color:#a9b6c7; font-size:12px;">
          ${d.date}
        </div>
      `).join("");

      const body = rows.map(r => {
        const label = `${String(r.h).padStart(2,"0")}:${String(r.mm).padStart(2,"0")}`;

        const cols = data.days.map(dayObj => {
          const slot = dayObj.slots.find(s => fmtTime_(s.from) === label);
          const free = slot ? slot.free : false;

          return `
            <button data-ymd="${dayObj.date}" style="
              width:100%; padding:10px; border-radius:10px;
              border:1px solid #2a3b52;
              background:${free ? "#0e1520" : "rgba(255,90,122,0.08)"};
              color:#e9eef7; cursor:pointer;">
            </button>
          `;
        }).join("");

        return `
          <div style="display:grid; grid-template-columns:70px repeat(7,1fr); gap:8px; align-items:center;">
            <div class="timeLabel">${label}</div>
            ${cols}
          </div>
        `;
      }).join("");

      els.week.innerHTML = `
        <div style="display:grid; grid-template-columns:70px repeat(7,1fr); gap:8px; margin-bottom:8px;">
          <div></div>${head}
        </div>
        <div class="scroll" style="display:flex; flex-direction:column; gap:8px;">
          ${body}
        </div>
        <div class="muted" style="margin-top:10px;">
          ${LANG === "de" ? "Klick auf ein Feld öffnet den Tag." : "Click a cell to open that day."}
        </div>
      `;

      els.week.querySelectorAll("button[data-ymd]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const ymd = btn.getAttribute("data-ymd");
          els.picker.value = ymd;
          await renderDay_(ymd, { nocache: true });
          showView_("day");
        });
      });
    }

    async function renderDay_(ymd, opts={}) {
      clearAppMsg();
      _currentDayYmd = ymd;

      const data = await fetchDaySlots_(ymd, !!opts.nocache);
      if (!data.ok) throw new Error(JSON.stringify(data));

      const items = data.slots.map(s => {
        const label = `${fmtTime_(s.from)} – ${fmtTime_(s.to)}`;
        const txt = s.free ? (LANG === "de" ? "frei" : "free") : (LANG === "de" ? "gebucht" : "booked");
        const cls = s.free ? "slotBtn free" : "slotBtn busy";

        return `
          <button class="${cls}" data-from="${s.from}" data-to="${s.to}" ${s.free ? "" : "disabled"}>
            <div style="display:flex; justify-content:space-between; gap:10px;">
              <div>${label}</div>
              <div class="timeLabel">${txt}</div>
            </div>
          </button>
        `;
      }).join("");

      els.day.innerHTML = `
        <div class="muted" style="margin-bottom:8px;">${ymd}</div>
        <div class="scroll" style="display:flex; flex-direction:column; gap:8px;">
          ${items}
        </div>
      `;

      els.day.querySelectorAll("button.slotBtn.free").forEach(btn => {
        btn.addEventListener("click", () => openBookingModal_(ymd, btn.getAttribute("data-from")));
      });
    }

    let _modalState = { ymd:null, startIso:null };

    function computeContinuousFreeUntil_(startIso) {
      const buttons = Array.from(els.day.querySelectorAll("button.slotBtn"));
      const map = buttons.map(b => ({
        from: b.getAttribute("data-from"),
        to: b.getAttribute("data-to"),
        free: b.classList.contains("free")
      }));

      const startIdx = map.findIndex(x => x.from === startIso);
      if (startIdx < 0) return [];

      const res = [];
      let i = startIdx;
      while (i < map.length && map[i].free) {
        res.push({ iso: map[i].to, label: fmtTime_(map[i].to) });
        i++;
      }
      return res;
    }

    function openBookingModal_(ymd, startIso) {
      _modalState = { ymd, startIso };
      modalClearMsg();
      els.mNote.value = "";

      els.mStart.textContent = (LANG === "de" ? "Start: " : "Start: ") + fmtTime_(startIso);

      const opts = computeContinuousFreeUntil_(startIso);
      els.mUntil.innerHTML = opts.map(o => `<option value="${o.iso}">${o.label}</option>`).join("");

      els.modalBackdrop.style.display = "flex";
      els.modalBackdrop.setAttribute("aria-hidden", "false");
    }

    function closeBookingModal_() {
      els.modalBackdrop.style.display = "none";
      els.modalBackdrop.setAttribute("aria-hidden", "true");
      _modalState = { ymd:null, startIso:null };
    }

    els.mCancelBtn.addEventListener("click", closeBookingModal_);
    els.modalBackdrop.addEventListener("click", (e) => { if (e.target === els.modalBackdrop) closeBookingModal_(); });

    els.mBookBtn.addEventListener("click", async () => {
      modalClearMsg();
      els.mBookBtn.disabled = true;

      try {
        const fromIso = _modalState.startIso;
        const toIso = els.mUntil.value;
        const note = els.mNote.value || "";
        if (!fromIso || !toIso) throw new Error("missing_from_to");

        const r = await reserveSlot_(fromIso, toIso, note);
        if (!r.ok) throw new Error(r.error || JSON.stringify(r));

        modalMsg(t("booking.booked"), "ok");

        // refresh day immediately + retry
        await renderDay_(_currentDayYmd, { nocache: true });
        setTimeout(() => { renderDay_(_currentDayYmd, { nocache: true }).catch(()=>{}); }, 1200);

        // refresh month in background
        setTimeout(() => { renderMonth_(els.picker.value).catch(()=>{}); }, 300);

      } catch (e) {
        console.error(e);
        modalMsg((LANG === "de" ? "Fehler: " : "Error: ") + String(e), "err");
      } finally {
        els.mBookBtn.disabled = false;
      }
    });

    function setLoggedOutUI_() {
      els.loginBlock.style.display = "block";
      els.profileBlock.style.display = "none";
      els.appBlock.style.display = "none";
      els.appLocked.style.display = "none";
      els.userPill.style.display = "none";
      els.rolePill.style.display = "none";
      els.calBlock.style.display = "none";
      clearLeftMsg();
    }

    function setLoggedInUI_(me) {
      els.loginBlock.style.display = "none";
      els.profileBlock.style.display = "block";

      els.userPill.style.display = "inline-block";
      els.rolePill.style.display = "inline-block";
      els.userPill.textContent = me.email || "";
      els.rolePill.textContent = "role: " + (me.role || "none");

      els.profileEmail.textContent = me.email || "";
      els.profileRole.textContent = "role: " + (me.role || "none");
      els.profileHint.textContent = (LANG === "de")
        ? "Kalender öffnen und freie Zeiten reservieren."
        : "Open the calendar and book free time.";

      els.appBlock.style.display = "block";
      els.tzPill.textContent = t("app.tz");
      els.allowedPill.textContent = me.allowed ? t("app.allowed") : t("app.denied");

      if (!me.allowed) {
        els.appLocked.style.display = "block";
        els.appLocked.textContent = (LANG === "de")
          ? "Du bist nicht freigeschaltet. Bitte Admin kontaktieren."
          : "You are not enabled yet. Please contact an admin.";
      } else {
        els.appLocked.style.display = "none";
      }
    }

    els.langDe.addEventListener("click", () => setLang("de"));
    els.langEn.addEventListener("click", () => setLang("en"));

    els.sendBtn.addEventListener("click", async () => {
      const email = (els.email.value || "").trim();
      if (!email.includes("@")) return showMsg(t("msg.invalidEmail"), "err");
      await sendLink(email);
    });

    els.changeBtn.addEventListener("click", () => {
      localStorage.removeItem(LS_EMAIL_KEY);
      els.email.value = "";
      showMsg(t("msg.changed"), "");
      setPillKey("ready");
    });

    els.logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      setPillKey("signedOut");
      showMsg(t("msg.loggedOut"), "");
      setLoggedOutUI_();
    });

    els.openCalendarBtn.addEventListener("click", async () => {
      try {
        clearAppMsg();
        clearLeftMsg();

        const me = await backendMe_();
        if (!me.ok) throw new Error(JSON.stringify(me));
        if (!me.allowed) {
          showLeftMsg((LANG === "de" ? "Zugriff nicht erlaubt." : "Access denied."), "err");
          return;
        }

        els.calBlock.style.display = "block";
        const today = ymdLocal_(new Date());
        els.picker.value = today;

        await renderMonth_(today);
        showView_("month");
      } catch (e) {
        console.error(e);
        showLeftMsg(t("msg.backendFail") + " " + String(e), "err");
      }
    });

    els.tabMonth.addEventListener("click", async () => {
      try { await renderMonth_(els.picker.value || ymdLocal_()); showView_("month"); }
      catch (e) { console.error(e); showAppMsg(String(e), "err"); }
    });

    els.tabWeek.addEventListener("click", async () => {
      try { await renderWeek_(els.picker.value || ymdLocal_()); showView_("week"); }
      catch (e) { console.error(e); showAppMsg(String(e), "err"); }
    });

    els.tabDay.addEventListener("click", async () => {
      try { await renderDay_(els.picker.value || ymdLocal_(), { nocache:true }); showView_("day"); }
      catch (e) { console.error(e); showAppMsg(String(e), "err"); }
    });

    els.picker.addEventListener("change", async () => {
      try { await renderDay_(els.picker.value, { nocache:true }); showView_("day"); }
      catch (e) { console.error(e); showAppMsg(String(e), "err"); }
    });

    applyI18n();
    setPillKey("checking");
    setLoggedOutUI_();

    (async () => {
      const handled = await completeSignInIfLink();

      onAuthStateChanged(auth, async (user) => {
        clearMsg();
        clearAppMsg();
        clearLeftMsg();

        if (!user) {
          if (!handled) setPillKey("ready");
          setLoggedOutUI_();
          return;
        }

        setPillKey("signedIn");
        els.email.value = user.email || "";

        try {
          const me = await backendMe_();
          setLoggedInUI_(me);
        } catch (e) {
          console.error(e);
          showMsg(t("msg.backendFail") + " " + String(e), "err");
          setPillKey("error");
        }
      });
    })();
  </script>
</body>
</html>
