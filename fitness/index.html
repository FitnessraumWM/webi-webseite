<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Webi Fitness</title>

  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body { margin:0; background:#0b0f14; color:#e9eef7; }
    .wrap { min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:18px; }
    .card { width:100%; max-width:980px; background:#121a24; border:1px solid #223042; border-radius:18px; padding:16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); position:relative; }

    h1 { font-size:22px; margin:0 0 6px; }
    .sub { color:#a9b6c7; font-size:13px; margin:0 0 14px; line-height:1.4; }

    .pill { display:inline-block; padding:4px 10px; border-radius:999px; background:#0e1520; border:1px solid #2a3b52; color:#a9b6c7; font-size:12px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .btn { padding:12px 14px; border-radius:12px; border:0; background:#4a83ff; color:#08111f; font-weight:800; cursor:pointer; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .ghost { background:transparent; color:#cfe0ff; border:1px solid #2a3b52; font-weight:800; }

    .box { border:1px solid #2a3b52; background:#0e1520; border-radius:14px; padding:12px; }

    .grid { display:grid; grid-template-columns: 1fr; gap:14px; }
    @media (min-width: 920px) { .grid { grid-template-columns: 1fr 1fr; } }

    /* month grid */
    .monthGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    .cellBtn {
      text-align:left; padding:10px; border-radius:12px;
      border:1px solid #2a3b52; background:#0e1520;
      color:#e9eef7; cursor:pointer; min-height:66px;
    }
    .cellBtn.dim { background:transparent; opacity:.55; }
    .timeLabel { color:#a9b6c7; font-size:12px; }
    .muted { color:#a9b6c7; font-size:12px; }

    /* day list */
    .scroll { max-height:520px; overflow:auto; padding-right:6px; }
    .slotBtn {
      width:100%; text-align:left; padding:10px 12px; border-radius:12px;
      border:1px solid #2a3b52; background:#0e1520; color:#e9eef7;
      cursor:pointer;
      display:flex; justify-content:space-between; gap:12px; align-items:center;
    }
    .slotBtn.busy { background: rgba(255,90,122,0.08); cursor:not-allowed; opacity:.75; }
    .slotBtn b { font-weight:800; }

    /* top right */
    .topRight { position:absolute; top:14px; right:14px; display:flex; gap:8px; align-items:center; }
    .langBtn { width:auto; padding:6px 10px; border-radius:999px; background:transparent; color:#a9b6c7; border:1px solid #2a3b52; font-weight:800; cursor:pointer; }
    .langBtn.active { background:#0e1520; color:#e9eef7; border-color:#4a83ff55; }
    .menuBtn { width:auto; padding:8px 10px; border-radius:12px; background:transparent; color:#e9eef7; border:1px solid #2a3b52; font-weight:900; cursor:pointer; }

    /* modal */
    .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; }
    .modal { width:min(560px, 100%); background:#121a24; border:1px solid #223042; border-radius:18px; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
    .modal h2 { margin:0 0 10px; font-size:18px; }
    .field { display:flex; flex-direction:column; gap:6px; margin:10px 0; }
    select, textarea, input[type="date"] {
      width:100%; padding:12px; border-radius:12px; border:1px solid #2a3b52; background:#0e1520; color:#e9eef7; outline:none;
    }
    textarea { min-height:90px; resize:vertical; }
    .msg { margin-top:10px; padding:10px 12px; border-radius:12px; font-size:13px; line-height:1.35; border:1px solid #2a3b52; background:#0e1520; color:#cfe0ff; display:none; }
    .msg.err { border-color:#ff5a7a55; color:#ffd1da; }
    .msg.ok  { border-color:#35d07f55; color:#caffdf; }

    /* drawer */
    .drawerBackdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:60; }
    .drawer {
      position:fixed; top:0; right:0; height:100vh; width:min(360px, 92vw);
      background:#121a24; border-left:1px solid #223042; padding:14px; z-index:61;
      transform:translateX(100%); transition:transform .18s ease;
    }
    .drawer.open { transform:translateX(0); }
    .drawer h3 { margin:0 0 10px; }
    .drawer .item { padding:10px 10px; border-radius:12px; border:1px solid #2a3b52; background:#0e1520; margin:8px 0; cursor:pointer; font-weight:800; }
    .drawer .small { font-size:12px; color:#a9b6c7; margin-top:10px; }
    .toggleRow { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .switch { width:52px; height:30px; border-radius:999px; border:1px solid #2a3b52; background:#0e1520; position:relative; cursor:pointer; }
    .knob { position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:999px; background:#a9b6c7; transition:left .15s ease, background .15s ease; }
    .switch.on { border-color:#35d07f55; }
    .switch.on .knob { left:25px; background:#35d07f; }
  </style>
</head>

<body>

  </div>

  <script type="module">

    // =========================

    const I18N = {

        app: {
          allowed:"Access: allowed",
          denied:"Access: denied",
          tz:"Timezone: Europe/Zurich",
          month:"Month", week:"Week", day:"Day",
          hint:"Month: click a day → day slots. Day: click free → booking.",
          next:"Next booking",

          myTitle:"My bookings",

          cancel:"Cancel",
          none:"No bookings."
        },

          pickUntil:"Pick end time (until) and book.",

          notePh:"e.g. 10 min late…",

        },

    function detectLang() {
      const saved = localStorage.getItem(LS_LANG_KEY);
      if (saved === "de" || saved === "en") return saved;
      const nav = (navigator.language || "de").toLowerCase();
      return nav.startsWith("en") ? "en" : "de";
    }
    let LANG = detectLang();
    const t = (path) => path.split(".").reduce((o,k)=>o?.[k], I18N[LANG]);

    // =========================
    // DOM
    // =========================
    const el = {
      langDe: document.getElementById("langDe"),
      langEn: document.getElementById("langEn"),
      menuBtn: document.getElementById("menuBtn"),

      pillState: document.getElementById("pillState"),
      pillEmail: document.getElementById("pillEmail"),
      pillRole: document.getElementById("pillRole"),
      pillBackend: document.getElementById("pillBackend"),

      lockedBox: document.getElementById("lockedBox"),
      lockedText: document.getElementById("lockedText"),

      app: document.getElementById("app"),

      pillAllowed: document.getElementById("pillAllowed"),
      pillTz: document.getElementById("pillTz"),

      tabMonth: document.getElementById("tabMonth"),
      tabWeek: document.getElementById("tabWeek"),
      tabDay: document.getElementById("tabDay"),
      picker: document.getElementById("dayPicker"),

      viewMonth: document.getElementById("viewMonth"),
      viewDay: document.getElementById("viewDay"),
      viewWeek: document.getElementById("viewWeek"),

      hint: document.getElementById("hint"),
      appMsg: document.getElementById("appMsg"),

      nextLine: document.getElementById("nextLine"),
      t_next: document.getElementById("t_next"),

      btnReserve: document.getElementById("btnReserve"),
      btnMy: document.getElementById("btnMy"),
      btnRefreshMy: document.getElementById("btnRefreshMy"),

      t_myTitle: document.getElementById("t_myTitle"),
      t_myHint: document.getElementById("t_myHint"),
      myList: document.getElementById("myList"),

      // booking modal
      bkBackdrop: document.getElementById("bkBackdrop"),
      bkTitle: document.getElementById("bkTitle"),
      bkInfo: document.getElementById("bkInfo"),
      bkUntilLabel: document.getElementById("bkUntilLabel"),
      bkUntil: document.getElementById("bkUntil"),
      bkNoteLabel: document.getElementById("bkNoteLabel"),
      bkNote: document.getElementById("bkNote"),
      bkConfirm: document.getElementById("bkConfirm"),
      bkCancel: document.getElementById("bkCancel"),
      bkMsg: document.getElementById("bkMsg"),

      // drawer
      drawerBackdrop: document.getElementById("drawerBackdrop"),
      drawer: document.getElementById("drawer"),
      t_menuTitle: document.getElementById("t_menuTitle"),
      m_refresh: document.getElementById("m_refresh"),
      m_my: document.getElementById("m_my"),
      m_settings: document.getElementById("m_settings"),
      settingsBox: document.getElementById("settingsBox"),
      m_logout: document.getElementById("m_logout"),
      t_menuFoot: document.getElementById("t_menuFoot"),

      // push
      pushSwitch: document.getElementById("pushSwitch"),
      t_push: document.getElementById("t_push"),
      t_pushHint: document.getElementById("t_pushHint"),
      pushStateLine: document.getElementById("pushStateLine"),
    };

    function setLang(newLang) {
      LANG = newLang;
      localStorage.setItem(LS_LANG_KEY, LANG);
      applyI18n();
      // rerender small stuff
      renderMyReservations_().catch(()=>{});
      renderMonth_(el.picker.value).catch(()=>{});
      renderDay_(el.picker.value).catch(()=>{});
    }

    function applyI18n() {
      document.documentElement.lang = LANG;
      document.getElementById("t_sub").textContent = t("sub");

      el.langDe.classList.toggle("active", LANG === "de");
      el.langEn.classList.toggle("active", LANG === "en");

      el.tabMonth.textContent = t("app.month");
      el.tabWeek.textContent = t("app.week");
      el.tabDay.textContent = t("app.day");
      el.hint.textContent = t("app.hint");

      el.t_next.textContent = t("app.next");
      el.btnReserve.textContent = t("app.reserve");
      el.btnMy.textContent = t("app.my");
      el.btnRefreshMy.textContent = t("app.refresh");
      el.t_myTitle.textContent = t("app.myTitle");
      el.t_myHint.textContent = t("app.myHint");

      el.bkTitle.textContent = t("booking.title");
      el.bkUntilLabel.textContent = t("booking.until");
      el.bkNoteLabel.textContent = t("booking.note");
      el.bkNote.placeholder = t("booking.notePh");
      el.bkConfirm.textContent = t("booking.book");
      el.bkCancel.textContent = t("booking.close");

      el.t_menuTitle.textContent = t("menu.title");
      el.m_refresh.textContent = t("menu.refresh");
      el.m_my.textContent = t("menu.my");
      el.m_settings.textContent = t("menu.settings");
      el.m_logout.textContent = t("menu.logout");
      el.t_menuFoot.textContent = t("menu.foot");

      el.t_push.textContent = t("push.title");
      el.t_pushHint.textContent = t("push.hint");
    }

    // =========================
    // Helpers
    // =========================
    function showMsg_(node, text, kind="") {
      node.style.display = "block";
      node.className = "msg " + (kind === "err" ? "err" : kind === "ok" ? "ok" : "");
      node.textContent = text;
    }
    function hideMsg_(node) {
      node.style.display = "none";
      node.textContent = "";
      node.className = "msg";
    }

    function setPill(key) {
      el.pillState.textContent = "Status: " + t("pill."+key);
    }

    function ymdLocal_(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }

    function fmtTime_(iso) {
      const dt = new Date(iso);
      return new Intl.DateTimeFormat(LANG === "de" ? "de-CH" : "en-GB", {
        timeZone: TZ, hour: "2-digit", minute: "2-digit"
      }).format(dt);
    }

    function fmtDateTimeLine_(startIso, endIso) {
      const s = new Date(startIso);
      const e = new Date(endIso);
      const sD = new Intl.DateTimeFormat(LANG === "de" ? "de-CH" : "en-GB", { timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit" }).format(s);
      const sT = fmtTime_(startIso);
      const eD = new Intl.DateTimeFormat(LANG === "de" ? "de-CH" : "en-GB", { timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit" }).format(e);
      const eT = fmtTime_(endIso);
      return `${sD}, ${sT} – ${eD}, ${eT}`;
    }

    function mondayOf_(anchorYmd) {
      const base = anchorYmd ? new Date(anchorYmd + "T12:00:00") : new Date();
      const day = base.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      const monday = new Date(base);
      monday.setDate(monday.getDate() + diff);
      return ymdLocal_(monday);
    }

    // =========================
    // Backend
    // =========================
    async function postBackend_(payload, { timeoutMs = 20000 } = {}) {
      const user = auth.currentUser;
      if (!user) throw new Error("not_authenticated");

      // neforce refresh (rychlejsie)
      const idToken = await user.getIdToken(false);

      const ctrl = new AbortController();
      const tmr = setTimeout(() => ctrl.abort(), timeoutMs);

      const t0 = performance.now();
      const r = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ ...payload, idToken }),
        signal: ctrl.signal
      }).finally(()=>clearTimeout(tmr));

      const ms = Math.round(performance.now() - t0);
      el.pillBackend.style.display = "inline-block";
      el.pillBackend.textContent = `Backend: ${ms} ms`;

      const j = await r.json();
      if (!j.ok) throw new Error(JSON.stringify(j));
      return j;
    }

    const backend = {
      me: () => postBackend_({ action:"me" }, { timeoutMs: 15000 }),
      month: (year, month) => postBackend_({ action:"summary_month", year, month, slotMin:SLOT_MIN, startHour:START_HOUR, endHour:END_HOUR }, { timeoutMs: 30000 }),
      day: (ymd) => postBackend_({ action:"slots_day", date:ymd, slotMin:SLOT_MIN, startHour:START_HOUR, endHour:END_HOUR }, { timeoutMs: 30000 }),
      my: () => postBackend_({ action:"my_reservations" }, { timeoutMs: 25000 }),
      reserve: (from, to, note) => postBackend_({ action:"reserve_slot", from, to, note }, { timeoutMs: 30000 }),
      cancel: (eventId) => postBackend_({ action:"cancel_reservation", eventId }, { timeoutMs: 30000 }),
      pushRegister: (subId) => postBackend_({ action:"push_register", subId }, { timeoutMs: 15000 }),
    };

    // =========================
    // Views
    // =========================
    function showView_(v) {
      el.viewMonth.style.display = (v === "month") ? "block" : "none";
      el.viewDay.style.display   = (v === "day") ? "block" : "none";
      el.viewWeek.style.display  = (v === "week") ? "block" : "none";
    }

    // month caching (simple in-memory)
    const monthCache = new Map(); // key "YYYY-MM" -> {ts,data}
    async function renderMonth_(anchorYmd) {
      hideMsg_(el.appMsg);

      const d = anchorYmd ? new Date(anchorYmd+"T12:00:00") : new Date();
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const key = `${year}-${String(month).padStart(2,"0")}`;

      let data;
      const cached = monthCache.get(key);
      if (cached && (Date.now() - cached.ts) < 25000) {
        data = cached.data;
      } else {
        data = await backend.month(year, month);
        monthCache.set(key, { ts: Date.now(), data });
      }

      const first = new Date(year, month-1, 1, 12, 0, 0, 0);
      const start = new Date(first);
      const day = start.getDay();
      const offset = (day === 0 ? 6 : day - 1);
      start.setDate(start.getDate() - offset);

      const cells = [];
      for (let i=0;i<42;i++){
        const cd = new Date(start); cd.setDate(cd.getDate()+i);
        const y = cd.getFullYear(), m = cd.getMonth()+1, da = cd.getDate();
        const ymd = `${y}-${String(m).padStart(2,"0")}-${String(da).padStart(2,"0")}`;
        const inMonth = (cd.getMonth() === (month-1));

        const s = data.summary[ymd];
        const free = s ? s.freeCount : 0;
        const total = s ? s.totalCount : 0;

        cells.push(`
          <button class="cellBtn ${inMonth ? "" : "dim"}" data-ymd="${ymd}">
            <div class="timeLabel">${da}</div>
            <div style="margin-top:6px; font-size:12px;">
              ${s ? `free: <b>${free}</b> / ${total}` : ""}
            </div>
          </button>
        `);
      }

      el.viewMonth.innerHTML = `
        <div class="monthGrid">${cells.join("")}</div>
      `;

      el.viewMonth.querySelectorAll("button[data-ymd]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const ymd = btn.getAttribute("data-ymd");
          el.picker.value = ymd;
          await renderDay_(ymd);
          showView_("day");
        });
      });
    }

    async function renderDay_(ymd) {
      hideMsg_(el.appMsg);
      const data = await backend.day(ymd);

      const items = data.slots.map(s => {
        const label = `${fmtTime_(s.from)} – ${fmtTime_(s.to)}`;
        const txt = s.free ? (LANG==="de" ? "frei" : "free") : (LANG==="de" ? "gebucht" : "booked");
        return `
          <button class="slotBtn ${s.free ? "" : "busy"}" data-from="${s.from}" data-to="${s.to}" ${s.free ? "" : "disabled"}>
            <div>${label}</div>
            <div class="timeLabel">${txt}</div>
          </button>
        `;
      }).join("");

      el.viewDay.innerHTML = `
        <div class="muted" style="margin-bottom:8px;">${ymd}</div>
        <div class="scroll" style="display:flex; flex-direction:column; gap:8px;">
          ${items}
        </div>
      `;

      // click free slot -> open modal with until dropdown
      el.viewDay.querySelectorAll("button.slotBtn[data-from]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const from = btn.getAttribute("data-from");
          openBookingModal_(ymd, from, data.slots);
        });
      });
    }

    async function renderWeek_(anchorYmd) {
      // zatial neimplementujeme komplikovane UI (u teba radsej klasika)
      // TODO: ked budes chciet, spravime normalne 7 stlpcov s mensimi bunkami
      el.viewWeek.innerHTML = `<div class="muted">Week view prídeme spravit ako klasiku (7 stĺpcov) v dalsom kroku.</div>`;
    }

    // =========================
    // My reservations + cancel
    // =========================
    async function renderMyReservations_() {
      hideMsg_(el.appMsg);
      const data = await backend.my();

      // next
      if (data.nextMine) {
        el.nextLine.textContent = fmtDateTimeLine_(data.nextMine.start, data.nextMine.end);
      } else {
        el.nextLine.textContent = "–";
      }

      const list = data.reservations || [];
      if (!list.length) {
        el.myList.innerHTML = `<div class="muted">${t("app.none")}</div>`;
        return;
      }

      el.myList.innerHTML = list.map(ev => {
        const line = fmtDateTimeLine_(ev.start, ev.end);
        const ownerLine = ev.ownerEmail ? `<div class="muted" style="margin-top:4px;">${ev.ownerEmail}</div>` : "";
        return `
          <div class="box" style="margin:0 0 10px;">
            <div style="display:flex; justify-content:space-between; gap:10px; align-items:flex-start;">
              <div>
                <div style="font-weight:900; font-size:16px;">${ev.title || "Fitness"}</div>
                <div class="muted" style="margin-top:4px;">${line}</div>
                ${ownerLine}
              </div>
              <button class="ghost btn" data-cancel="${ev.id}" type="button" style="padding:10px 12px;">
                ${t("app.cancel")}
              </button>
            </div>
          </div>
        `;
      }).join("");

      el.myList.querySelectorAll("button[data-cancel]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-cancel");
          btn.disabled = true;
          try {
            await backend.cancel(id);
            await hardRefresh_();
          } catch (e) {
            showMsg_(el.appMsg, String(e), "err");
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    async function hardRefresh_() {
      // refresh list + day view + month summary
      monthCache.clear();
      await renderMyReservations_();
      await renderMonth_(el.picker.value);
      await renderDay_(el.picker.value);
    }

    // =========================
    // Booking modal
    // =========================
    let bookingCtx = null; // { ymd, fromIso, toChoicesIso[] }
    function openBookingModal_(ymd, fromIso, daySlots) {
      hideMsg_(el.bkMsg);

      // build "until" choices: continuous free slots after selected start
      const idx = daySlots.findIndex(s => s.from === fromIso);
      if (idx < 0) return;

      const toChoices = [];
      for (let i = idx; i < daySlots.length; i++) {
        const s = daySlots[i];
        if (!s.free) break;
        // continuous means next slot.from == previous.to
        if (i > idx) {
          const prev = daySlots[i-1];
          if (prev.to !== s.from) break;
        }
        toChoices.push(s.to);
      }

      if (!toChoices.length) return;

      bookingCtx = { ymd, fromIso, toChoices };

      el.bkInfo.textContent = `${t("booking.start")}: ${fmtTime_(fromIso)}  •  ${t("booking.pickUntil")}`;
      el.bkUntil.innerHTML = toChoices.map(toIso => {
        const label = fmtTime_(toIso);
        return `<option value="${toIso}">${label}</option>`;
      }).join("");

      el.bkNote.value = "";

      el.bkBackdrop.style.display = "flex";
    }

    function closeBookingModal_() {
      bookingCtx = null;
      el.bkBackdrop.style.display = "none";
      hideMsg_(el.bkMsg);
    }

    el.bkCancel.addEventListener("click", closeBookingModal_);
    el.bkBackdrop.addEventListener("click", (e)=>{
      if (e.target === el.bkBackdrop) closeBookingModal_();
    });

    el.bkConfirm.addEventListener("click", async ()=>{
      if (!bookingCtx) return;
      el.bkConfirm.disabled = true;
      hideMsg_(el.bkMsg);

      try {
        const toIso = el.bkUntil.value;
        const note = el.bkNote.value || "";
        const res = await backend.reserve(bookingCtx.fromIso, toIso, note);

        showMsg_(el.bkMsg, t("booking.booked"), "ok");

        // auto close after 700ms and refresh UI
        setTimeout(async ()=>{
          closeBookingModal_();
          await hardRefresh_();
        }, 700);

      } catch (e) {
        const s = String(e || "");
        if (s.includes("limit_reached_max_2_active")) {
          showMsg_(el.bkMsg, t("booking.limit"), "err");
        } else if (s.includes("slot_not_free")) {
          showMsg_(el.bkMsg, LANG==="de" ? "Slot ist nicht frei." : "Slot is not free.", "err");
        } else {
          showMsg_(el.bkMsg, s, "err");
        }
      } finally {
        el.bkConfirm.disabled = false;
      }
    });

    // =========================
    // Drawer (hamburger)
    // =========================
    function openDrawer_() {
      el.drawerBackdrop.style.display = "block";
      el.drawer.classList.add("open");
    }
    function closeDrawer_() {
      el.drawerBackdrop.style.display = "none";
      el.drawer.classList.remove("open");
      el.settingsBox.style.display = "none";
    }
    el.menuBtn.addEventListener("click", openDrawer_);
    el.drawerBackdrop.addEventListener("click", closeDrawer_);

    el.m_settings.addEventListener("click", ()=>{
      el.settingsBox.style.display = (el.settingsBox.style.display === "none") ? "block" : "none";
    });

    el.m_refresh.addEventListener("click", async ()=>{
      closeDrawer_();
      await hardRefresh_().catch(e=>showMsg_(el.appMsg, String(e), "err"));
    });

    el.m_my.addEventListener("click", async ()=>{
      closeDrawer_();
      // scroll to my list
      el.myList.scrollIntoView({ behavior:"smooth", block:"start" });
    });

    el.m_logout.addEventListener("click", async ()=>{
      closeDrawer_();
      await signOut(auth);
      location.reload();
    });

    // =========================
    // OneSignal (lazy)
    // =========================
    let oneSignalLoaded = false;

    function setPushSwitchUI_(on) {
      el.pushSwitch.classList.toggle("on", !!on);
      el.pushStateLine.textContent = `${t("push.title")}: ${on ? t("push.on") : t("push.off")}`;
    }

    async function loadOneSignal_() {
      if (oneSignalLoaded) return;
      oneSignalLoaded = true;

      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
        s.defer = true;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      await new Promise((resolve) => {
        window.OneSignalDeferred.push(async function(OneSignal) {
          await OneSignal.init({ appId: ONESIGNAL_APP_ID });
          resolve();
        });
      });
    }

    async function enablePushFlow_() {
      await loadOneSignal_();
      // request permission + subscribe
      const OneSignal = window.OneSignal;
      const perm = await OneSignal.Notifications.permission;
      if (perm !== "granted") {
        await OneSignal.Notifications.requestPermission();
      }
      // get subscription id and save to backend
      const subId = await OneSignal.User.PushSubscription.id;
      if (subId) {
        await backend.pushRegister(subId);
        el.pushStateLine.textContent = t("push.active");
      } else {
        el.pushStateLine.textContent = t("push.needPerm");
      }
    }

    el.pushSwitch.addEventListener("click", async ()=>{
      const cur = (localStorage.getItem(LS_PUSH_ENABLED) === "1");
      const next = !cur;
      localStorage.setItem(LS_PUSH_ENABLED, next ? "1" : "0");
      setPushSwitchUI_(next);

      if (next) {
        try {
          await enablePushFlow_();
        } catch (e) {
          el.pushStateLine.textContent = String(e);
        }
      }
    });

    // =========================
    // Tab bindings
    // =========================
    el.tabMonth.addEventListener("click", async ()=>{ await renderMonth_(el.picker.value); showView_("month"); });
    el.tabDay.addEventListener("click", async ()=>{ await renderDay_(el.picker.value); showView_("day"); });
    el.tabWeek.addEventListener("click", async ()=>{ await renderWeek_(el.picker.value); showView_("week"); });

    el.picker.addEventListener("change", async ()=>{
      await renderDay_(el.picker.value);
      showView_("day");
    });

    el.btnReserve.addEventListener("click", async ()=>{
      // open today day view
      await renderDay_(el.picker.value);
      showView_("day");
    });
    el.btnMy.addEventListener("click", ()=>{
      el.myList.scrollIntoView({ behavior:"smooth", block:"start" });
    });
    el.btnRefreshMy.addEventListener("click", async ()=>{
      await hardRefresh_().catch(e=>showMsg_(el.appMsg, String(e), "err"));
    });

    // =========================
    // Boot
    // =========================
    el.langDe.addEventListener("click", ()=>setLang("de"));
    el.langEn.addEventListener("click", ()=>setLang("en"));

    applyI18n();
    setPill("checking");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // ak nie si prihlaseny, presmeruj (u teba to uz riesi Firebase email link flow inde)
        setPill("error");
        el.lockedBox.style.display = "block";
        el.lockedText.textContent = "Nicht angemeldet. Bitte Login-Link benutzen.";
        return;
      }

      setPill("signedIn");
      el.pillEmail.style.display = "inline-block";
      el.pillEmail.textContent = user.email || "";
      el.pillRole.style.display = "inline-block";

      try {
        const me = await backend.me();
        el.pillRole.textContent = "role: " + (me.role || "none");

        el.app.style.display = "block";
        el.pillAllowed.textContent = me.allowed ? t("app.allowed") : t("app.denied");
        el.pillTz.textContent = t("app.tz");

        if (!me.allowed) {
          el.lockedBox.style.display = "block";
          el.lockedText.textContent = LANG==="de"
            ? "Du bist nicht freigeschaltet. Bitte Admin kontaktieren."
            : "You are not enabled yet. Please contact an admin.";
          return;
        }

        // init date
        const today = ymdLocal_(new Date());
        el.picker.value = today;

        // push UI state
        const pushEnabled = (localStorage.getItem(LS_PUSH_ENABLED) === "1");
        setPushSwitchUI_(pushEnabled);

        // show month by default
        await renderMyReservations_();
        await renderMonth_(today);
        showView_("month");

        // if push enabled -> lazy init (no prompt unless user turns it on)
        if (pushEnabled) {
          // do not auto request permission; only load SDK
          loadOneSignal_().catch(()=>{});
        }

      } catch (e) {
        setPill("error");
        showMsg_(el.appMsg, String(e), "err");
      }
    });
  </script>
</body>
</html>
