<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fitnessraum Reservations</title>

  <!-- OneSignal Web SDK (v16) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <style>
    :root{
      --bg:#0b1220; --card:#111a2b; --muted:#94a3b8; --text:#e5e7eb;
      --accent:#22c55e; --danger:#ef4444; --warn:#f59e0b; --line:#1f2a44;
      --free:rgba(34,197,94,.08); --busy:rgba(239,68,68,.08);
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 18px;
    }

    :root[data-theme="light"]{
      --bg:#f6f7fb;
      --card:#ffffff;
      --muted:#475569;
      --text:#0f172a;
      --line:#e2e8f0;
      --free: rgba(34,197,94,.10);
      --busy: rgba(239,68,68,.08);
      --shadow: 0 10px 30px rgba(2,6,23,.12);
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
    a{color:#93c5fd;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .muted{color:var(--muted);font-size:13px}
    .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;color:color-mix(in oklab, var(--text) 70%, var(--muted) 30%)}

    /* Topbar sticky */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 120;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
      background: linear-gradient(to bottom, color-mix(in oklab, var(--bg) 92%, transparent 8%), color-mix(in oklab, var(--bg) 68%, transparent 32%));
      backdrop-filter: blur(8px);
      padding: 12px 0 10px;
    }

    .brand{display:flex;align-items:center;gap:10px}
    .badge{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
    .btn{
      border:1px solid var(--line);
      background: color-mix(in oklab, var(--card) 55%, var(--bg) 45%);
      color:var(--text);
      padding:10px 12px;
      border-radius:14px;
      cursor:pointer;
    }
    .btn:hover{border-color:color-mix(in oklab, var(--line) 50%, var(--text) 20%)}
    .btn.accent{background:color-mix(in oklab, var(--accent) 18%, var(--card) 82%);border-color:color-mix(in oklab, var(--accent) 45%, var(--line) 55%)}
    .btn.danger{background:color-mix(in oklab, var(--danger) 14%, var(--card) 86%);border-color:color-mix(in oklab, var(--danger) 40%, var(--line) 60%)}
    .btn.small{padding:8px 10px;border-radius:12px;font-size:13px}

    .grid{display:grid;grid-template-columns: 1.2fr .8fr;gap:14px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}

    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow: var(--shadow)}
    .card h3{margin:0 0 10px 0;font-size:16px}
    .hr{height:1px;background:var(--line);margin:12px 0}

    /* hamburger menu */
    .menuWrap{position:relative}
    .menu{position:absolute;right:0;top:44px;min-width:340px;z-index:200;background:var(--card);border:1px solid var(--line);
      border-radius:16px;padding:12px;display:none;box-shadow:var(--shadow)}
    .menu.open{display:block}
    .menu .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 6px;border-radius:12px}
    .menu .item:hover{background:color-mix(in oklab, var(--text) 4%, transparent 96%)}
    .toggle{display:flex;align-items:center;gap:10px}
    .switch{width:44px;height:24px;border-radius:999px;border:1px solid var(--line);background:color-mix(in oklab, var(--bg) 80%, var(--card) 20%);position:relative;cursor:pointer}
    .knob{width:18px;height:18px;border-radius:999px;background:#64748b;position:absolute;top:2px;left:2px;transition:all .15s}
    .switch.on{background:color-mix(in oklab, var(--accent) 18%, var(--card) 82%);border-color:color-mix(in oklab, var(--accent) 45%, var(--line) 55%)}
    .switch.on .knob{left:22px;background:var(--accent)}

    /* Views */
    .views{display:flex;gap:8px;flex-wrap:wrap}
    .pill{border:1px solid var(--line);background:color-mix(in oklab, var(--bg) 75%, var(--card) 25%);color:var(--text);padding:8px 10px;border-radius:999px;cursor:pointer;font-size:13px}
    .pill.active{border-color:color-mix(in oklab, var(--accent) 55%, var(--line) 45%);background:color-mix(in oklab, var(--accent) 14%, var(--card) 86%)}

    /* Month */
    .monthGrid{display:grid;grid-template-columns: repeat(7, 1fr);gap:8px}
    .dayBox{border:1px solid var(--line);border-radius:16px;padding:10px;min-height:76px;background:color-mix(in oklab, var(--bg) 72%, var(--card) 28%);cursor:pointer}
    .dayBox:hover{border-color:color-mix(in oklab, var(--line) 70%, var(--text) 20%)}
    .dayNum{font-size:13px;color:color-mix(in oklab, var(--text) 70%, var(--muted) 30%)}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--accent)}
    .dot.busy{background:var(--warn)}

    /* Week (desktop) */
    .weekGrid{display:grid;grid-template-columns: repeat(7, 1fr);gap:8px}
    .weekCol{border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .weekHead{padding:8px 10px;background:color-mix(in oklab, var(--bg) 75%, var(--card) 25%);border-bottom:1px solid var(--line);font-size:12px;color:color-mix(in oklab, var(--text) 70%, var(--muted) 30%)}

    /* Slots */
    .slot{padding:8px 10px;border-bottom:1px solid color-mix(in oklab, var(--line) 60%, transparent 40%);font-size:12px;display:flex;justify-content:space-between;gap:8px}
    .slot.free{background:var(--free);cursor:pointer}
    .slot.busy{background:var(--busy);opacity:.95}
    .slot:last-child{border-bottom:none}
    .slot .t{color:color-mix(in oklab, var(--text) 92%, var(--muted) 8%)}
    .slot .s{color:var(--muted)}

    /* Modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:999;padding:14px}
    .overlay.open{display:flex}
    .modal{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .modal h3{margin:0 0 10px 0}
    select,input{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:color-mix(in oklab, var(--bg) 78%, var(--card) 22%);
      color:var(--text)
    }
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:520px){.two{grid-template-columns:1fr}}

    .hidden{display:none !important}

    /* My reservations list */
    .list{display:flex;flex-direction:column;gap:10px}
    .resItem{border:1px solid var(--line);border-radius:16px;padding:10px;background:color-mix(in oklab, var(--bg) 72%, var(--card) 28%)}
    .resTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .hero{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      background: color-mix(in oklab, var(--accent) 10%, var(--card) 90%);
    }
    .heroTitle{font-weight:700;font-size:15px}
    .heroTime{margin-top:6px;font-size:14px}
    .heroSub{margin-top:6px}

    /* Toast */
    .toastWrap{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      width:min(560px, calc(100% - 24px));
      z-index:1200;
      display:flex;
      flex-direction:column;
      gap:10px;
      pointer-events:none;
    }
    .toast{
      pointer-events:auto;
      border:1px solid var(--line);
      background:var(--card);
      border-radius:16px;
      padding:12px 12px;
      box-shadow: var(--shadow);
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:flex-start;
    }
    .toast .msg{font-size:14px}
    .toast.ok{border-color:color-mix(in oklab, var(--accent) 45%, var(--line) 55%)}
    .toast.err{border-color:color-mix(in oklab, var(--danger) 40%, var(--line) 60%)}
    .toast.warn{border-color:color-mix(in oklab, var(--warn) 45%, var(--line) 55%)}

    /* Layout order */
    #calCard { order: 1; }
    #myResCard { order: 2; }

    @media(max-width:980px){
      #myResCard { order: 1; }
      #calCard { order: 2; }
    }

    @media(max-width:520px){
      #myResCard{
        position: sticky;
        top: 64px; /* under topbar */
        z-index: 110;
        max-height: 42vh;
        overflow:auto;
      }
      .btn.small{ padding:10px 12px; font-size:13px; }
      .slot{ min-height:44px; padding:10px 12px; font-size:13px; }
      .slot .t{ font-size:14px; }
      .slot .s{ font-size:12px; }
      .monthGrid{ gap:10px }
      .dayBox{ min-height:84px }
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div style="font-weight:800;letter-spacing:.2px">Fitnessraum</div>
      <span class="badge" id="statusBadge">offline</span>
    </div>

    <div class="row">
      <div class="menuWrap">
        <button class="btn" id="hambBtn">☰ Menu</button>
        <div class="menu" id="hambMenu">
          <div class="item"><div class="muted">Stav</div><div class="kbd" id="mStatus">—</div></div>
          <div class="item"><div class="muted">Email</div><div class="kbd" id="mEmail">—</div></div>
          <div class="item"><div class="muted">Rola</div><div class="kbd" id="mRole">—</div></div>
          <div class="item"><div class="muted">Backend</div><div class="kbd" id="mBackend">—</div></div>

          <div class="item">
            <div class="muted">Push notifikácie</div>
            <div class="toggle">
              <div class="switch" id="pushSwitch"><div class="knob"></div></div>
              <div class="kbd" id="pushLabel">off</div>
            </div>
          </div>

          <div class="item">
            <div class="muted">Téma</div>
            <div class="toggle">
              <div class="switch" id="themeSwitch"><div class="knob"></div></div>
              <div class="kbd" id="themeLabel">auto</div>
            </div>
          </div>

          <div class="hr"></div>
          <button class="btn danger" id="logoutBtn" style="width:100%">Odhlásiť</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <h3>Prihlásenie</h3>
    <div class="two">
      <div>
        <label class="muted">Email</label>
        <input id="email" type="email" placeholder="email" autocomplete="email" />
      </div>
      <div>
        <label class="muted">Heslo</label>
        <input id="pass" type="password" placeholder="heslo" autocomplete="current-password" />
      </div>
    </div>

    <div class="row" style="margin-top:10px;justify-content:space-between">
      <div class="row">
        <button class="btn accent" id="loginBtn">Prihlásiť</button>
        <button class="btn" id="googleBtn" type="button">Prihlásiť cez Google</button>
      </div>
      <span class="muted" id="loginMsg"></span>
    </div>
  </div>

  <!-- APP -->
  <div class="grid hidden" id="appGrid">

    <!-- My reservations FIRST (mobile), right side (desktop) -->
    <div class="card" id="myResCard">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <h3 style="margin:0">Moje rezervácie</h3>
          <div class="muted" id="myResHint">—</div>
        </div>
        <button class="btn small accent" id="quickBookBtn">Rezervovať dnes</button>
      </div>

      <div class="hr"></div>

      <!-- HERO -->
      <div id="heroBox"></div>

      <div class="hr"></div>
      <div class="list" id="myResList"></div>
    </div>

    <!-- Calendar -->
    <div class="card" id="calCard">
      <div class="row" style="justify-content:space-between">
        <h3 style="margin:0">Kalendár</h3>
        <div class="row">
          <button class="btn small" id="prevBtn">◀</button>
          <button class="btn small" id="todayBtn">Dnes</button>
          <button class="btn small" id="nextBtn">▶</button>
        </div>
      </div>

      <div class="row" style="margin-top:10px;justify-content:space-between">
        <div class="views">
          <button class="pill active" data-view="month" id="viewMonth">Mesiac</button>
          <button class="pill" data-view="week" id="viewWeek">Týždeň</button>
          <button class="pill" data-view="day" id="viewDay">Deň</button>
        </div>
        <div class="kbd" id="anchorLabel">—</div>
      </div>

      <div class="hr"></div>
      <div id="calendarArea"></div>
    </div>

  </div>
</div>

<!-- BOOK MODAL -->
<div class="overlay" id="bookOverlay">
  <div class="modal">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">Rezervácia</h3>
      <button class="btn small" id="closeModal">✕</button>
    </div>

    <div class="hr"></div>

    <div class="two">
      <div>
        <label class="muted">Od</label>
        <input id="bookStart" disabled />
      </div>
      <div>
        <label class="muted">Do</label>
        <select id="bookEnd"></select>
      </div>
    </div>

    <div style="margin-top:10px">
      <label class="muted">Poznámka (voliteľné)</label>
      <input id="bookNote" placeholder="napr. tréning / meno / ..." />
    </div>

    <div class="row" style="margin-top:12px;justify-content:space-between">
      <span class="muted" id="bookMsg"></span>
      <button class="btn accent" id="bookBtn">Rezervovať</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toastWrap" id="toastWrap"></div>

<script>
/** ========= CONFIG ========= **/

// Apps Script WebApp URL
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyqMOFEywa32j-ALJ9OzWpfZI2vftY9hw9Do4Oc9DZGNuApSr55V2ywUxozqn5lfvRX/exec";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCY2nmL9I9TjxB0rlVPMCmcl4WKna21IJE",
  authDomain: "fitnessraumwm-app.firebaseapp.com",
  projectId: "fitnessraumwm-app",
  storageBucket: "fitnessraumwm-app.firebasestorage.app",
  messagingSenderId: "130435754352",
  appId: "1:130435754352:web:a8a38eeeee7c25867e47b5",
  measurementId: "G-B629775N63"
};

/** ========= INIT ========= **/
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const $ = (id)=>document.getElementById(id);

let state = {
  user: null,
  idToken: null,
  idTokenExp: 0,
  view: "month",
  anchor: new Date(),
  modal: { startISO: null, endChoices: [] },
  pushEnabled: false,
  inFlight: new Map(),
};

function isMobile(){ return window.matchMedia("(max-width:520px)").matches; }

function fmtTime(d){
  const x = new Date(d);
  return x.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}
function fmtDateShort(d){
  const x = new Date(d);
  return x.toLocaleDateString([], {weekday:"short", month:"2-digit", day:"2-digit"});
}
function fmtDateFull(d){
  const x = new Date(d);
  return x.toLocaleDateString([], {weekday:"long", year:"numeric", month:"2-digit", day:"2-digit"});
}
function ymd(d){
  const x = new Date(d);
  const y = x.getFullYear();
  const m = String(x.getMonth()+1).padStart(2,"0");
  const dd = String(x.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function ym(d){
  const x = new Date(d);
  const y = x.getFullYear();
  const m = String(x.getMonth()+1).padStart(2,"0");
  return `${y}-${m}`;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }

/** ========= TOAST ========= **/
function toast(type, message, actions=[]){
  const wrap = $("toastWrap");
  const el = document.createElement("div");
  el.className = "toast " + (type || "");
  el.innerHTML = `
    <div class="msg">${message}</div>
    <div class="row" style="gap:8px;flex-wrap:nowrap">
      ${actions.map((a,i)=>`<button class="btn small ${a.kind||""}" data-i="${i}">${a.label}</button>`).join("")}
      <button class="btn small" data-close="1">✕</button>
    </div>
  `;
  wrap.appendChild(el);

  el.querySelectorAll("button[data-i]").forEach(btn=>{
    btn.onclick = ()=>{
      const i = parseInt(btn.getAttribute("data-i"),10);
      actions[i]?.onClick?.();
      el.remove();
    };
  });
  el.querySelector("button[data-close]")?.addEventListener("click", ()=>el.remove());

  setTimeout(()=>{ if (el.isConnected) el.remove(); }, 4500);
}

/** ========= Status/Menu ========= **/
function setStatus(ok, text){
  $("statusBadge").textContent = text || (ok ? "online" : "offline");
  $("mStatus").textContent = $("statusBadge").textContent;
}
function setMenuUser(){
  $("mEmail").textContent = state.user?.email || "—";
  $("mRole").textContent = state.user?.isAdmin ? "admin" : "user";
}

/** ========= Theme ========= **/
function applyTheme(mode){
  localStorage.setItem("themeMode", mode);
  let finalMode = mode;
  if (mode === "auto"){
    finalMode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  document.documentElement.dataset.theme = finalMode;
  $("themeLabel").textContent = mode;

  const sw = $("themeSwitch");
  if (finalMode === "light") sw.classList.add("on");
  else sw.classList.remove("on");
}
function initTheme(){
  const saved = localStorage.getItem("themeMode") || "auto";
  applyTheme(saved);
  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", ()=>{
    if ((localStorage.getItem("themeMode")||"auto")==="auto") applyTheme("auto");
  });
}
$("themeSwitch").onclick = ()=>{
  const current = localStorage.getItem("themeMode") || "auto";
  const next = current === "auto" ? "dark" : current === "dark" ? "light" : "auto";
  applyTheme(next);
};

/** ========= TOKEN CACHE ========= **/
async function getIdTokenCached(force=false){
  const now = Date.now();
  if (!force && state.idToken && now < state.idTokenExp - 15_000) return state.idToken;
  const u = auth.currentUser;
  if (!u) throw new Error("not_logged_in");
  const t = await u.getIdToken(force);
  state.idToken = t;

  const payload = JSON.parse(atob(t.split(".")[1]));
  state.idTokenExp = (payload.exp || 0) * 1000;
  return t;
}

/** ========= REQUEST (dedupe + no CORS preflight) ========= **/
async function api(action, body={}){
  const token = await getIdTokenCached(false);
  const key = action + ":" + JSON.stringify(body);
  if (state.inFlight.has(key)) return state.inFlight.get(key);

  const p = (async ()=>{
    const t0 = performance.now();
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type":"text/plain;charset=UTF-8" }, // ✅ avoid preflight
      body: JSON.stringify({ action, idToken: token, ...body })
    });

    const text = await res.text();
    const data = JSON.parse(text || "{}");
    $("mBackend").textContent = Math.round(performance.now() - t0) + " ms";

    if (!data.ok) throw new Error(data.error || "backend_error");
    return data;
  })();

  state.inFlight.set(key, p);
  try { return await p; }
  finally { state.inFlight.delete(key); }
}

/** ========= OneSignal ========= **/
function setPushUI(on){
  state.pushEnabled = !!on;
  const sw = $("pushSwitch");
  if (on) sw.classList.add("on"); else sw.classList.remove("on");
  $("pushLabel").textContent = on ? "on" : "off";
  localStorage.setItem("pushEnabled", on ? "1" : "0");
}
function initOneSignal(){
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal) {
    // appId je na webe – ak ho chces, vies ho dat aj do HTML ako const
    await OneSignal.init({ appId: "61b4fca3-7bbd-4556-973d-0a589623e89b" });
    if (state.user?.uid) {
      try { await OneSignal.login(state.user.uid); } catch(e){}
    }
  });
}
async function enablePush(){
  setPushUI(true);
  initOneSignal();
  try{
    window.OneSignalDeferred.push(async function(OneSignal){
      await OneSignal.Notifications.requestPermission();
      toast("ok", "Push notifikácie sú zapnuté.");
    });
  }catch(e){}
}
function disablePush(){
  setPushUI(false);
  toast("warn", "Push notifikácie sú vypnuté.");
}
$("pushSwitch").onclick = async ()=>{
  if (!state.user) return;
  if (state.pushEnabled) disablePush();
  else await enablePush();
};

/** ========= Menu wiring ========= **/
$("hambBtn").onclick = ()=> $("hambMenu").classList.toggle("open");
document.addEventListener("click",(e)=>{
  const menu = $("hambMenu");
  const wrap = document.querySelector(".menuWrap");
  if (!wrap.contains(e.target)) menu.classList.remove("open");
});
$("logoutBtn").onclick = async ()=>{ await auth.signOut(); };

/** ========= Login ========= **/
$("loginBtn").onclick = async ()=>{
  $("loginMsg").textContent = "";
  try{
    const email = $("email").value.trim();
    const pass = $("pass").value;
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    const code = e?.code || "";
    $("loginMsg").textContent =
      code.includes("wrong-password") ? "Nesprávne heslo." :
      code.includes("user-not-found") ? "Používateľ neexistuje." :
      "Prihlásenie zlyhalo.";
  }
};

$("googleBtn").onclick = async ()=>{
  $("loginMsg").textContent = "";
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  }catch(e){
    $("loginMsg").textContent = "Google prihlásenie zlyhalo.";
  }
};

/** ========= Views ========= **/
$("viewMonth").onclick = ()=>setView("month");
$("viewWeek").onclick = ()=>setView("week");
$("viewDay").onclick = ()=>setView("day");

$("prevBtn").onclick = ()=>{
  if (state.view==="month") state.anchor = addMonths(state.anchor, -1);
  else if (state.view==="week") state.anchor = addDays(state.anchor, -7);
  else state.anchor = addDays(state.anchor, -1);
  refreshAll();
};
$("nextBtn").onclick = ()=>{
  if (state.view==="month") state.anchor = addMonths(state.anchor, 1);
  else if (state.view==="week") state.anchor = addDays(state.anchor, 7);
  else state.anchor = addDays(state.anchor, 1);
  refreshAll();
};
$("todayBtn").onclick = ()=>{
  state.anchor = new Date();
  refreshAll();
};

function setView(v){
  state.view = v;
  document.querySelectorAll(".pill").forEach(b=>b.classList.remove("active"));
  if (v==="month") $("viewMonth").classList.add("active");
  if (v==="week") $("viewWeek").classList.add("active");
  if (v==="day") $("viewDay").classList.add("active");
  refreshCalendar();
}

/** ========= Modal ========= **/
$("closeModal").onclick = closeModal;
$("bookOverlay").addEventListener("click",(e)=>{ if (e.target.id==="bookOverlay") closeModal(); });

function openModal(startISO, endChoices){
  state.modal.startISO = startISO;
  state.modal.endChoices = endChoices;

  $("bookStart").value = `${fmtDateFull(startISO)} ${fmtTime(startISO)}`;
  $("bookEnd").innerHTML = endChoices.map(iso=>{
    const d = new Date(iso);
    return `<option value="${iso}">${fmtTime(d)}</option>`;
  }).join("");

  $("bookNote").value = "";
  $("bookMsg").textContent = "";
  $("bookOverlay").classList.add("open");
}
function closeModal(){
  $("bookOverlay").classList.remove("open");
  state.modal.startISO = null;
  state.modal.endChoices = [];
}

$("bookBtn").onclick = async ()=>{
  try{
    $("bookMsg").textContent = "Rezervujem...";
    const startISO = state.modal.startISO;
    const endISO = $("bookEnd").value;

    await api("reserve_slot", {
      start: startISO,
      end: endISO,
      note: $("bookNote").value.trim(),
      title: "Fitnessraum"
    });

    closeModal();
    toast("ok", "Rezervácia potvrdená.");

    await refreshCalendar();
    await refreshMyReservations();
  }catch(e){
    const msg = String(e.message || e);
    const human =
      msg.includes("limit_2_per_day") ? "Limit: max 2 rezervácie na deň." :
      msg.includes("slot_busy") ? "Tento čas je už obsadený." :
      msg.includes("outside_hours") ? "Mimo povoleného času (05:00–23:00)." :
      msg.includes("max_parallel") ? "Obsadené: v tomto čase sú už 3 paralelné rezervácie." :
      "Rezervácia zlyhala.";
    $("bookMsg").textContent = "";
    toast("err", human);
  }
};

/** ========= Quick primary action ========= **/
$("quickBookBtn").onclick = async ()=>{
  state.anchor = new Date();
  setView("day");
  await refreshCalendar();
  setTimeout(()=>{ document.getElementById("calCard")?.scrollIntoView({behavior:"smooth"}); }, 50);
};

/** ========= Calendar rendering ========= **/
async function refreshCalendar(){
  $("anchorLabel").textContent =
    state.view==="month" ? ym(state.anchor) :
    state.view==="week" ? ("Týždeň: " + ymd(state.anchor)) :
    ymd(state.anchor);

  if (state.view==="month") await renderMonth();
  if (state.view==="week") await renderWeek();
  if (state.view==="day") await renderDay();
}

async function renderMonth(){
  const anchor = new Date(state.anchor);
  const monthStart = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const startDow = (monthStart.getDay()+6)%7; // Mon=0
  const gridStart = addDays(monthStart, -startDow);

  const m = ym(anchor);
  const data = await api("availability_month", { date: m });
  const busy = data.busyCountByDay || {};

  const boxes = [];
  for (let i=0;i<42;i++){
    const d = addDays(gridStart, i);
    const ds = ymd(d);
    const inMonth = d.getMonth() === anchor.getMonth();
    const count = busy[ds] || 0;
    boxes.push(`
      <div class="dayBox" data-day="${ds}" style="opacity:${inMonth?1:.55}">
        <div class="dayNum">${ds}</div>
        <div style="margin-top:8px" class="muted">
          ${count ? `<span class="dot busy"></span>${count} rezerv.` : `<span class="dot"></span>voľné`}
        </div>
      </div>
    `);
  }

  $("calendarArea").innerHTML = `<div class="monthGrid">${boxes.join("")}</div>`;

  document.querySelectorAll(".dayBox").forEach(el=>{
    el.onclick = ()=>{
      const ds = el.getAttribute("data-day");
      state.anchor = new Date(ds+"T00:00:00");
      setView("day");
    };
  });
}

async function renderDay(){
  const ds = ymd(state.anchor);
  const data = await api("availability_day", { date: ds });
  const slots = data.slots || [];

  const html = slots.map((s, idx)=>{
    const st = new Date(s.start);
    const en = new Date(s.end);
    return `
      <div class="slot ${s.status}" data-idx="${idx}">
        <div class="t">${fmtTime(st)} - ${fmtTime(en)}</div>
        <div class="s">${s.status==="free" ? "voľné" : "obsadené"}</div>
      </div>
    `;
  }).join("");

  $("calendarArea").innerHTML = html || `<div class="muted">Žiadne sloty.</div>`;

  document.querySelectorAll(".slot.free").forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.getAttribute("data-idx"),10);
      const choices = [];
      for (let j=idx+1;j<=slots.length;j++){
        if (j===slots.length){
          choices.push(slots[slots.length-1].end);
          break;
        }
        if (slots[j].status!=="free") break;
        choices.push(slots[j].end);
      }
      openModal(slots[idx].start, choices);
    };
  });
}

async function renderWeek(){
  const ds = ymd(state.anchor);
  const data = await api("availability_week", { date: ds });
  const days = data.days || [];

  // ✅ Mobile week = day picker + day slots
  if (isMobile()){
    const selected = ymd(state.anchor);

    const chips = days.map(dObj=>{
      const date = dObj.date;
      const active = date === selected ? "active" : "";
      return `<button class="pill ${active}" data-day="${date}" style="padding:7px 10px;white-space:nowrap">${fmtDateShort(date)}</button>`;
    }).join("");

    $("calendarArea").innerHTML = `
      <div class="views" id="weekDayPicker">${chips}</div>
      <div class="hr"></div>
      <div id="weekDaySlots"></div>
    `;

    async function loadDay(dayStr){
      const d = await api("availability_day", { date: dayStr });
      const slots = d.slots || [];

      const html = slots.map((s, idx)=>{
        const st = new Date(s.start);
        const en = new Date(s.end);
        return `
          <div class="slot ${s.status}" data-idx="${idx}">
            <div class="t">${fmtTime(st)} - ${fmtTime(en)}</div>
            <div class="s">${s.status==="free" ? "voľné" : "obsadené"}</div>
          </div>
        `;
      }).join("");

      $("weekDaySlots").innerHTML = html || `<div class="muted">Žiadne sloty.</div>`;

      document.querySelectorAll("#weekDaySlots .slot.free").forEach(el=>{
        el.onclick = ()=>{
          const idx = parseInt(el.getAttribute("data-idx"),10);
          const choices = [];
          for (let j=idx+1;j<=slots.length;j++){
            if (j===slots.length){
              choices.push(slots[slots.length-1].end);
              break;
            }
            if (slots[j].status!=="free") break;
            choices.push(slots[j].end);
          }
          openModal(slots[idx].start, choices);
        };
      });
    }

    await loadDay(selected);

    document.querySelectorAll("#weekDayPicker .pill").forEach(btn=>{
      btn.onclick = async ()=>{
        document.querySelectorAll("#weekDayPicker .pill").forEach(x=>x.classList.remove("active"));
        btn.classList.add("active");
        await loadDay(btn.getAttribute("data-day"));
      };
    });

    return;
  }

  // ✅ Desktop week = 7 columns
  const cols = days.map((dObj)=>{
    const date = dObj.date || "";
    const slots = (dObj.slots || []);
    const rows = slots.map((s, idx)=>{
      const st = new Date(s.start);
      return `
        <div class="slot ${s.status}" data-day="${date}" data-idx="${idx}">
          <div class="t">${fmtTime(st)}</div>
          <div class="s">${s.status==="free" ? "voľné" : "obsadené"}</div>
        </div>
      `;
    }).join("");
    return `
      <div class="weekCol">
        <div class="weekHead">${date}</div>
        <div>${rows}</div>
      </div>
    `;
  }).join("");

  $("calendarArea").innerHTML = `<div class="weekGrid">${cols}</div>`;

  document.querySelectorAll(".weekCol .slot.free").forEach(el=>{
    el.onclick = async ()=>{
      const day = el.getAttribute("data-day");
      const idx = parseInt(el.getAttribute("data-idx"),10);
      const d = await api("availability_day", { date: day });
      const slots = d.slots || [];

      const choices = [];
      for (let j=idx+1;j<=slots.length;j++){
        if (j===slots.length){
          choices.push(slots[slots.length-1].end);
          break;
        }
        if (slots[j].status!=="free") break;
        choices.push(slots[j].end);
      }
      openModal(slots[idx].start, choices);
    };
  });
}

/** ========= Reservations + HERO ========= **/
function minsBetween(a,b){ return Math.max(0, Math.round((b - a) / 60000)); }

function renderHero(resList){
  const box = $("heroBox");
  const now = new Date();
  const today = ymd(now);

  // active: now between start/end
  const active = resList.find(r => new Date(r.start) <= now && now < new Date(r.end));

  // next: first future
  const next = resList.find(r => new Date(r.start) > now);

  if (active){
    const start = new Date(active.start);
    const end = new Date(active.end);
    const left = minsBetween(now, end);
    box.innerHTML = `
      <div class="hero">
        <div class="heroTitle">Aktívna rezervácia</div>
        <div class="heroTime">${fmtDateFull(start)} ${fmtTime(start)} – ${fmtTime(end)}</div>
        <div class="muted heroSub">Zostáva približne ${left} min.</div>
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <div class="muted">Ak potrebuješ, môžeš ju zrušiť.</div>
          <button class="btn small danger" id="heroCancelBtn">Storno</button>
        </div>
      </div>
    `;
    $("heroCancelBtn").onclick = ()=> cancelById(active.id);
    return;
  }

  if (next){
    const start = new Date(next.start);
    const end = new Date(next.end);
    const mins = minsBetween(now, start);
    const hours = Math.floor(mins/60);
    const mm = mins % 60;
    const inTxt = mins < 60 ? `o ${mins} min` : `o ${hours} h ${String(mm).padStart(2,"0")} min`;

    box.innerHTML = `
      <div class="hero">
        <div class="heroTitle">Najbližšia rezervácia</div>
        <div class="heroTime">${fmtDateFull(start)} ${fmtTime(start)} – ${fmtTime(end)}</div>
        <div class="muted heroSub">Začne ${inTxt}.</div>
        <div class="row" style="margin-top:10px;justify-content:flex-end">
          <button class="btn small danger" id="heroCancelBtn">Storno</button>
        </div>
      </div>
    `;
    $("heroCancelBtn").onclick = ()=> cancelById(next.id);
    return;
  }

  // nothing
  box.innerHTML = `
    <div class="hero" style="background:color-mix(in oklab, var(--card) 92%, var(--bg) 8%)">
      <div class="heroTitle">Dnes ešte nič – chceš rezervovať?</div>
      <div class="muted heroSub">Vyber si čas v kalendári alebo klikni na tlačidlo.</div>
      <div class="row" style="margin-top:10px;justify-content:flex-end">
        <button class="btn small accent" id="heroBookTodayBtn">Rezervovať dnes</button>
      </div>
    </div>
  `;
  $("heroBookTodayBtn").onclick = $("quickBookBtn").onclick;
}

async function cancelById(eventId){
  try{
    await api("cancel_reservation", { eventId });
    toast("ok", "Rezervácia zrušená.");
    await refreshCalendar();
    await refreshMyReservations();
  }catch(e){
    toast("err", "Storno zlyhalo. Skús to znova.");
  }
}

async function refreshMyReservations(){
  const data = await api("my_reservations", { includePast:false });
  const list = data.reservations || [];

  $("myResHint").textContent = list.length ? `Budúce: ${list.length}` : "Žiadne budúce rezervácie.";

  renderHero(list);

  $("myResList").innerHTML = list.map(r=>{
    return `
      <div class="resItem">
        <div class="resTop">
          <div>
            <div style="font-weight:700">${fmtDateFull(r.start)} ${fmtTime(r.start)} – ${fmtTime(r.end)}</div>
            <div class="muted">${r.title}${r.ownerEmail ? " · " + r.ownerEmail : ""}</div>
          </div>
          <button class="btn small danger" data-id="${r.id}">Storno</button>
        </div>
      </div>
    `;
  }).join("");

  $("myResList").querySelectorAll("button[data-id]").forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute("data-id");
      btn.disabled = true;
      await cancelById(id);
      btn.disabled = false;
    };
  });
}

/** ========= Auth state ========= **/
auth.onAuthStateChanged(async (u)=>{
  if (!u){
    state.user = null;
    state.idToken = null;
    setStatus(false,"offline");
    $("loginCard").classList.remove("hidden");
    $("appGrid").classList.add("hidden");
    return;
  }

  try{
    setStatus(true,"online");
    $("loginCard").classList.add("hidden");
    $("appGrid").classList.remove("hidden");

    setPushUI(localStorage.getItem("pushEnabled")==="1");

    const data = await api("ping", {});
    state.user = data.user;
    setMenuUser();

    if (state.pushEnabled) await enablePush();

    await refreshAll();

    toast("ok", "Prihlásenie úspešné.");
  }catch(e){
    console.error(e);
    setStatus(false,"error");
    toast("err", "Niečo sa pokazilo. Obnov stránku.");
  }
});

async function refreshAll(){
  try{
    await refreshMyReservations();
    await refreshCalendar();
  }catch(e){
    console.error(e);
  }
}

/** ========= Startup ========= **/
initTheme();
setStatus(false,"offline");
</script>
