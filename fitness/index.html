<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Webi Fitness</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body { margin:0; background:#0b0f14; color:#e9eef7; }

    .wrap { min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:18px; }
    .card { width:100%; max-width:980px; background:#121a24; border:1px solid #223042; border-radius:18px; padding:16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); position:relative; }

    h1 { font-size:20px; margin:0; }
    .sub { color:#a9b6c7; font-size:13px; margin:6px 0 14px; line-height:1.4; }

    .pillRow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
    .pill { display:inline-flex; gap:8px; align-items:center; padding:6px 10px; border-radius:999px; background:#0e1520; border:1px solid #2a3b52; color:#a9b6c7; font-size:12px; }

    .grid2 { display:grid; grid-template-columns: 1fr; gap:12px; }
    @media (min-width: 980px){ .grid2 { grid-template-columns: 1fr 1fr; } }

    .box { border:1px solid #2a3b52; background:#0e1520; border-radius:14px; padding:12px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    label { display:block; font-size:12px; color:#a9b6c7; margin: 10px 0 6px; }
    input, textarea, select {
      width:100%; padding:12px 12px; border-radius:12px;
      border:1px solid #2a3b52; background:#0b1220; color:#e9eef7; outline:none;
    }
    input:focus, textarea:focus, select:focus { border-color:#4a83ff; box-shadow:0 0 0 4px rgba(74,131,255,.18); }

    button {
      padding:12px 14px; border-radius:12px; border:0;
      background:#4a83ff; color:#08111f; font-weight:800; cursor:pointer;
    }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .ghost { background:transparent; color:#cfe0ff; border:1px solid #2a3b52; font-weight:800; }
    .soft { background:rgba(74,131,255,0.12); color:#cfe0ff; border:1px solid #2a3b52; font-weight:800; }

    .msg { margin-top:10px; padding:10px 12px; border-radius:12px; font-size:13px; line-height:1.35; border:1px solid #2a3b52; background:#0b1220; color:#cfe0ff; display:none; }
    .msg.err { border-color:#ff5a7a55; color:#ffd1da; display:block; }
    .msg.ok  { border-color:#35d07f55; color:#caffdf; display:block; }

    /* Top right: language + burger */
    .topRight { position:absolute; top:12px; right:12px; display:flex; gap:8px; align-items:center; }
    .chipBtn { width:auto; padding:6px 10px; border-radius:999px; background:transparent; color:#a9b6c7; border:1px solid #2a3b52; font-weight:800; }
    .chipBtn.active { background:#0b1220; color:#e9eef7; border-color:#4a83ff55; }

    /* Calendar */
    .calTop { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .tabBtn { padding:8px 12px; border-radius:12px; }
    .monthGrid { display:grid; grid-template-columns: repeat(7, 1fr); gap:8px; margin-top:10px; }
    .cellBtn {
      text-align:left; padding:10px; border-radius:12px;
      border:1px solid #2a3b52; background:#0b1220; color:#e9eef7;
      cursor:pointer; min-height:62px;
    }
    .cellBtn.dim { opacity:.45; }
    .timeLabel { color:#a9b6c7; font-size:12px; }
    .scroll { max-height:420px; overflow:auto; padding-right:6px; }
    .slotBtn {
      width:100%; text-align:left; padding:10px 12px; border-radius:12px;
      border:1px solid #2a3b52; background:#0b1220; color:#e9eef7; cursor:pointer;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .slotBtn.busy { cursor:not-allowed; opacity:.65; background:rgba(255,90,122,0.08); }
    .slotBtn.free { background:#0b1220; }

    /* Drawer */
    .drawerOverlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:30; }
    .drawer {
      position:fixed; top:0; right:0; height:100vh; width:min(360px, 92vw);
      background:#0e1520; border-left:1px solid #223042; padding:14px;
      transform:translateX(110%); transition:transform .2s ease; z-index:31;
      display:flex; flex-direction:column; gap:10px;
    }
    .drawer.open { transform:translateX(0%); }
    .drawerOverlay.show { display:block; }
    .drawerTitle { font-size:16px; font-weight:900; margin:6px 0 4px; }
    .menuBtn { width:100%; text-align:left; }

    /* Modal */
    .modalOverlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:40; }
    .modal {
      position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
      width:min(520px, 92vw); background:#0e1520; border:1px solid #223042;
      border-radius:18px; padding:14px; z-index:41; display:none;
      box-shadow:0 10px 30px rgba(0,0,0,.45);
    }
    .modalTitle { font-size:18px; font-weight:900; margin:4px 0 10px; }
    .modalActions { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:10px; }

    /* Hide login block when signed in */
    #loginBox { display:none; }
    #appBox { display:none; }

    .muted { color:#a9b6c7; font-size:12px; }
    .h2 { font-size:16px; font-weight:900; margin:0 0 8px; }

    .listItem {
      border:1px solid #2a3b52; background:#0b1220; border-radius:14px;
      padding:12px; display:flex; justify-content:space-between; gap:10px; align-items:center;
    }
    .listItem .title { font-weight:900; }
    .listItem .meta { color:#a9b6c7; font-size:12px; margin-top:4px; }
  </style>
</head>

      const saved = localStorage.getItem(LS_LANG_KEY);

    // =========================
    // Date formatting
    // =========================
    function ymdLocal_(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const da = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${da}`;
    }

    function fmtTime_(iso) {
      const dt = new Date(iso);
      return new Intl.DateTimeFormat(LANG === "de" ? "de-CH" : "en-GB", {
        timeZone: TZ, hour: "2-digit", minute: "2-digit"
      }).format(dt);
    }

    function fmtDateTime_(iso) {
      const dt = new Date(iso);
      return new Intl.DateTimeFormat(LANG === "de" ? "de-CH" : "en-GB", {
        timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit"
      }).format(dt);
    }

    function mondayOf_(anchorYmd) {
      const base = new Date((anchorYmd || ymdLocal_()) + "T12:00:00");
      const day = base.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      const monday = new Date(base);
      monday.setDate(monday.getDate() + diff);
      return ymdLocal_(monday);
    }

    async function getIdTokenCached_() {
      const user = auth.currentUser;
      if (!user) throw new Error("not_authenticated");
      const now = Date.now();
      if (cachedIdToken && now < cachedIdTokenExp) return cachedIdToken;
      // no force refresh -> faster
      const tok = await user.getIdToken(false);
      cachedIdToken = tok;
      cachedIdTokenExp = now + 45 * 1000; // 45s cache
      return tok;
    }

    async function postBackend_(payload) {
      const idToken = await getIdTokenCached_();
      const t0 = performance.now();
      const r = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...payload, idToken })
      });
      const data = await r.json().catch(()=>({ ok:false, error:"bad_json" }));
      const ms = Math.round(performance.now() - t0);
      // show in drawer info
      els.mInfoBackend.textContent = "Backend: " + ms + " ms";
      return data;
    }

    const api = {
      me: ()=>postBackend_({ action:"me" }),
      summaryMonth: (year, month)=>postBackend_({ action:"summary_month", year, month, slotMin:SLOT_MIN, startHour:START_HOUR, endHour:END_HOUR }),
      slotsDay: (ymd)=>postBackend_({ action:"slots_day", date:ymd, slotMin:SLOT_MIN, startHour:START_HOUR, endHour:END_HOUR }),
      slotsWeek: (weekStart)=>postBackend_({ action:"slots_week", weekStart, slotMin:SLOT_MIN, startHour:START_HOUR, endHour:END_HOUR }),
      reserve: (fromIso,toIso,note)=>postBackend_({ action:"reserve_slot", from:fromIso, to:toIso, note }),
      my: (days=30)=>postBackend_({ action:"my_reservations", days }),
      cancel: (eventId)=>postBackend_({ action:"cancel_reservation", eventId }),
      // admin endpoints prepared (UI later)
      adminList: (range,date)=>postBackend_({ action:"admin_list", range, date }),
      adminCancel: (eventId)=>postBackend_({ action:"admin_cancel", eventId }),
    };

    // =========================
    // Firebase email link flow
    // =========================
    const actionCodeSettings = {
      url: window.location.origin + window.location.pathname,
      handleCodeInApp: true
    };

    async function sendLink(email) {
      hideMsg();
      els.sendBtn.disabled = true;
      try {
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        localStorage.setItem(LS_EMAIL_KEY, email);
        showMsg(t("msgSentOk"), "ok");
      } catch (e) {
        console.error(e);
        showMsg(t("msgBackendErr") + (e?.code || "error"), "err");
      } finally {
        els.sendBtn.disabled = false;
      }
    }

    async function completeSignInIfLink() {
      if (!isSignInWithEmailLink(auth, window.location.href)) return false;
      hideMsg();

      let email = localStorage.getItem(LS_EMAIL_KEY);
      if (!email) {
        showMsg(t("msgNeedEmail"), "err");
        return true;
      }
      try {
        await signInWithEmailLink(auth, email, window.location.href);
        localStorage.removeItem(LS_EMAIL_KEY);
        window.history.replaceState({}, document.title, window.location.pathname);
        showMsg(t("msgSignOk"), "ok");
        return true;
      } catch (e) {
        console.error(e);
        showMsg(t("msgSignFail"), "err");
        return true;
      }
    }

    // =========================
    // Drawer
    // =========================
    function openDrawer_() {
      els.drawerOverlay.classList.add("show");
      els.drawer.classList.add("open");
    }
    function closeDrawer_() {
      els.drawerOverlay.classList.remove("show");
      els.drawer.classList.remove("open");
    }

    // =========================
    // Calendar rendering
    // =========================
    function showView_(v) {
      els.monthView.style.display = (v==="month") ? "block" : "none";
      els.weekView.style.display  = (v==="week")  ? "block" : "none";
      els.dayView.style.display   = (v==="day")   ? "block" : "none";
    }

    async function renderMonth_(anchorYmd) {
      const d = new Date((anchorYmd || ymdLocal_()) + "T12:00:00");
      const year = d.getFullYear();
      const month = d.getMonth() + 1;

      const data = await api.summaryMonth(year, month);
      if (!data.ok) throw new Error(JSON.stringify(data));

      const first = new Date(year, month-1, 1, 12,0,0,0);
      const start = new Date(first);
      const day = start.getDay();
      const offset = (day === 0 ? 6 : day - 1);
      start.setDate(start.getDate() - offset);

      const cells = [];
      for (let i=0;i<42;i++) {
        const cd = new Date(start);
        cd.setDate(cd.getDate() + i);
        const y = cd.getFullYear(), m = cd.getMonth()+1, da = cd.getDate();
        const ymd = `${y}-${String(m).padStart(2,"0")}-${String(da).padStart(2,"0")}`;
        const inMonth = cd.getMonth() === (month-1);

        const s = data.summary[ymd];
        const free = s ? s.freeCount : 0;
        const total = s ? s.totalCount : 0;

        cells.push(`
          <button class="cellBtn ${inMonth?"":"dim"}" data-ymd="${ymd}">
            <div class="timeLabel">${da}</div>
            <div style="margin-top:6px; font-size:12px;">
              ${s ? `free: <b>${free}</b> / ${total}` : ""}
            </div>
          </button>
        `);
      }

      els.monthView.innerHTML = `<div class="monthGrid">${cells.join("")}</div>`;

      els.monthView.querySelectorAll("button[data-ymd]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const ymd = btn.getAttribute("data-ymd");
          els.picker.value = ymd;
          await renderDay_(ymd);
          showView_("day");
        });
      });
    }

    async function renderDay_(ymd) {
      const data = await api.slotsDay(ymd);
      if (!data.ok) throw new Error(JSON.stringify(data));

      state.lastDaySlots = data.slots;

      const items = data.slots.map(s=>{
        const label = `${fmtTime_(s.from)} – ${fmtTime_(s.to)}`;
        const cls = s.free ? "free" : "busy";
        const txt = s.free ? (LANG==="de" ? "frei" : "free") : (LANG==="de" ? "gebucht" : "booked");
        return `
          <button class="slotBtn ${cls}" data-from="${s.from}" data-to="${s.to}" ${s.free ? "" : "disabled"}>
            <div>${label}</div>
            <div class="timeLabel">${txt}</div>
          </button>
        `;
      }).join("");

      els.dayView.innerHTML = `
        <div class="muted" style="margin:8px 0;">${ymd}</div>
        <div class="scroll" style="display:flex; flex-direction:column; gap:8px;">${items}</div>
      `;

      els.dayView.querySelectorAll("button.slotBtn.free").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const fromIso = btn.getAttribute("data-from");
          openBookingModalFrom_(ymd, fromIso);
        });
      });
    }

    async function renderWeek_(anchorYmd) {
      const weekStart = mondayOf_(anchorYmd || ymdLocal_());
      const data = await api.slotsWeek(weekStart);
      if (!data.ok) throw new Error(JSON.stringify(data));

      // classic 7 columns + time labels, smaller cells
      const rows = [];
      for (let h = START_HOUR; h < END_HOUR; h++) {
        for (const mm of [0, 30]) rows.push({ h, mm });
      }

      const head = data.days.map(d => `
        <div style="text-align:center; color:#a9b6c7; font-size:12px;">${d.date}</div>
      `).join("");

      const body = rows.map(r=>{
        const label = `${String(r.h).padStart(2,"0")}:${String(r.mm).padStart(2,"0")}`;
        const cols = data.days.map(dayObj=>{
          const slot = dayObj.slots.find(s => fmtTime_(s.from) === label);
          const free = slot ? slot.free : false;
          const bg = free ? "#0b1220" : "rgba(255,90,122,0.08)";
          return `<button data-ymd="${dayObj.date}" style="
              width:100%; height:28px; border-radius:10px;
              border:1px solid #2a3b52; background:${bg};
              cursor:pointer; padding:0;"></button>`;
        }).join("");

        return `
          <div style="display:grid; grid-template-columns:70px repeat(7,1fr); gap:8px; align-items:center;">
            <div class="timeLabel">${label}</div>
            ${cols}
          </div>
        `;
      }).join("");

      els.weekView.innerHTML = `
        <div style="display:grid; grid-template-columns:70px repeat(7,1fr); gap:8px; margin:10px 0 8px;">
          <div></div>${head}
        </div>
        <div class="scroll" style="display:flex; flex-direction:column; gap:8px;">${body}</div>
      `;

      els.weekView.querySelectorAll("button[data-ymd]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const ymd = btn.getAttribute("data-ymd");
          els.picker.value = ymd;
          await renderDay_(ymd);
          showView_("day");
        });
      });
    }

    // =========================
    // Booking modal (Start -> dropdown Bis)
    // =========================
    function openModal_() {
      els.modalOverlay.style.display = "block";
      els.modal.style.display = "block";
    }
    function closeModal_() {
      els.modalOverlay.style.display = "none";
      els.modal.style.display = "none";
      hideModalMsg();
      els.note.value = "";
    }

    function openBookingModalFrom_(ymd, fromIso) {
      const slots = state.lastDaySlots || [];
      const idx = slots.findIndex(s => s.from === fromIso);
      if (idx < 0 || !slots[idx].free) return;

      // build "Bis" options: consecutive free slots
      const opts = [];
      for (let i = idx; i < slots.length; i++) {
        if (!slots[i].free) break;
        // option ends at slots[i].to
        opts.push({ toIso: slots[i].to, label: fmtTime_(slots[i].to) });
      }
      if (opts.length === 0) return;

      state.booking.ymd = ymd;
      state.booking.fromIso = fromIso;
      state.booking.fromLabel = fmtTime_(fromIso);
      state.booking.toOptions = opts;

      els.modalStartInfo.textContent = (LANG==="de")
        ? `Start: ${state.booking.fromLabel} – Wähle Ende (bis) und buche.`
        : `Start: ${state.booking.fromLabel} – Select end time and book.`;

      els.selectBis.innerHTML = opts.map((o, i)=>`<option value="${o.toIso}" ${i===0?"selected":""}>${o.label}</option>`).join("");

      openModal_();
    }

    async function confirmBooking_() {
      hideModalMsg();
      els.btnConfirm.disabled = true;
      try {
        const fromIso = state.booking.fromIso;
        const toIso = els.selectBis.value;
        const note = (els.note.value || "").trim();

        const res = await api.reserve(fromIso, toIso, note);

        if (!res.ok) {
          if (res.error === "daily_limit_2") return showModalMsg(t("msgDailyLimit"), "err");
          if (res.error === "parallel_limit_3") return showModalMsg(t("msgParallelLimit"), "err");
          return showModalMsg(t("msgBackendErr") + JSON.stringify(res), "err");
        }

        showModalMsg(t("msgBooked"), "ok");

        // close automatically after short moment
        setTimeout(()=>closeModal_(), 450);

        // refresh: day + month + my list + next appointment
        await renderDashboardSafe_();

      } catch (e) {
        console.error(e);
        showModalMsg(t("msgBackendErr") + String(e), "err");
      } finally {
        els.btnConfirm.disabled = false;
      }
    }

    // =========================
    // My reservations
    // =========================
    async function renderMyReservations_() {
      const data = await api.my(30);
      if (!data.ok) throw new Error(JSON.stringify(data));

      if (!data.items || data.items.length === 0) {
        els.myList.innerHTML = `<div class="muted">${LANG==="de" ? "Keine kommenden Reservierungen." : "No upcoming reservations."}</div>`;
        return;
      }

      els.myList.innerHTML = data.items.map(it=>{
        const meta = `${fmtDateTime_(it.start)} – ${fmtDateTime_(it.end)}`;
        const note = it.note ? `<div class="meta">${it.note}</div>` : "";
        return `
          <div class="listItem">
            <div>
              <div class="title">${it.title || "Fitness"}</div>
              <div class="meta">${meta}</div>
              ${note}
            </div>
            <div>
              <button class="ghost" data-cancel="${it.id}" type="button">${LANG==="de" ? "Storno" : "Cancel"}</button>
            </div>
          </div>
        `;
      }).join("");

      els.myList.querySelectorAll("button[data-cancel]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-cancel");
          btn.disabled = true;
          try {
            const r = await api.cancel(id);
            if (!r.ok) throw new Error(JSON.stringify(r));
            showMsg(t("msgCancelled"), "ok");
            await renderDashboardSafe_();
          } catch (e) {
            console.error(e);
            showMsg(t("msgBackendErr") + String(e), "err");
          } finally {
            btn.disabled = false;
          }
        });
      });
    }

    async function renderNextAppointment_() {
      // easiest: use my_reservations and take first
      const data = await api.my(30);
      if (!data.ok) throw new Error(JSON.stringify(data));

      if (!data.items || data.items.length === 0) {
        els.nextBox.textContent = (LANG==="de") ? "Kein Termin geplant." : "No appointment planned.";
        return;
      }
      const first = data.items[0];
      els.nextBox.innerHTML = `
        <div style="font-weight:900;">${first.title || "Fitness"}</div>
        <div class="muted">${fmtDateTime_(first.start)} – ${fmtDateTime_(first.end)}</div>
      `;
    }

    // =========================
    // Dashboard refresh (safe)
    // =========================
    async function renderDashboardSafe_() {
      hideMsg();

      // month/day depends on picker
      const ymd = els.picker.value || ymdLocal_(new Date());
      const d = new Date(ymd + "T12:00:00");
      const year = d.getFullYear();
      const month = d.getMonth() + 1;

      // refresh core
      await Promise.allSettled([
        renderMonth_(ymd),
        renderDay_(ymd),
        renderMyReservations_(),
        renderNextAppointment_()
      ]);

      // keep current view selection (default month)
      showView_("month");
    }

    // =========================
    // Push (prepared)
    // =========================
    async function enablePush_() {
      // We implement the real OneSignal step next.
      // For now show instructions.
      if (!ONESIGNAL_APP_ID) {
        showMsg((LANG==="de")
          ? "OneSignal App ID fehlt. Trage ONESIGNAL_APP_ID im index.html ein."
          : "Missing OneSignal App ID. Put it into ONESIGNAL_APP_ID in index.html."
        , "err");
        return;
      }
      showMsg((LANG==="de")
        ? "OneSignal ist vorbereitet. Nächster Schritt: SDK + Service Worker."
        : "OneSignal prepared. Next step: SDK + Service Worker."
      , "ok");
    }

    // =========================
    // Bindings
    // =========================
    els.langDe.addEventListener("click", ()=>setLang("de"));
    els.langEn.addEventListener("click", ()=>setLang("en"));

    els.sendBtn.addEventListener("click", async ()=>{
      const email = (els.email.value || "").trim();
      if (!email.includes("@")) return showMsg(t("msgInvalidEmail"), "err");
      await sendLink(email);
    });

    els.changeBtn.addEventListener("click", ()=>{
      localStorage.removeItem(LS_EMAIL_KEY);
      els.email.value = "";
      showMsg((LANG==="de") ? "OK. Bitte neue E-Mail eingeben und Link senden." : "OK. Enter a new email and send a link.", "ok");
    });

    els.btnMenu.addEventListener("click", ()=>openDrawer_());
    els.drawerOverlay.addEventListener("click", ()=>closeDrawer_());

    els.mLogout.addEventListener("click", async ()=>{
      closeDrawer_();
      await signOut(auth);
      cachedIdToken = null; cachedIdTokenExp = 0;
      location.reload();
    });

    els.mRefresh.addEventListener("click", async ()=>{
      closeDrawer_();
      if (!state.me?.allowed) return;
      await renderDashboardSafe_();
    });

    els.mPushEnable.addEventListener("click", async ()=>{
      closeDrawer_();
      await enablePush_();
    });

    els.btnOpenCalendar.addEventListener("click", async ()=>{
      els.calendarBox.style.display = (els.calendarBox.style.display === "none") ? "block" : "none";
      if (els.calendarBox.style.display !== "none") {
        const today = ymdLocal_(new Date());
        els.picker.value = els.picker.value || today;
        await renderMonth_(els.picker.value);
        showView_("month");
      }
    });

    els.btnRefreshAll.addEventListener("click", async ()=>renderDashboardSafe_());
    els.btnRefreshMy.addEventListener("click", async ()=>renderMyReservations_());

    els.tabMonth.addEventListener("click", async ()=>{
      await renderMonth_(els.picker.value || ymdLocal_(new Date()));
      showView_("month");
    });
    els.tabWeek.addEventListener("click", async ()=>{
      await renderWeek_(els.picker.value || ymdLocal_(new Date()));
      showView_("week");
    });
    els.tabDay.addEventListener("click", async ()=>{
      await renderDay_(els.picker.value || ymdLocal_(new Date()));
      showView_("day");
    });

    els.picker.addEventListener("change", async ()=>{
      await renderDay_(els.picker.value);
      showView_("day");
    });

    els.btnOpenReserve.addEventListener("click", async ()=>{
      // reservation starts from day view: open calendar if hidden, switch to day, user clicks free slot
      els.calendarBox.style.display = "block";
      const today = ymdLocal_(new Date());
      els.picker.value = els.picker.value || today;
      await renderDay_(els.picker.value);
      showView_("day");
      // little hint
      showMsg(LANG==="de" ? "Wähle einen freien Slot im Tagesplan." : "Pick a free slot in day view.", "ok");
    });

    els.btnShowMy.addEventListener("click", ()=>{
      // scroll to my list
      document.querySelector("#myList")?.scrollIntoView({ behavior:"smooth", block:"start" });
    });

    els.btnCancelModal.addEventListener("click", ()=>closeModal_());
    els.modalOverlay.addEventListener("click", ()=>closeModal_());
    els.btnConfirm.addEventListener("click", ()=>confirmBooking_());

    // =========================
    // Boot
    // =========================
    applyI18n();
    await completeSignInIfLink();

    onAuthStateChanged(auth, async (user)=>{
      hideMsg();
      cachedIdToken = null; cachedIdTokenExp = 0;

      if (!user) {
        els.subtitle.textContent = t("sub_logged_out");
        els.loginBox.style.display = "block";
        els.appBox.style.display = "none";
        els.pillAllowed.textContent = (LANG==="de") ? "Status: abgemeldet" : "Status: signed out";
        els.pillTz.textContent = t("tz");
        return;
      }

      els.subtitle.textContent = t("sub_logged_in");

      // gate
      try {
        const me = await api.me();
        state.me = me;

        // drawer info
        els.mInfoEmail.textContent = user.email || "";
        els.mInfoRole.textContent = "role: " + (me.role || "none");

        els.pillTz.textContent = t("tz");
        els.pillAllowed.textContent = me.allowed ? t("allowed") : t("denied");

        if (!me.allowed) {
          els.loginBox.style.display = "none";
          els.appBox.style.display = "none";
          showMsg(LANG==="de" ? "Du bist nicht freigeschaltet. Bitte Admin kontaktieren." : "You are not enabled yet. Contact admin.", "err");
          return;
        }

        els.loginBox.style.display = "none";
        els.appBox.style.display = "block";

        // initial date
        const today = ymdLocal_(new Date());
        els.picker.value = today;

        // load dashboard
        await renderDashboardSafe_();

      } catch (e) {
        console.error(e);
        showMsg(t("msgBackendErr") + String(e), "err");
      }
    });
  </script>
</body>
</html>
