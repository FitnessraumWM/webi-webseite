<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fitnessraum Reservations</title>

  <!-- OneSignal Web SDK (v16) -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <!-- Firebase (compat for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <style>
    :root{
      --bg:#0b1220; --card:#111a2b; --muted:#94a3b8; --text:#e5e7eb;
      --accent:#22c55e; --danger:#ef4444; --warn:#f59e0b; --line:#1f2a44;
      --free:#1a2f25; --busy:#2a1a1a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
    a{color:#93c5fd;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
    .brand{display:flex;align-items:center;gap:10px}
    .badge{font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
    .btn{border:1px solid var(--line);background:#0f172a;color:var(--text);padding:10px 12px;border-radius:12px;cursor:pointer}
    .btn:hover{border-color:#334155}
    .btn.accent{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.35)}
    .btn.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35)}
    .btn.small{padding:6px 10px;border-radius:10px;font-size:12px}
    .grid{display:grid;grid-template-columns: 1.2fr .8fr;gap:14px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
    .card h3{margin:0 0 10px 0;font-size:16px}
    .muted{color:var(--muted);font-size:13px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .hr{height:1px;background:var(--line);margin:12px 0}

    /* hamburger menu */
    .menuWrap{position:relative}
    .menuBtn{display:flex;align-items:center;gap:8px}
    .menu{position:absolute;right:0;top:44px;min-width:320px;z-index:50;background:var(--card);border:1px solid var(--line);
      border-radius:16px;padding:12px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .menu.open{display:block}
    .menu .item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 6px;border-radius:12px}
    .menu .item:hover{background:rgba(255,255,255,.03)}
    .toggle{display:flex;align-items:center;gap:10px}
    .switch{width:44px;height:24px;border-radius:999px;border:1px solid var(--line);background:#0f172a;position:relative;cursor:pointer}
    .knob{width:18px;height:18px;border-radius:999px;background:#64748b;position:absolute;top:2px;left:2px;transition:all .15s}
    .switch.on{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35)}
    .switch.on .knob{left:22px;background:var(--accent)}
    .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;color:#cbd5e1}

    /* calendar */
    .views{display:flex;gap:8px;flex-wrap:wrap}
    .pill{border:1px solid var(--line);background:#0f172a;color:var(--text);padding:8px 10px;border-radius:999px;cursor:pointer;font-size:13px}
    .pill.active{border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.12)}
    .monthGrid{display:grid;grid-template-columns: repeat(7, 1fr);gap:6px}
    .dayBox{border:1px solid var(--line);border-radius:14px;padding:10px;min-height:70px;background:#0f172a;cursor:pointer}
    .dayBox:hover{border-color:#334155}
    .dayNum{font-size:13px;color:#cbd5e1}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--accent)}
    .dot.busy{background:var(--warn)}
    .weekGrid{display:grid;grid-template-columns: repeat(7, 1fr);gap:8px}
    .weekCol{border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .weekHead{padding:8px 10px;background:#0f172a;border-bottom:1px solid var(--line);font-size:12px;color:#cbd5e1}
    .slot{padding:7px 10px;border-bottom:1px solid rgba(31,42,68,.6);font-size:12px;display:flex;justify-content:space-between;gap:8px}
    .slot.free{background:rgba(34,197,94,.08);cursor:pointer}
    .slot.busy{background:rgba(239,68,68,.08);opacity:.9}
    .slot:last-child{border-bottom:none}
    .slot .t{color:#e2e8f0}
    .slot .s{color:var(--muted)}

    /* modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:99;padding:14px}
    .overlay.open{display:flex}
    .modal{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
    .modal h3{margin:0 0 10px 0}
    select,input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#0f172a;color:var(--text)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:520px){.two{grid-template-columns:1fr}}
    .hidden{display:none !important}
    .list{display:flex;flex-direction:column;gap:10px}
    .resItem{border:1px solid var(--line);border-radius:14px;padding:10px;background:#0f172a}
    .resTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  </style>
</head>

<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div style="font-weight:700">Fitnessraum</div>
      <span class="badge" id="statusBadge">offline</span>
    </div>

    <div class="row">
      <div class="menuWrap">
        <button class="btn menuBtn" id="hambBtn">☰ Menu</button>
        <div class="menu" id="hambMenu">
          <div class="item"><div class="muted">Status</div><div class="kbd" id="mStatus">—</div></div>
          <div class="item"><div class="muted">Email</div><div class="kbd" id="mEmail">—</div></div>
          <div class="item"><div class="muted">Role</div><div class="kbd" id="mRole">—</div></div>
          <div class="item"><div class="muted">Backend</div><div class="kbd" id="mBackend">—</div></div>
          <div class="item">
            <div class="muted">Push</div>
            <div class="toggle">
              <div class="switch" id="pushSwitch"><div class="knob"></div></div>
              <div class="kbd" id="pushLabel">off</div>
            </div>
          </div>
          <div class="hr"></div>
          <button class="btn danger" id="logoutBtn" style="width:100%">Odhlásiť</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <h3>Prihlásenie</h3>
    <div class="two">
      <div>
        <label class="muted">Email</label>
        <input id="email" type="email" placeholder="email" />
      </div>
      <div>
        <label class="muted">Heslo</label>
        <input id="pass" type="password" placeholder="heslo" />
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn accent" id="loginBtn">Prihlásiť</button>
      <span class="muted" id="loginMsg"></span>
    </div>
  </div>

  <!-- APP -->
  <div class="grid hidden" id="appGrid">

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h3 style="margin:0">Kalendár</h3>
        <div class="row">
          <button class="btn small" id="prevBtn">◀</button>
          <button class="btn small" id="todayBtn">Dnes</button>
          <button class="btn small" id="nextBtn">▶</button>
        </div>
      </div>

      <div class="row" style="margin-top:10px;justify-content:space-between">
        <div class="views">
          <button class="pill active" data-view="month" id="viewMonth">Mesiac</button>
          <button class="pill" data-view="week" id="viewWeek">Týždeň</button>
          <button class="pill" data-view="day" id="viewDay">Deň</button>
        </div>
        <div class="kbd" id="anchorLabel">—</div>
      </div>

      <div class="hr"></div>

      <div id="calendarArea"></div>
    </div>

    <div class="card">
      <h3>Moje rezervácie</h3>
      <div class="muted" id="myResHint">—</div>
      <div class="hr"></div>
      <div class="list" id="myResList"></div>
    </div>

  </div>
</div>

<!-- BOOK MODAL -->
<div class="overlay" id="bookOverlay">
  <div class="modal">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">Rezervácia</h3>
      <button class="btn small" id="closeModal">✕</button>
    </div>

    <div class="hr"></div>

    <div class="two">
      <div>
        <label class="muted">Start</label>
        <input id="bookStart" disabled />
      </div>
      <div>
        <label class="muted">Bis</label>
        <select id="bookEnd"></select>
      </div>
    </div>

    <div style="margin-top:10px">
      <label class="muted">Poznámka (voliteľné)</label>
      <input id="bookNote" placeholder="napr. tréning / meno / ..." />
    </div>

    <div class="row" style="margin-top:12px;justify-content:space-between">
      <span class="muted" id="bookMsg"></span>
      <button class="btn accent" id="bookBtn">Buchen</button>
    </div>
  </div>
</div>

<script>
/** ========= CONFIG ========= **/

// 1) Apps Script WebApp URL (deploy -> web app)
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyqMOFEywa32j-ALJ9OzWpfZI2vftY9hw9Do4Oc9DZGNuApSr55V2ywUxozqn5lfvRX/exec";

// 2) Firebase config (Web app)
const firebaseConfig = {
  apiKey: "PASTE_FIREBASE_WEB_APIKEY",
  authDomain: "PASTE.firebaseapp.com",
  projectId: "PASTE",
};

/** ========= INIT ========= **/
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const $ = (id)=>document.getElementById(id);

let state = {
  user: null,
  idToken: null,
  idTokenExp: 0,
  view: "month",
  anchor: new Date(),
  lastAvail: null, // last day availability for building "Bis" options
  modal: { startISO: null, endChoices: [] },
  pushEnabled: false,
  inFlight: new Map(), // dedupe requests
};

function fmtTime(d){
  const x = new Date(d);
  return x.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}
function fmtDate(d){
  const x = new Date(d);
  return x.toLocaleDateString([], {weekday:"short", year:"numeric", month:"2-digit", day:"2-digit"});
}
function ymd(d){
  const x = new Date(d);
  const y = x.getFullYear();
  const m = String(x.getMonth()+1).padStart(2,"0");
  const dd = String(x.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}
function ym(d){
  const x = new Date(d);
  const y = x.getFullYear();
  const m = String(x.getMonth()+1).padStart(2,"0");
  return `${y}-${m}`;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d,n){ const x=new Date(d); x.setMonth(x.getMonth()+n); return x; }

function setStatus(ok, text){
  $("statusBadge").textContent = text || (ok ? "online" : "offline");
  $("mStatus").textContent = $("statusBadge").textContent;
}
function setMenuUser(){
  $("mEmail").textContent = state.user?.email || "—";
  $("mRole").textContent = state.user?.isAdmin ? "admin" : "user";
}

/** ========= TOKEN CACHE ========= **/
async function getIdTokenCached(force=false){
  const now = Date.now();
  if (!force && state.idToken && now < state.idTokenExp - 15_000) {
    return state.idToken;
  }
  const u = auth.currentUser;
  if (!u) throw new Error("not_logged_in");
  const t = await u.getIdToken(force);
  state.idToken = t;

  // decode JWT exp (seconds)
  const payload = JSON.parse(atob(t.split(".")[1]));
  state.idTokenExp = (payload.exp || 0) * 1000;
  return t;
}

/** ========= REQUEST (with dedupe) ========= **/
async function api(action, body={}){
  const token = await getIdTokenCached(false);
  const key = action + ":" + JSON.stringify(body);

  if (state.inFlight.has(key)) return state.inFlight.get(key);

  const p = (async ()=>{
    const t0 = performance.now();
    const res = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ action, idToken: token, ...body })
    });
    const data = await res.json().catch(()=>({ok:false,error:"bad_json"}));
    const ms = Math.round(performance.now() - t0);
    $("mBackend").textContent = ms + " ms";
    if (!data.ok) throw new Error(data.error || "backend_error");
    return data;
  })();

  state.inFlight.set(key, p);
  try { return await p; }
  finally { state.inFlight.delete(key); }
}

/** ========= OneSignal (optional UI) ========= **/
function initOneSignal(){
  // We only init when user is logged and toggle is ON.
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "61b4fca3-7bbd-4556-973d-0a589623e89b"
    });

    // attach external_user_id = Firebase localId
    if (state.user?.uid) {
      try { await OneSignal.login(state.user.uid); } catch(e){}
    }
  });
}

function setPushUI(on){
  state.pushEnabled = !!on;
  const sw = $("pushSwitch");
  if (on) sw.classList.add("on"); else sw.classList.remove("on");
  $("pushLabel").textContent = on ? "on" : "off";
  localStorage.setItem("pushEnabled", on ? "1" : "0");
}

async function enablePush(){
  setPushUI(true);
  initOneSignal();
  // ask permission after init
  try{
    window.OneSignalDeferred.push(async function(OneSignal){
      await OneSignal.Notifications.requestPermission();
    });
  }catch(e){}
}
function disablePush(){
  setPushUI(false);
  // OneSignal "logout" optional; we keep it simple
}

/** ========= UI Wiring ========= **/
$("hambBtn").onclick = ()=>{
  $("hambMenu").classList.toggle("open");
};
document.addEventListener("click",(e)=>{
  const menu = $("hambMenu");
  const wrap = document.querySelector(".menuWrap");
  if (!wrap.contains(e.target)) menu.classList.remove("open");
});

$("pushSwitch").onclick = async ()=>{
  if (!state.user) return;
  if (state.pushEnabled) disablePush();
  else await enablePush();
};

$("logoutBtn").onclick = async ()=>{
  await auth.signOut();
};

$("loginBtn").onclick = async ()=>{
  $("loginMsg").textContent = "";
  try{
    const email = $("email").value.trim();
    const pass = $("pass").value;
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    $("loginMsg").textContent = "Login failed";
  }
};

$("viewMonth").onclick = ()=>setView("month");
$("viewWeek").onclick = ()=>setView("week");
$("viewDay").onclick = ()=>setView("day");

$("prevBtn").onclick = ()=>{
  if (state.view==="month") state.anchor = addMonths(state.anchor, -1);
  else if (state.view==="week") state.anchor = addDays(state.anchor, -7);
  else state.anchor = addDays(state.anchor, -1);
  refreshAll();
};
$("nextBtn").onclick = ()=>{
  if (state.view==="month") state.anchor = addMonths(state.anchor, 1);
  else if (state.view==="week") state.anchor = addDays(state.anchor, 7);
  else state.anchor = addDays(state.anchor, 1);
  refreshAll();
};
$("todayBtn").onclick = ()=>{
  state.anchor = new Date();
  refreshAll();
};

function setView(v){
  state.view = v;
  for (const b of document.querySelectorAll(".pill")) b.classList.remove("active");
  if (v==="month") $("viewMonth").classList.add("active");
  if (v==="week") $("viewWeek").classList.add("active");
  if (v==="day") $("viewDay").classList.add("active");
  refreshAll();
}

/** ========= Modal ========= **/
$("closeModal").onclick = closeModal;
$("bookOverlay").addEventListener("click",(e)=>{
  if (e.target.id==="bookOverlay") closeModal();
});

function openModal(startISO, endChoices){
  state.modal.startISO = startISO;
  state.modal.endChoices = endChoices;

  $("bookStart").value = `${fmtDate(startISO)} ${fmtTime(startISO)}`;
  $("bookEnd").innerHTML = endChoices.map(iso=>{
    const d = new Date(iso);
    return `<option value="${iso}">${fmtTime(d)}</option>`;
  }).join("");

  $("bookNote").value = "";
  $("bookMsg").textContent = "";
  $("bookOverlay").classList.add("open");
}

function closeModal(){
  $("bookOverlay").classList.remove("open");
  state.modal.startISO = null;
  state.modal.endChoices = [];
}

$("bookBtn").onclick = async ()=>{
  try{
    $("bookMsg").textContent = "Booking...";
    const startISO = state.modal.startISO;
    const endISO = $("bookEnd").value;

    await api("reserve_slot", {
      start: startISO,
      end: endISO,
      note: $("bookNote").value.trim(),
      title: "Fitnessraum"
    });

    $("bookMsg").textContent = "OK";
    closeModal();

    // refresh day + month + my reservations
    await refreshCalendar();
    await refreshMyReservations();
  }catch(e){
    const msg = String(e.message || e);
    $("bookMsg").textContent =
      msg.includes("limit_2_per_day") ? "Limit: max 2 rezervácie na deň." :
      msg.includes("slot_busy") ? "Slot je obsadený." :
      msg.includes("outside_hours") ? "Mimo povoleného času (05:00–23:00)." :
      "Chyba: " + msg;
  }
};

/** ========= Render Calendar ========= **/
async function refreshCalendar(){
  $("anchorLabel").textContent =
    state.view==="month" ? ym(state.anchor) :
    state.view==="week" ? ("Týždeň: " + ymd(state.anchor)) :
    ymd(state.anchor);

  if (state.view==="month") await renderMonth();
  if (state.view==="week") await renderWeek();
  if (state.view==="day") await renderDay();
}

async function renderMonth(){
  const anchor = new Date(state.anchor);
  const monthStart = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const startDow = (monthStart.getDay()+6)%7; // Mon=0
  const gridStart = addDays(monthStart, -startDow);

  const m = ym(anchor);
  const data = await api("availability_month", { date: m });
  const busy = data.busyCountByDay || {};

  const boxes = [];
  for (let i=0;i<42;i++){
    const d = addDays(gridStart, i);
    const ds = ymd(d);
    const inMonth = d.getMonth() === anchor.getMonth();
    const count = busy[ds] || 0;
    boxes.push(`
      <div class="dayBox" data-day="${ds}" style="opacity:${inMonth?1:.5}">
        <div class="dayNum">${ds}</div>
        <div style="margin-top:8px" class="muted">
          ${count ? `<span class="dot busy"></span>${count} event` : `<span class="dot"></span>free`}
        </div>
      </div>
    `);
  }

  $("calendarArea").innerHTML = `<div class="monthGrid">${boxes.join("")}</div>`;

  document.querySelectorAll(".dayBox").forEach(el=>{
    el.onclick = ()=>{
      const ds = el.getAttribute("data-day");
      state.anchor = new Date(ds+"T00:00:00");
      setView("day");
    };
  });
}

async function renderDay(){
  const ds = ymd(state.anchor);
  const data = await api("availability_day", { date: ds });
  state.lastAvail = data;

  const slots = data.slots || [];
  const html = slots.map((s, idx)=>{
    const st = new Date(s.start);
    const en = new Date(s.end);
    return `
      <div class="slot ${s.status}" data-idx="${idx}">
        <div class="t">${fmtTime(st)} - ${fmtTime(en)}</div>
        <div class="s">${s.status}</div>
      </div>
    `;
  }).join("");

  $("calendarArea").innerHTML = html || `<div class="muted">No slots</div>`;

  // click free slot -> open modal with "Bis" choices (continuous free slots forward)
  document.querySelectorAll(".slot.free").forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.getAttribute("data-idx"),10);
      const choices = [];
      for (let j=idx+1;j<=slots.length;j++){
        if (j===slots.length){
          // allow end at last slot end
          const lastEnd = slots[slots.length-1].end;
          choices.push(lastEnd);
          break;
        }
        if (slots[j].status!=="free") break;
        choices.push(slots[j].end);
      }
      openModal(slots[idx].start, choices);
    };
  });
}

async function renderWeek(){
  const ds = ymd(state.anchor);
  const data = await api("availability_week", { date: ds });
  const days = data.days || [];

  // show week columns with fewer rows: only 05-23 by 15min, but still ok
  const cols = days.map((dObj)=>{
    const date = dObj.date || "";
    const slots = (dObj.slots || []);
    const rows = slots.map((s, idx)=>{
      const st = new Date(s.start);
      const en = new Date(s.end);
      return `
        <div class="slot ${s.status}" data-day="${date}" data-idx="${idx}">
          <div class="t">${fmtTime(st)}</div>
          <div class="s">${s.status}</div>
        </div>
      `;
    }).join("");
    return `
      <div class="weekCol">
        <div class="weekHead">${date}</div>
        <div>${rows}</div>
      </div>
    `;
  }).join("");

  $("calendarArea").innerHTML = `<div class="weekGrid">${cols}</div>`;

  // click free -> open modal on that day (need day availability to build end choices)
  document.querySelectorAll(".weekCol .slot.free").forEach(el=>{
    el.onclick = async ()=>{
      const day = el.getAttribute("data-day");
      const idx = parseInt(el.getAttribute("data-idx"),10);
      const d = await api("availability_day", { date: day });
      const slots = d.slots || [];

      const choices = [];
      for (let j=idx+1;j<=slots.length;j++){
        if (j===slots.length){
          const lastEnd = slots[slots.length-1].end;
          choices.push(lastEnd);
          break;
        }
        if (slots[j].status!=="free") break;
        choices.push(slots[j].end);
      }
      openModal(slots[idx].start, choices);
    };
  });
}

/** ========= My Reservations ========= **/
async function refreshMyReservations(){
  const data = await api("my_reservations", { includePast:false });
  const list = data.reservations || [];
  $("myResHint").textContent = list.length ? `Budúce: ${list.length}` : "Žiadne budúce rezervácie.";

  $("myResList").innerHTML = list.map(r=>{
    return `
      <div class="resItem">
        <div class="resTop">
          <div>
            <div style="font-weight:600">${fmtDate(r.start)} ${fmtTime(r.start)} – ${fmtTime(r.end)}</div>
            <div class="muted">${r.title}${r.ownerEmail ? " · " + r.ownerEmail : ""}</div>
          </div>
          <button class="btn small danger" data-id="${r.id}">Storno</button>
        </div>
      </div>
    `;
  }).join("");

  $("myResList").querySelectorAll("button[data-id]").forEach(btn=>{
    btn.onclick = async ()=>{
      try{
        btn.disabled = true;
        await api("cancel_reservation", { eventId: btn.getAttribute("data-id") });
        await refreshCalendar();
        await refreshMyReservations();
      }catch(e){
        alert("Storno zlyhalo: " + (e.message || e));
      }finally{
        btn.disabled = false;
      }
    };
  });
}

/** ========= Auth State ========= **/
auth.onAuthStateChanged(async (u)=>{
  if (!u){
    state.user = null;
    state.idToken = null;
    setStatus(false,"offline");
    $("loginCard").classList.remove("hidden");
    $("appGrid").classList.add("hidden");
    return;
  }

  try{
    setStatus(true,"online");
    $("loginCard").classList.add("hidden");
    $("appGrid").classList.remove("hidden");

    // load push toggle preference
    setPushUI(localStorage.getItem("pushEnabled")==="1");

    // ping to get role + uid
    const data = await api("ping", {});
    state.user = data.user;
    setMenuUser();

    // attach OneSignal external id when toggle is ON
    if (state.pushEnabled) await enablePush();

    // initial render
    await refreshAll();
  }catch(e){
    console.error(e);
    setStatus(false,"error");
  }
});

async function refreshAll(){
  try{
    await refreshCalendar();
    await refreshMyReservations();
  }catch(e){
    console.error(e);
  }
}

/** ========= Startup defaults ========= **/
setStatus(false,"offline");
</script>
