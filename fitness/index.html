<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Webi Fitness</title>

  <style>
    :root{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      --bg: #0b0f14;
      --card: #121a24;
      --card2:#0e1520;
      --border:#223042;
      --border2:#2a3b52;
      --text:#e9eef7;
      --muted:#a9b6c7;
      --primary:#4a83ff;
      --danger:#ff5a7a;
      --ok:#35d07f;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    /* light theme overrides */
    [data-theme="light"]{
      --bg:#f5f7fb;
      --card:#ffffff;
      --card2:#f1f4fb;
      --border:#d7deea;
      --border2:#c8d2e3;
      --text:#0d1420;
      --muted:#4a5a72;
      --shadow: 0 10px 30px rgba(0,0,0,.10);
    }

    body{ margin:0; background:var(--bg); color:var(--text); }
    .wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:18px; }
    .card{
      width:100%; max-width:1100px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow);
      position:relative;
    }

    .topbar{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      margin-bottom:10px;
    }
    h1{ font-size:20px; margin:0; }
    .sub{ color:var(--muted); font-size:13px; margin:0 0 10px; line-height:1.4; }

    .right{ margin-left:auto; display:flex; gap:8px; align-items:center; }
    .pill{
      display:inline-flex; gap:6px; align-items:center;
      padding:4px 10px; border-radius:999px;
      background:var(--card2); border:1px solid var(--border2);
      color:var(--muted); font-size:12px;
    }
    .btn{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border2);
      background:var(--card2);
      color:var(--text);
      font-weight:700;
      cursor:pointer;
    }
    .btn.primary{ background:var(--primary); border-color:transparent; color:#08111f; }
    .btn.ghost{ background:transparent; }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .seg{ display:flex; gap:6px; }
    .seg button{
      padding:6px 10px; border-radius:999px; border:1px solid var(--border2);
      background:transparent; color:var(--muted); font-weight:700; cursor:pointer;
    }
    .seg button.active{ background:var(--card2); color:var(--text); border-color:rgba(74,131,255,.45); }

    .grid2{ display:grid; grid-template-columns: 420px 1fr; gap:14px; align-items:start; }
    @media (max-width: 980px){ .grid2{ grid-template-columns: 1fr; } }

    .box{
      border:1px solid var(--border2);
      background:var(--card2);
      border-radius:14px;
      padding:12px;
    }

    .muted{ color:var(--muted); font-size:12px; }
    .msg{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
      border:1px solid var(--border2);
      background:var(--card2);
      color:var(--text);
      white-space:pre-wrap;
    }
    .msg.err{ border-color: rgba(255,90,122,.35); color: color-mix(in oklab, var(--danger) 45%, var(--text)); }
    .msg.ok{ border-color: rgba(53,208,127,.35); color: color-mix(in oklab, var(--ok) 55%, var(--text)); }

    /* views */
    .view{ display:none; }
    .view.active{ display:block; }

    /* calendar */
    .calTop{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    input[type="date"], select, textarea, input[type="text"]{
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid var(--border2);
      background:var(--card2);
      color:var(--text);
      outline:none;
    }
    textarea{ min-height:90px; resize:vertical; }
    input:focus, select:focus, textarea:focus{
      border-color: rgba(74,131,255,.55);
      box-shadow:0 0 0 4px rgba(74,131,255,.16);
    }

    .monthGrid{
      display:grid; grid-template-columns:repeat(7, 1fr);
      gap:8px;
    }
    .cellBtn{
      text-align:left; padding:10px;
      border-radius:12px;
      border:1px solid var(--border2);
      background:var(--card2);
      color:var(--text);
      cursor:pointer;
      min-height:66px;
    }
    .cellBtn.dim{ background:transparent; opacity:.55; }
    .timeLabel{ color:var(--muted); font-size:12px; }
    .scroll{ max-height:520px; overflow:auto; padding-right:6px; }

    .slotBtn{
      width:100%; text-align:left;
      padding:10px 12px; border-radius:12px;
      border:1px solid var(--border2);
      background:var(--card2);
      color:var(--text);
      cursor:pointer;
      display:flex; justify-content:space-between; gap:12px;
      align-items:center;
    }
    .slotBtn.busy{ cursor:not-allowed; opacity:.7; border-color: rgba(255,90,122,.25); background: color-mix(in oklab, var(--danger) 8%, var(--card2)); }
    .slotBtn .tag{ font-weight:700; font-size:12px; color:var(--muted); }
    .slotBtn.free .tag{ color: color-mix(in oklab, var(--ok) 60%, var(--text)); }

    /* drawer */
    .overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.45);
      display:none;
      z-index:50;
    }
    .overlay.on{ display:block; }
    .drawer{
      position:fixed; top:0; right:0; height:100%; width:min(360px, 92vw);
      background:var(--card);
      border-left:1px solid var(--border);
      box-shadow:var(--shadow);
      transform: translateX(110%);
      transition: transform .18s ease;
      z-index:60;
      padding:14px;
      display:flex; flex-direction:column; gap:10px;
    }
    .drawer.on{ transform: translateX(0); }
    .drawer h2{ margin:0; font-size:16px; }
    .drawer .menuBtn{ width:100%; text-align:left; }
    .hr{ height:1px; background:var(--border); border:0; margin:6px 0; }

    /* modal */
    .modalWrap{
      position:fixed; inset:0;
      display:none;
      align-items:center; justify-content:center;
      z-index:80;
    }
    .modalWrap.on{ display:flex; }
    .modal{
      width:min(520px, 94vw);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px;
      box-shadow:var(--shadow);
    }
    .modal h3{ margin:0 0 8px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .row > *{ flex:1; }

    /* dashboard cards */
    .bigLine{ font-size:16px; font-weight:800; }
    .smallLine{ font-size:12px; color:var(--muted); margin-top:2px; }

    /* reservations list */
    .resItem{
      padding:10px; border-radius:14px;
      border:1px solid var(--border2);
      background:var(--card2);
      display:flex; justify-content:space-between; align-items:center; gap:10px;
    }
    .resItem .left{ min-width:0; }
    .resItem .title{ font-weight:800; }
    .resItem .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  </style>
</head>

    // =========================
    // 7) Backend calls (token cache)
    // =========================
    const tokenCache = { token:null, expMs:0 };

    async function getIdTokenCached_(){
      const user = auth.currentUser;
      if (!user) throw new Error("not_authenticated");

      const now = Date.now();
      if (tokenCache.token && tokenCache.expMs > now + 30_000) {
        return tokenCache.token;
      }

      // do NOT force refresh each time (true) -> too slow
      const tok = await user.getIdToken(false);

      // naive expiry ~ 55min
      tokenCache.token = tok;
      tokenCache.expMs = now + 55 * 60 * 1000;
      return tok;
    }

    async function postBackend_(payload){
      const t0 = performance.now();
      const idToken = await getIdTokenCached_();

      const r = await fetch(BACKEND_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ ...payload, idToken })
      });

      const txt = await r.text();
      let data = null;
      try { data = JSON.parse(txt); } catch(e){ data = { ok:false, error:"bad_json", detail:txt }; }

      const ms = Math.round(performance.now()-t0);
      els.pillBackend.style.display="inline-flex";
      els.pillBackend.textContent = `${t("app.backend")}: ${ms} ms`;

      return data;
    }

    const api = {
      me: ()=>postBackend_({ action:"me" }),
      day: (date, slotMin, startHour, endHour)=>postBackend_({ action:"slots_day", date, slotMin, startHour, endHour }),
      week: (weekStart, slotMin, startHour, endHour)=>postBackend_({ action:"slots_week", weekStart, slotMin, startHour, endHour }),
      month: (year, month, slotMin, startHour, endHour)=>postBackend_({ action:"summary_month", year, month, slotMin, startHour, endHour }),
      reserve: (from,to,note)=>postBackend_({ action:"reserve_slot", from, to, note }),
      my: (daysAhead=45)=>postBackend_({ action:"my_reservations", daysAhead }),
      cancel: (eventId)=>postBackend_({ action:"cancel_reservation", eventId }),
    };

    // =========================
    // 9) Date helpers
    // =========================
    function ymdLocal_(d=new Date()){
      const y=d.getFullYear();
      const m=String(d.getMonth()+1).padStart(2,"0");
      const da=String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }
    function mondayOf_(anchorYmd){
      const base = anchorYmd ? new Date(anchorYmd+"T12:00:00") : new Date();
      const day = base.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      const monday = new Date(base);
      monday.setDate(monday.getDate()+diff);
      return ymdLocal_(monday);
    }
    function fmtTime_(iso){
      const dt = new Date(iso);
      return new Intl.DateTimeFormat(LANG==="de"?"de-CH":"en-GB", { timeZone:TZ, hour:"2-digit", minute:"2-digit" }).format(dt);
    }
    function fmtDateTime_(iso){
      const dt = new Date(iso);
      return new Intl.DateTimeFormat(LANG==="de"?"de-CH":"en-GB", {
        timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"
      }).format(dt);
    }

    async function renderMonth_(anchorYmd){
      const d = anchorYmd ? new Date(anchorYmd+"T12:00:00") : new Date();
      const year = d.getFullYear();
      const month = d.getMonth()+1;

      const data = await api.month(year, month, state.slotMin, state.startHour, state.endHour);
      if (!data.ok) throw new Error(JSON.stringify(data));
      state.monthSummary = data.summary;

      const first = new Date(year, month-1, 1, 12, 0, 0, 0);
      const start = new Date(first);
      const dow = start.getDay();
      const offset = (dow === 0 ? 6 : dow - 1);
      start.setDate(start.getDate() - offset);

      const cells = [];
      for (let i=0;i<42;i++){
        const cd = new Date(start);
        cd.setDate(cd.getDate()+i);

        const y = cd.getFullYear(), m = cd.getMonth()+1, da=cd.getDate();
        const ymd = `${y}-${String(m).padStart(2,"0")}-${String(da).padStart(2,"0")}`;
        const inMonth = cd.getMonth() === (month-1);

        const s = state.monthSummary?.[ymd];
        const free = s ? s.freeCount : 0;
        const total = s ? s.totalCount : 0;

        cells.push(`
          <button class="cellBtn ${inMonth?"":"dim"}" data-ymd="${ymd}">
            <div class="timeLabel">${da}</div>
            <div style="margin-top:6px; font-size:12px;">
              ${s ? `free: <b>${free}</b> / ${total}` : ""}
            </div>
          </button>
        `);
      }

      els.monthGrid.innerHTML = `<div class="monthGrid">${cells.join("")}</div>`;
      els.monthGrid.querySelectorAll("button[data-ymd]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const ymd = btn.getAttribute("data-ymd");
          els.picker.value = ymd;
          await renderDay_(ymd);
          showCalView_("day");
        });
      });
    }

    async function renderWeek_(anchorYmd){
      const weekStart = mondayOf_(anchorYmd || ymdLocal_());
      const data = await api.week(weekStart, state.slotMin, state.startHour, state.endHour);
      if (!data.ok) throw new Error(JSON.stringify(data));

      // 7 columns classic, smaller cells – no horizontal scroll
      const rows = [];
      for (let h=state.startHour; h<state.endHour; h++){
        for (const mm of [0, 30]) rows.push({h,mm});
      }

      const head = data.days.map(d=>`
        <div style="text-align:center; color:var(--muted); font-size:12px;">${d.date}</div>
      `).join("");

      const body = rows.map(r=>{
        const label = `${String(r.h).padStart(2,"0")}:${String(r.mm).padStart(2,"0")}`;
        const cols = data.days.map(dayObj=>{
          const slot = dayObj.slots.find(s => fmtTime_(s.from) === label);
          const free = slot ? slot.free : false;
          return `
            <button data-ymd="${dayObj.date}" class="cellBtn" style="min-height:42px; padding:6px; opacity:${free?1:.55}; ${free?"":"border-color: rgba(255,90,122,.25);"}"></button>
          `;
        }).join("");

        return `
          <div style="display:grid; grid-template-columns:70px repeat(7,1fr); gap:8px; align-items:center;">
            <div class="timeLabel">${label}</div>
            ${cols}
          </div>
        `;
      }).join("");

      els.weekGrid.innerHTML = `
        <div style="display:grid; grid-template-columns:70px repeat(7,1fr); gap:8px; margin-bottom:8px;">
          <div></div>${head}
        </div>
        <div class="scroll" style="display:flex; flex-direction:column; gap:8px;">
          ${body}
        </div>
      `;

      els.weekGrid.querySelectorAll("button[data-ymd]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const ymd = btn.getAttribute("data-ymd");
          els.picker.value = ymd;
          await renderDay_(ymd);
          showCalView_("day");
        });
      });
    }

    async function renderDay_(ymd){
      const data = await api.day(ymd, state.slotMin, state.startHour, state.endHour);
      if (!data.ok) throw new Error(JSON.stringify(data));
      state.daySlots = data.slots;

      const items = state.daySlots.map((s, idx)=>{
        const label = `${fmtTime_(s.from)} – ${fmtTime_(s.to)}`;
        const free = !!s.free;
        const tag = free ? t("app.free") : t("app.booked");

        return `
          <button class="slotBtn ${free?"free":"busy"}" data-idx="${idx}" ${free?"":"disabled"}>
            <div>${label}</div>
            <div class="tag">${tag}</div>
          </button>
        `;
      }).join("");

      els.dayList.innerHTML = `
        <div class="muted" style="margin-bottom:8px;">${ymd}</div>
        <div class="scroll" style="display:flex; flex-direction:column; gap:8px;">
          ${items}
        </div>
      `;

      els.dayList.querySelectorAll("button.slotBtn.free").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const idx = Number(btn.getAttribute("data-idx"));
          const slot = state.daySlots[idx];
          openBookingFromIndex_(ymd, idx, slot.from);
        });
      });
    }

    function openBookingFromIndex_(ymd, startIdx, startIso){
      state.booking.ymd = ymd;
      state.booking.startIso = startIso;
      state.booking.startLabel = fmtTime_(startIso);

      // build "bis" dropdown from consecutive free slots
      const options = [];
      let lastTo = null;

      for (let i=startIdx; i<state.daySlots.length; i++){
        const s = state.daySlots[i];
        if (!s.free) break;

        lastTo = s.to;
        options.push({
          toIso: s.to,
          label: fmtTime_(s.to)
        });

        // stop at endHour boundary already handled by slots generator
      }

      els.modalMeta.textContent = `${t("booking.start")}: ${state.booking.startLabel}\n${t("booking.chooseEnd")}`;
      els.modalBis.innerHTML = options.map(o=>`<option value="${o.toIso}">${o.label}</option>`).join("");
      els.modalNote.value = "";
      openModal_();
    }

    // =========================
    // 14) Dashboard + My reservations
    // =========================
    async function loadMyReservations_(){
      const data = await api.my(45);
      if (!data.ok) throw new Error(JSON.stringify(data));
      state.myReservations = data.reservations || [];
      return state.myReservations;
    }

    function pickNextReservation_(){
      const now = Date.now();
      const upcoming = (state.myReservations || []).filter(r => new Date(r.end).getTime() > now);
      return upcoming.length ? upcoming[0] : null;
    }

    function renderMyList_(){
      const list = state.myReservations || [];
      if (!list.length){
        els.myList.innerHTML = `<div class="muted">—</div>`;
        return;
      }

      els.myList.innerHTML = list.map(r=>{
        const title = r.title || "Fitness";
        const meta = `${fmtDateTime_(r.start)} – ${fmtDateTime_(r.end)}` + (r.note ? `\n${r.note}` : "");
        return `
          <div class="resItem">
            <div class="left">
              <div class="title">${title}</div>
              <div class="meta">${meta.replaceAll("\n","<br>")}</div>
            </div>
            <button class="btn" data-cancel="${r.eventId}">${t("app.cancel")}</button>
          </div>
        `;
      }).join("");

      els.myList.querySelectorAll("button[data-cancel]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-cancel");
          btn.disabled = true;
          try{
            const res = await api.cancel(id);
            if (!res.ok) throw new Error(res.error || JSON.stringify(res));
            showAppMsg(t("app.cancelOk"), "ok");
            await refreshAllAfterChange_();
          }catch(e){
            console.error(e);
            showAppMsg(t("app.cancelFail") + String(e), "err");
          }finally{
            btn.disabled = false;
          }
        });
      });
    }

    function renderNext_(){
      const next = pickNextReservation_();
      if (!next){
        els.nextTitle.textContent = t("app.nextNone");
        els.nextMeta.textContent = t("app.nextMetaNone");
        return;
      }
      els.nextTitle.textContent = t("app.nextMeta");
      els.nextMeta.textContent = `${fmtDateTime_(next.start)} – ${fmtDateTime_(next.end)}` + (next.note ? ` • ${next.note}` : "");
    }

    async function renderDashboardSafe_(){
      try{
        await loadMyReservations_();
        renderNext_();
        renderMyList_();
      }catch(e){
        console.error(e);
        showAppMsg("Backend Fehler: " + String(e), "err");
      }
    }

    async function refreshAllAfterChange_(){
      // after booking/cancel -> update my list + month + day view if open
      await loadMyReservations_();
      renderNext_();
      renderMyList_();

      // refresh month summary if in calendar view
      const ymd = els.picker.value || ymdLocal_();
      try { await renderMonth_(ymd); } catch(e){}

      // refresh day slots if day view visible
      if (els.dayList.style.display !== "none") {
        try { await renderDay_(ymd); } catch(e){}
      }
    }

      els.picker.value = els.picker.value || today;
      await renderMonth_(els.picker.value);
      showCalView_("month");
    });
    els.goMyBtn.addEventListener("click", async ()=>{
      setView_("dashboard");
      await renderDashboardSafe_();
      setTimeout(()=> els.myList.scrollIntoView({ behavior:"smooth", block:"start" }), 50);
    });
    els.refreshMyBtn.addEventListener("click", renderDashboardSafe_);

    // calendar tabs
    els.tabMonth.addEventListener("click", async ()=>{
      await renderMonth_(els.picker.value || ymdLocal_());
      showCalView_("month");
    });
    els.tabWeek.addEventListener("click", async ()=>{
      await renderWeek_(els.picker.value || ymdLocal_());
      showCalView_("week");
    });
    els.tabDay.addEventListener("click", async ()=>{
      await renderDay_(els.picker.value || ymdLocal_());
      showCalView_("day");
    });
    els.picker.addEventListener("change", async ()=>{
      await renderDay_(els.picker.value);
      showCalView_("day");
    });

    // modal buttons
    els.cancelBtn.addEventListener("click", closeModal_);
    els.modalOverlay.addEventListener("click", closeModal_);

    els.bookBtn.addEventListener("click", async ()=>{
      hideModalMsg();
      els.bookBtn.disabled = true;

      try{
        const from = state.booking.startIso;
        const to = els.modalBis.value;
        const note = els.modalNote.value || "";

        const res = await api.reserve(from, to, note);
        if (!res.ok) throw new Error(res.error || JSON.stringify(res));

        showModalMsg(t("booking.ok"), "ok");

        // auto close after short feedback
        setTimeout(async ()=>{
          closeModal_();
          await refreshAllAfterChange_();
          hideAppMsg();
          showAppMsg(t("booking.ok"), "ok");
        }, 650);

      }catch(e){
        console.error(e);
        showModalMsg(t("booking.fail") + String(e), "err");
      }finally{
        els.bookBtn.disabled = false;
      }
    });

    // settings
    els.themeSelect.addEventListener("change", ()=>{
      const v = els.themeSelect.value;
      localStorage.setItem(LS_THEME_KEY, v);
      applyTheme(v);
    });
    els.pushSelect.addEventListener("change", ()=>{
      localStorage.setItem(LS_PUSH_KEY, els.pushSelect.value);
    });
    els.slotSelect.addEventListener("change", async ()=>{
      const v = Number(els.slotSelect.value || 15);
      localStorage.setItem(LS_SLOT_KEY, String(v));
      state.slotMin = v;

      // if calendar active, refresh views
      if (state.me?.allowed && state.view === "calendar"){
        await renderMonth_(els.picker.value || ymdLocal_());
        showCalView_("month");
      }
    });

    // =========================
    // 17) Boot
    // =========================
    // theme init
    const themeMode = loadTheme();
    els.themeSelect.value = themeMode;

    // push init
    els.pushSelect.value = localStorage.getItem(LS_PUSH_KEY) || "on";

    // slot init
    els.slotSelect.value = String(state.slotMin);

    applyI18n();
    setPillState("checking");
    setLoggedOutUI_();

    (async ()=>{
      await completeSignInIfLink();

      onAuthStateChanged(auth, async (user)=>{
        hideLoginMsg();
        hideAppMsg();

        if (!user){
          setPillState("ready");
          setLoggedOutUI_();
          els.subLine.textContent = t("subLoggedOut");
          return;
        }

        state.user = user;
        setPillState("signedIn");
        els.email.value = user.email || "";

        // gate by backend: me
        try{
          const me = await api.me();
          state.me = me;

          setLoggedInUI_(me);

          if (!me.ok){
            showAppMsg("Backend Fehler: "+JSON.stringify(me), "err");
            setPillState("error");
            return;
          }

          if (!me.allowed){
            setView_("dashboard");
            els.nextTitle.textContent = t("app.nextNone");
            els.nextMeta.textContent = t("app.locked");
            return;
          }

          // default view A: Dashboard
          setView_("dashboard");
          await renderDashboardSafe_();

        }catch(e){
          console.error(e);
          showAppMsg("Backend Fehler: " + String(e), "err");
          setPillState("error");
        }

        // update sub line after login
        els.subLine.textContent = t("subLoggedIn");
      });
    })();
  </script>
</body>
</html>
