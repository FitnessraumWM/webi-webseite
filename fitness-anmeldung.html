<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitnessraum Anmeldung</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      background: #f7f7f7;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background: #fff;
      margin-top: 2em;
      max-width: 580px;
      width: 96vw;
      border-radius: 12px;
      box-shadow: 0 2px 18px #0002;
      padding: 1.6em 1em 1.2em 1em;
      text-align: center;
    }
    iframe {
      width: 100%;
      min-height: 950px;  /* zvýš podľa potreby */
      border: none;
      border-radius: 7px;
      background: #fafafa;
      margin-top: 1.2em;
    }
    @media (max-width: 600px) {
      .container { padding: 0.6em 0.1em; }
      iframe { min-height: 1250px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Anmeldung Fitnessraum Webermühle</h2>
    <p>Mit diesem Formular kannst du dich für die Nutzung des Fitnessraums anmelden.<br>
      Nur für eingeladene Teilnehmer (QR-Code erhalten).</p>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdjp9CKUQqHxTqdQPebjYdND4undD-WNM6W5DtTleZAR4SlBQ/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Wird geladen…</iframe>
  </div>
</body>
</html>
